$('board').addEventListener('pointerdown',e=>{if(!playing||paused||world.over||pointer!==null||!e.isPrimary)return;e.preventDefault();pointer=e.pointerId;$('board').setPointerCapture(pointer);aimAt(e);render()});
$('board').addEventListener('pointermove',e=>{if(e.pointerId===pointer){e.preventDefault();aimAt(e);render()}});
$('board').addEventListener('pointerup',e=>{if(e.pointerId!==pointer)return;e.preventDefault();aimAt(e);pointer=null;drop()});
$('board').addEventListener('pointercancel',()=>{pointer=null});$('board').addEventListener('lostpointercapture',()=>{pointer=null});
document.addEventListener('keydown',e=>{if(!playing||paused||world.over||e.target.matches('button,input'))return;if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')world.aim=Math.max(30,world.aim-10);if(e.key==='ArrowRight')world.aim=Math.min(370,world.aim+10);if(e.key===' '||e.key==='Enter')drop();$('aim').value=world.aim;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);
function frame(t){requestAnimationFrame(frame);if(!playing||paused||world.over){last=0;return}if(!last)last=t;acc+=Math.min((t-last)/1000,.05);last=t;
 while(acc>=1/120&&!world.over){world.step();acc-=1/120;while(world.merges.length){let e=world.merges.shift();chain=world.time-lastMerge<1?chain+1:1;lastMerge=world.time;if(e.level>=6||chain>=3){$('toast').textContent=e.level===10?'SUPERNOVA!':chain>=3?chain+' CHAIN!':e.level===9?'A STAR IS BORN!':'COSMIC MERGE!';toastUntil=world.time+1.2}remember();}}
 render();if(world.over)finish();}
applyLanguage();drawHero();resize();requestAnimationFrame(frame);
</script></body></html>
