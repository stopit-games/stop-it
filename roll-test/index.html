<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROLL BIG! | PLAY ROOM</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202943;background:#edf4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#e9f3ff,#f8eefa);min-height:100vh}.wrap{max-width:780px;margin:auto;padding:16px 14px 30px}header,.bar,.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:inherit}header a{font-weight:900;text-decoration:none;letter-spacing:1px}button{border:0;border-radius:15px;padding:11px 16px;background:#25345d;color:white;font-weight:800;cursor:pointer}button.alt{background:#fff;color:#25345d;border:1px solid #b8c6dd}h1{margin:17px 0 3px;font-size:clamp(30px,7vw,44px)}.sub{margin:0 0 14px;color:#52617d}.bar{background:#fff9;padding:10px 12px;border-radius:17px;margin-bottom:10px;font-weight:800}.game{position:relative;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 15px 35px #576baa22;touch-action:none}canvas{display:block;width:100%;aspect-ratio:1/1;max-height:min(72vh,690px);touch-action:none}.overlay{position:absolute;inset:0;background:#1c2b4b99;display:flex;align-items:center;justify-content:center;padding:20px}.panel{max-width:360px;width:100%;text-align:center;background:white;padding:25px;border-radius:24px;box-shadow:0 10px 40px #18274733}.panel h2{margin:0 0 10px;font-size:27px}.panel p{line-height:1.55}.panel button{font-size:17px}.modes{display:flex;gap:8px;justify-content:center;margin:12px 0}.modes button{font-size:13px;padding:10px}.modes button.active{background:#2877e7;color:white;border-color:#2877e7}.modes button:not(.active){background:white;color:#25345d;border:1px solid #b8c6dd}.hidden{display:none}.foot{margin-top:20px;font-size:12px;color:#52617d;justify-content:center;gap:16px}.foot a{text-decoration:none}.hint{font-size:12px;text-align:center;color:#52617d;margin:10px 0}#message{font-size:15px;color:#44516e} @media(max-width:450px){.wrap{padding:10px 9px 25px}.bar{font-size:13px}.panel{padding:20px}}
</style></head><body><div class="wrap"><header><a href="/games/">← PLAY ROOM</a><button id="lang" class="alt" type="button">日本語</button></header><h1>ROLL BIG!</h1><p class="sub" data-en="Eat smaller balls. Avoid bigger ones. Grow in 60 seconds!" data-ja="小さいボールを吸収！ 大きいボールを避けて60秒で成長しよう！">Eat smaller balls. Avoid bigger ones. Grow in 60 seconds!</p><div class="bar"><span><span data-en="TIME" data-ja="残り時間">TIME</span> <span id="time">60</span>s</span><span><span data-en="SCORE" data-ja="スコア">SCORE</span> <span id="score">0</span></span><span><span data-en="BEST" data-ja="ベスト">BEST</span> <span id="best">0</span></span></div><div class="game" id="game"><canvas id="canvas" width="640" height="640" aria-label="Roll Big game field"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="heading">ROLL BIG!</h2><p id="message">Move toward your mouse or finger. Eat smaller balls and dodge bigger ones.</p><div class="modes" id="modes"><button id="classic" type="button" class="active">CLASSIC</button><button id="bounce" type="button">BOUNCE</button></div><button id="start" type="button">START</button></div></div></div><p class="hint" data-en="Move your pointer or finger to guide the blue ball." data-ja="マウスや指で行き先を示すと、青いボールが追いかけます。">Move your pointer or finger to guide the blue ball.</p><footer class="foot"><a href="/games/" data-en="PLAY ROOM" data-ja="PLAY ROOM">PLAY ROOM</a><a href="/about.html" data-en="About" data-ja="このサイトについて">About</a><a href="/privacy.html" data-en="Privacy Policy" data-ja="プライバシーポリシー">Privacy Policy</a><a href="/contact.html" data-en="Contact" data-ja="お問い合わせ">Contact</a></footer></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),W=640,H=640;const txt={en:{start:'START',again:'PLAY AGAIN',intro:'Move toward your mouse or finger. Eat smaller balls and dodge bigger ones.',over:'GAME OVER',time:'TIME UP!',score:'Score',win:'You grew bigger!',lose:'A bigger ball got you!',bounceIntro:'Hit bigger balls to bounce away. Keep growing!',bounceWin:'Nice bouncing and growing!'},ja:{start:'スタート',again:'もう一度遊ぶ',intro:'マウスや指で行き先を示し、小さいボールを吸収。大きいボールは避けよう！',over:'ゲームオーバー',time:'時間終了！',score:'スコア',win:'大きく成長できました！',lose:'大きなボールにぶつかりました！',bounceIntro:'大きなボールにぶつかると弾き飛ばされます。成長を続けよう！',bounceWin:'弾かれながら成長できました！'}};let lang='en';try{lang=localStorage.getItem('playroom-language')==='ja'?'ja':'en'}catch(e){}let mode='classic',knock={x:0,y:0},invuln=0;let state='ready',player={x:320,y:320,r:16},target={x:320,y:320},balls=[],score=0,remain=60,last=0,spawnClock=0,raf=0;const bestKey=()=>mode==='classic'?'roll-big-best-v1':'roll-big-best-bounce-v1';function getBest(){try{return +(localStorage.getItem(bestKey())||0)}catch(e){return 0}}function saveBest(v){try{localStorage.setItem(bestKey(),String(v))}catch(e){}}function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset[lang]});$('lang').textContent=lang==='en'?'日本語':'English';$('start').textContent=state==='ready'?txt[lang].start:txt[lang].again;if(state==='ready')$('message').textContent=mode==='bounce'?txt[lang].bounceIntro:txt[lang].intro;else if(state==='over')$('message').textContent=endReason==='time'?(mode==='bounce'?txt[lang].bounceWin:txt[lang].win):txt[lang].lose}let endReason='';function chooseMode(m){if(state==='play')return;mode=m;$('classic').classList.toggle('active',m==='classic');$('bounce').classList.toggle('active',m==='bounce');$('best').textContent=getBest();applyLang()}$('classic').onclick=()=>chooseMode('classic');$('bounce').onclick=()=>chooseMode('bounce');$('lang').onclick=()=>{lang=lang==='en'?'ja':'en';try{localStorage.setItem('playroom-language',lang)}catch(e){}applyLang()};function rnd(a,b){return a+Math.random()*(b-a)}function spawn(){for(let n=0;n<30;n++){let r=rnd(7,Math.min(58,player.r*1.65+10)),x=rnd(r,W-r),y=rnd(r,H-r);if(Math.hypot(x-player.x,y-player.y)>player.r+r+65){balls.push({x,y,r,vx:rnd(-25,25),vy:rnd(-25,25),h:rnd(0,360)});return}}}function begin(){cancelAnimationFrame(raf);state='play';score=0;remain=60;player={x:320,y:320,r:16};knock={x:0,y:0};invuln=0;target={x:320,y:320};balls=[];for(let i=0;i<27;i++)spawn();$('score').textContent='0';$('best').textContent=getBest();$('overlay').classList.add('hidden');$('modes').classList.add('hidden');last=performance.now();spawnClock=0;raf=requestAnimationFrame(loop)}function end(reason){state='over';endReason=reason;const b=Math.max(getBest(),score);saveBest(b);$('best').textContent=b;$('heading').textContent=reason==='time'?txt[lang].time:txt[lang].over;$('message').textContent=reason==='time'?(mode==='bounce'?txt[lang].bounceWin:txt[lang].win):txt[lang].lose;$('start').textContent=txt[lang].again;$('overlay').classList.remove('hidden');$('modes').classList.remove('hidden')}$('start').onclick=begin;function point(ev){const rect=c.getBoundingClientRect();target.x=Math.max(player.r,Math.min(W-player.r,(ev.clientX-rect.left)/rect.width*W));target.y=Math.max(player.r,Math.min(H-player.r,(ev.clientY-rect.top)/rect.height*H))}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);point(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure)point(e)});function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f9fcff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#edf2fb';ctx.lineWidth=1;for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const b of balls){const small=b.r<player.r*.97;circle(b.x+2,b.y+4,b.r,'#24345719');circle(b.x,b.y,b.r,`hsl(${b.h} 72% ${small?'68%':'59%'})`);circle(b.x-b.r*.25,b.y-b.r*.25,b.r*.23,'#ffffff99')}circle(player.x+3,player.y+5,player.r,'#1b3a8130');circle(player.x,player.y,player.r,invuln>0?'#65aaff':'#2877e7');if(invuln>0){ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);ctx.strokeStyle='#2877e799';ctx.lineWidth=3;ctx.stroke()}circle(player.x-player.r*.26,player.y-player.r*.3,Math.max(3,player.r*.25),'#b8e7ff');ctx.fillStyle='white';ctx.font=`bold ${Math.max(12,Math.min(25,player.r*.8))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('YOU',player.x,player.y+1)}function loop(now){if(state!=='play')return;const dt=Math.min(.035,(now-last)/1000);last=now;remain=Math.max(0,remain-dt);$('time').textContent=Math.ceil(remain);invuln=Math.max(0,invuln-dt);const dx=target.x-player.x,dy=target.y-player.y,dist=Math.hypot(dx,dy),speed=185+Math.min(100,player.r*.6);if(dist>1){const step=Math.min(dist,speed*dt)*(invuln>0?.3:1);player.x+=dx/dist*step;player.y+=dy/dist*step}player.x+=knock.x*dt;player.y+=knock.y*dt;const damping=Math.exp(-5*dt);knock.x*=damping;knock.y*=damping;player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r||b.x>W-b.r)b.vx*=-1;if(b.y<b.r||b.y>H-b.r)b.vy*=-1;b.x=Math.max(b.r,Math.min(W-b.r,b.x));b.y=Math.max(b.r,Math.min(H-b.r,b.y));if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+b.r*.78){if(b.r<player.r*.97){player.r=Math.min(100,Math.sqrt(player.r*player.r+b.r*b.r*.16));score+=Math.round(b.r);$('score').textContent=score;balls.splice(i,1)}else if(mode==='bounce'){if(invuln<=0){let nx=player.x-b.x,ny=player.y-b.y,n=Math.hypot(nx,ny);if(n<.001){nx=1;ny=0;n=1}knock.x=nx/n*750;knock.y=ny/n*750;invuln=.9;player.x+=nx/n*4;player.y+=ny/n*4}}else{draw();end('hit');return}}}spawnClock+=dt;if(spawnClock>.42){spawnClock=0;if(balls.length<40)spawn()}draw();if(remain<=0){end('time');return}raf=requestAnimationFrame(loop)}$('best').textContent=getBest();applyLang();draw()})();
</script></body></html>
