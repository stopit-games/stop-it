</style></head><body><main><header><div><h1>MAZE WALK!</h1><small>v0.1 · PLAY ROOM</small></div><button class="language" id="lang">English</button></header>
<section class="menu" id="menu"><svg viewBox="0 0 190 160" aria-hidden="true"><rect x="10" y="5" width="170" height="150" rx="14" fill="#142638" stroke="#7792a8" stroke-width="5"/><path d="M40 8v90h55V40h55v85H70v28M12 125h30M95 6v15M178 70h-25" fill="none" stroke="#7792a8" stroke-width="6"/><path d="M25 25v85h30v30h107" fill="none" stroke="#a7f0d7" stroke-width="5" stroke-dasharray="6 7"/><circle cx="25" cy="25" r="10" fill="#a7f0d7"/><path d="m163 125 4 9 10 1-8 7 2 10-8-5-9 5 2-10-7-7 10-1z" fill="#ffe19b"/></svg><h2 data-ja="曲がり角の、その先へ。" data-en="A new turn. A new way."></h2><p data-ja="出口の★を目指そう。時間制限なし。" data-en="Find your way to the star. No time limit."></p><div class="choices"><label><span data-ja="サイズ" data-en="Size"></span><select id="size"><option value="7">7 × 7</option><option value="11" selected>11 × 11</option><option value="17">17 × 17</option></select></label></div><button class="primary start" id="start" data-ja="ゲームスタート →" data-en="START GAME →"></button></section>
<section class="play" id="play" hidden><div class="toolbar"><button id="back" data-ja="← メニュー" data-en="← Menu"></button><span class="badge" id="badge"></span><button id="hint" data-ja="✧ ヒント" data-en="✧ Hint"></button></div><div class="arena"><svg id="board" class="board" role="img" aria-label="迷路" viewBox="0 0 400 400"></svg><div id="finish" class="finish" hidden><h2>MAZE<br>CLEAR!</h2><p id="result"></p><button class="primary" id="next" data-ja="次の迷路 →" data-en="NEXT MAZE →"></button><button id="finishMenu" data-ja="メニュー" data-en="Menu"></button></div></div><p id="status" class="status"></p><div class="controls"><button class="up" data-dir="0" aria-label="上 / Up">↑</button><button class="left" data-dir="3" aria-label="左 / Left">←</button><button class="down" data-dir="2" aria-label="下 / Down">↓</button><button class="right" data-dir="1" aria-label="右 / Right">→</button></div></section>
<footer><a href="../games/index.html?v=tilepairs100" data-ja="← PLAY ROOMに戻る" data-en="← Back to PLAY ROOM"></a><div class="links"><a href="../about.html?v=11games" data-ja="このサイトについて" data-en="About"></a><a href="../privacy.html" data-ja="プライバシーポリシー" data-en="Privacy"></a><a href="../contact.html" data-ja="お問い合わせ" data-en="Contact"></a></div></footer></main><script>(function(root){
function generate(n,random=Math.random){
 const cells=Array.from({length:n*n},()=>[1,1,1,1]), seen=new Set([0]), stack=[0];
 const ds=[[-1,0],[0,1],[1,0],[0,-1]];
 while(stack.length){const a=stack[stack.length-1],y=Math.floor(a/n),x=a%n;
 const opts=[];ds.forEach(([dy,dx],d)=>{let yy=y+dy,xx=x+dx,b=yy*n+xx;if(yy>=0&&yy<n&&xx>=0&&xx<n&&!seen.has(b))opts.push([b,d]);});
 if(!opts.length){stack.pop();continue;}const [b,d]=opts[Math.floor(random()*opts.length)];cells[a][d]=0;cells[b][(d+2)%4]=0;seen.add(b);stack.push(b);}
 const maze={n,cells,start:0,goal:0}; const dist=Array(n*n).fill(-1),q=[0];dist[0]=0;
 for(let i=0;i<q.length;i++)for(let d=0;d<4;d++){const b=step(maze,q[i],d);if(b!==q[i]&&dist[b]<0){dist[b]=dist[q[i]]+1;q.push(b);}}
 maze.goal=dist.indexOf(Math.max(...dist));return maze;
}
function step(m,a,d){if(!Number.isInteger(d)||d<0||d>3||m.cells[a][d])return a;const b=a+[-m.n,1,m.n,-1][d];return b>=0&&b<m.n*m.n?b:a;}
function route(m,start=m.start){const prev=new Map([[start,null]]),q=[start];for(let i=0;i<q.length;i++){let a=q[i];if(a===m.goal)break;for(let d=0;d<4;d++){let b=step(m,a,d);if(!prev.has(b)){prev.set(b,a);q.push(b);}}}const p=[];for(let b=m.goal;b!==null;b=prev.get(b))p.push(b);return p.reverse();}
const api={generate,step,route};if(typeof module!=='undefined')module.exports=api;else root.Maze=api;
})(typeof window==='undefined'?globalThis:window);
</script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let lang;try{lang=localStorage.getItem('stopit-language-v1')}catch{}lang=lang==='ja'||lang==='en'?lang:(navigator.language.startsWith('ja')?'ja':'en');let m,pos,trail=[],moves=0,won=false,hint=false,pointer=null,hintTimer;const say=(ja,en)=>lang==='ja'?ja:en;
function words(){document.documentElement.lang=lang;document.querySelectorAll('[data-ja]').forEach(e=>e.textContent=e.dataset[lang]);$('lang').textContent=lang==='ja'?'English':'日本語';$('board').setAttribute('aria-label',say('迷路。矢印キー、または画面の矢印で移動。','Maze. Move using arrow keys or on-screen arrows.'));status();}
function status(){if(!m)return;$('badge').textContent=m.n+' × '+m.n+' · '+moves+say('歩',' steps');$('status').textContent=hint?say('光る道は、次の3歩。','The glowing path shows your next 3 steps.'):say('なぞる・矢印で移動','Drag to move · Arrow keys');$('result').textContent=moves+say('歩で到着！',' steps to freedom!');}
const xy=a=>[18+(a%m.n+.5)*364/m.n,18+(Math.floor(a/m.n)+.5)*364/m.n];
function draw(){const s=364/m.n;let out='<defs><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>';const points=trail.map(a=>xy(a).join(',')).join(' ');out+='<polyline points="'+points+'" fill="none" stroke="#86ddc1" stroke-opacity=".2" stroke-width="'+s*.28+'" stroke-linejoin="round" stroke-linecap="round"/>';if(hint){out+='<polyline points="'+Maze.route(m,pos).slice(0,4).map(a=>xy(a).join(',')).join(' ')+'" fill="none" stroke="#ffe19b" stroke-width="'+s*.15+'" stroke-linecap="round" stroke-linejoin="round"/>';}
let wall='';m.cells.forEach((w,a)=>{const x=18+(a%m.n)*s,y=18+Math.floor(a/m.n)*s;if(w[0])wall+=`M${x},${y}h${s}`;if(w[3])wall+=`M${x},${y}v${s}`;if(a%m.n===m.n-1&&w[1])wall+=`M${x+s},${y}v${s}`;if(Math.floor(a/m.n)===m.n-1&&w[2])wall+=`M${x},${y+s}h${s}`;});out+=`<path d="${wall}" fill="none" stroke="#8ba5b8" stroke-width="${m.n===17?2.3:3}" stroke-linecap="round"/>`;const [gx,gy]=xy(m.goal);out+=`<text x="${gx}" y="${gy}" fill="#ffe19b" text-anchor="middle" dominant-baseline="central" font-size="${s*.8}">★</text>`;const [x,y]=xy(pos);out+=`<circle cx="${x}" cy="${y}" r="${s*.26}" fill="#a7f0d7"/><circle cx="${x-s*.06}" cy="${y-s*.07}" r="${s*.08}" fill="#effff9"/>`;$('board').innerHTML=out;status();}
function start(){clearTimeout(hintTimer);m=Maze.generate(+$('size').value);pos=m.start;trail=[pos];moves=0;won=false;hint=false;pointer=null;$('menu').hidden=true;$('play').hidden=false;$('finish').hidden=true;draw();}
function menu(){pointer=null;clearTimeout(hintTimer);$('menu').hidden=false;$('play').hidden=true;}
function move(d){if(!m||won||$('play').hidden)return false;const b=Maze.step(m,pos,d);if(b===pos)return false;pos=b;moves++;trail.push(pos);if(trail.length>1000)trail.shift();hint=false;draw();if(pos===m.goal){won=true;pointer=null;$('finish').hidden=false;$('next').focus();}return true;}
$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang)}catch{}words();};$('start').onclick=start;$('next').onclick=start;$('back').onclick=menu;$('finishMenu').onclick=menu;$('hint').onclick=()=>{if(!won){hint=true;draw();clearTimeout(hintTimer);hintTimer=setTimeout(()=>{hint=false;if(!$('play').hidden)draw();},3000);}};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(+b.dataset.dir));window.addEventListener('keydown',e=>{const d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key];if(d!==undefined&&!$('play').hidden&&!won){e.preventDefault();move(d);}});
const board=$('board');function cell(e){const r=board.getBoundingClientRect(),x=((e.clientX-r.left)/r.width*400-18)/(364/m.n),y=((e.clientY-r.top)/r.height*400-18)/(364/m.n);return {x:Math.floor(x),y:Math.floor(y)};}
board.addEventListener('pointerdown',e=>{if(won||!m)return;e.preventDefault();board.setPointerCapture(e.pointerId);const c=cell(e);pointer={id:e.pointerId,x:e.clientX,y:e.clientY};const px=pos%m.n,py=Math.floor(pos/m.n);if(Math.abs(c.x-px)+Math.abs(c.y-py)===1)move(c.x>px?1:c.x<px?3:c.y>py?2:0);});
board.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||won)return;e.preventDefault();const c=cell(e),px=pos%m.n,py=Math.floor(pos/m.n);if(c.x===px&&c.y===py){pointer.x=e.clientX;pointer.y=e.clientY;return;}if(Math.abs(c.x-px)+Math.abs(c.y-py)===1){move(c.x>px?1:c.x<px?3:c.y>py?2:0);if(pointer){pointer.x=e.clientX;pointer.y=e.clientY;}return;}const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y,threshold=board.getBoundingClientRect().width/m.n*.65;if(Math.max(Math.abs(dx),Math.abs(dy))>threshold){move(Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0);if(pointer){pointer.x=e.clientX;pointer.y=e.clientY;}}});
for(const name of ['pointerup','pointercancel','lostpointercapture'])board.addEventListener(name,()=>{pointer=null;});
for(let i=0;i<24;i++){let e=document.createElement('i');e.className='spark';e.style.left=(i*41%100)+'%';e.style.animationDelay=(-i*.09)+'s';e.style.background=['#ffe19b','#a7f0d7','#83bfff'][i%3];$('finish').prepend(e);}words();})();
</script></body></html>
