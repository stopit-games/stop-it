function drawBall(){const s=ball||{x:course.tee[0],y:course.tee[1]};$('ball').setAttribute('transform',`translate(${s.x} ${s.y})`);$('ball').style.opacity=phase==='water'?'.35':phase==='win'?'0':'1';}
function status(key){$('status').textContent=t()[key];}
function terrain(){let html='';for(const s of course.sand)html+=`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="20" fill="url(#sandFill)" stroke="#ead39a" stroke-width="3"/>`;for(const w of course.water)html+=`<circle cx="${w.x}" cy="${w.y}" r="${w.r+4}" fill="#b6aa79"/><circle cx="${w.x}" cy="${w.y}" r="${w.r}" fill="url(#waterFill)"/>`;for(const w of course.walls)html+=`<rect x="${w.x+2}" y="${w.y+4}" width="${w.w}" height="${w.h}" rx="3" fill="#153c29"/><rect x="${w.x}" y="${w.y}" width="${w.w}" height="${w.h}" rx="3" fill="#b5a179" stroke="#e0cf9f" stroke-width="2"/>`;$('terrain').innerHTML=html;const [x,y]=course.cup;$('hole').innerHTML=`<circle class="cup-glow" cx="${x}" cy="${y}" r="22" fill="none" stroke="#ffe7a3" stroke-width="1" opacity=".8"/><circle cx="${x}" cy="${y}" r="15" fill="#122b22"/><circle cx="${x}" cy="${y+2}" r="11" fill="#091b14"/><path d="M${x} ${y}v-48l29 8-29 14" fill="#ff795d" stroke="#f5ecd3" stroke-width="1.8"/>`;$('course').setAttribute('aria-label',course[lang]);}
function reset(clearTrail=false){stop();phase='ready';ball=null;guided=false;$('celebration').hidden=true;if(clearTrail){points=[];$('trail').setAttribute('points','');}drawBall();updateControls();status('ready');}
function load(i){index=(i+Golf.courses.length)%Golf.courses.length;course=Golf.courses[index];attempts=0;angle=Math.atan2(course.tee[1]-course.cup[1],course.cup[0]-course.tee[0])*180/Math.PI;angle=Math.round(((angle+360)%360)*2)/2;power=45;reset(true);terrain();updateInfo();viewport();}
function tick(now){if(phase!=='flight')return;if(!last)last=now;accumulator+=Math.min((now-last)/1000,.05);last=now;while(accumulator>=Golf.DT&&phase==='flight'){Golf.step(course,ball);accumulator-=Golf.DT;if(points.length===0||Math.hypot(ball.x-points[points.length-1][0],ball.y-points[points.length-1][1])>5)points.push([ball.x,ball.y]);if(ball.phase!=='flight'){phase=ball.phase;finish();}}$('trail').setAttribute('points',points.map(p=>p.join(',')).join(' '));drawBall();if(phase==='flight')frame=requestAnimationFrame(tick);}
function finish(){updateControls();if(phase==='win'){$('status').textContent='HOLE IN ONE!';wins.add(index);updateInfo();$('winDetail').textContent=guided?t().guidewin:t().win;$('celebration').hidden=false;$('nextWin').focus({preventScroll:true});}else status(phase);}
function shoot(){if(phase==='flight'||phase==='win')return;stop();attempts++;phase='flight';ball=Golf.launch(course,angle,power);points=[[ball.x,ball.y]];updateInfo();updateControls();status('flight');frame=requestAnimationFrame(tick);}
function adjust(){if(phase==='flight'||phase==='win')return;ball=null;phase='ready';guided=false;angle=Number($('angle').value);power=Number($('power').value);drawBall();updateControls();status('ready');}
$('angle').addEventListener('input',adjust);$('power').addEventListener('input',adjust);$('shot').onclick=shoot;$('reset').onclick=()=>reset();$('hint').onclick=()=>{reset();const s=golfSolutions[course.id];angle=((s.angle%360)+360)%360;power=s.power;guided=true;updateControls();status('guided');};$('next').onclick=$('nextWin').onclick=()=>load(index+1);$('replay').onclick=()=>reset();$('start').onclick=()=>{playing=true;document.body.classList.add('playing');$('menu').hidden=true;$('game').hidden=false;load(0);};$('menuButton').onclick=()=>{stop();playing=false;document.body.classList.remove('playing');$('game').hidden=true;$('menu').hidden=false;$('start').focus({preventScroll:true});};$('language').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang);}catch{}labels();};
const board=$('course');board.addEventListener('pointerdown',e=>{if(e.button!==0||phase==='flight'||phase==='win'||drag)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{board.setPointerCapture(e.pointerId);}catch{}e.preventDefault();});board.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dist=Math.hypot(dx,dy);if(dist<7&&!drag.moved)return;drag.moved=true;const r=board.getBoundingClientRect();angle=Math.atan2(dy,-dx)*180/Math.PI;power=Math.round(Math.max(5,Math.min(100,dist/r.width*552/1.6))*2)/2;guided=false;phase='ready';ball=null;drawBall();updateControls();});board.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const moved=drag.moved;drag=null;if(moved)shoot();});function cancelDrag(){if(!drag)return;drag=null;updateControls();}board.addEventListener('pointercancel',cancelDrag);board.addEventListener('lostpointercapture',cancelDrag);document.addEventListener('touchmove',e=>{if(playing&&e.target.closest('.course'))e.preventDefault();},{passive:false});document.addEventListener('visibilitychange',()=>{last=0;accumulator=0;if(document.hidden)drag=null;});for(let i=0;i<28;i++){const el=document.createElement('i');el.style.cssText=`--x:${i*3.71}%;--delay:${-i*.11}s;--r:${i*31}deg`;$('confetti').appendChild(el);}labels();viewport();
})();
</script></body></html>
