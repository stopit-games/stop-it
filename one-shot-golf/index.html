function labels(){document.documentElement.lang=lang;for(const id of ['tagline','intro','start','back','about','privacy','contact'])$(id).textContent=t()[id];$('language').textContent=lang==='ja'?'English':'日本語';$('freeLabel').textContent=t().free;$('challengeLabel').textContent=t().challenge;$('modeNote').textContent=$('mode').value==='challenge'?t().challengeNote:t().freeNote;$('menuButton').textContent=t().menu;$('giveUp').textContent=t().giveUp;$('zoomAim').setAttribute('aria-label',t().zoom);$('zoomLabel').textContent=t().zoomLabel;$('closeZoom').setAttribute('aria-label',lang==='ja'?'拡大を閉じる':'Close zoom');$('angleLabel').textContent=t().angle;$('angle').setAttribute('aria-label',t().angle);$('powerLabel').textContent=t().power;$('reset').textContent=t().reset;$('hint').textContent=t().hint;$('nudgeLeft').setAttribute('aria-label',t().left);$('nudgeRight').setAttribute('aria-label',t().right);}

function drawAim(){const show=(phase==='ready'||phase==='miss'||phase==='water')&&!(challenge()&&session.used);$('aim').style.display=show?'':'none';const a=angle*Math.PI/180,len=215;for(const [key,v]of Object.entries({x1:course.tee[0],y1:course.tee[1],x2:course.tee[0]+Math.cos(a)*len,y2:course.tee[1]-Math.sin(a)*len}))$('aimLine').setAttribute(key,v);for(const [key,v]of Object.entries({x1:course.tee[0],y1:course.tee[1],x2:course.tee[0]+Math.cos(a)*900,y2:course.tee[1]-Math.sin(a)*900}))$('sightLine').setAttribute(key,v);$('aimZoom').setAttribute('viewBox',`${course.cup[0]-45} ${course.cup[1]-45} 90 90`);$('tee').setAttribute('cx',course.tee[0]);$('tee').setAttribute('cy',course.tee[1]);}

function status(key){$('status').textContent=t()[key];}
function terrain(){
 const poly=course.outline||[[48,48],[552,48],[552,552],[48,552]],path='M'+poly.map(p=>p.join(' ')).join('L')+'Z';
 const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]),x0=Math.min(...xs)-25,y0=Math.min(...ys)-25,w=Math.max(...xs)-x0+25,h=Math.max(...ys)-y0+38;

function reset(clearTrail=false){stop();phase='ready';ball=null;guided=false;finalScreen=false;zoomed=false;if(clearTrail)zoomDismissed=false;$('celebration').hidden=true;if(clearTrail){points=[];$('trail').setAttribute('points','');}drawBall();updateControls();status('ready');}
function load(){course=session.current;attempts=0;angle=GolfPlay.turn(Math.atan2(course.tee[1]-course.cup[1],course.cup[0]-course.tee[0])*180/Math.PI,0);if(challenge())angle=GolfPlay.turn(Math.round(angle/15)*15,0);power=challenge()?(course.suggestedStart||40):45;centerFine();reset(true);terrain();updateInfo();viewport();}
function start(){session=new GolfPlay.Session($('mode').value,$('mode').value==='challenge'?golfCatalog.challengeCourses:Golf.courses);freeWins=0;playing=true;document.body.classList.add('playing');$('menu').hidden=true;$('game').hidden=false;load();}
function menu(){stop();playing=false;document.body.classList.remove('playing');$('game').hidden=true;$('menu').hidden=false;$('start').focus({preventScroll:true});}
function advance(){if(phase==='flight')return;if(challenge()&&!session.used)session.pass();if(session.finished){result();return;}if(session.advance())load();}
function tick(now){if(phase!=='flight')return;if(!last)last=now;accumulator+=Math.min((now-last)/1000,.05);last=now;while(accumulator>=Golf.DT&&phase==='flight'){Golf.step(course,ball);accumulator-=Golf.DT;if(!points.length||Math.hypot(ball.x-points[points.length-1][0],ball.y-points[points.length-1][1])>5)points.push([ball.x,ball.y]);if(ball.phase!=='flight'){phase=ball.phase;finish();}}$('trail').setAttribute('points',points.map(p=>p.join(',')).join(' '));drawBall();if(phase==='flight')frame=requestAnimationFrame(tick);}
function result(){stop();phase='result';finalScreen=true;const score=session.score;$('status').textContent=session.abandoned?(lang==='ja'?'チャレンジ終了':'Challenge ended'):score>=3?'CHALLENGE CLEAR!':(lang==='ja'?'再チャレンジ！':'Try again!');updateInfo();updateControls();$('bigTitle').innerHTML=session.abandoned?'CHALLENGE<br>ENDED':score===5?'PERFECT!':score>=3?'CHALLENGE<br>CLEAR!':'TRY AGAIN';$('medal').textContent=`${score}/5`;$('medal').classList.add('score-medal');$('winDetail').textContent=`${score} / 5 · ${t()[session.abandoned?'ended':score===5?'perfect':score>=3?'clear':'failed']}`;$('replay').hidden=false;$('replay').textContent=t().again;$('nextWin').textContent=t().finish;$('confetti').hidden=score<3||session.abandoned;$('celebration').classList.toggle('quiet',score<3||session.abandoned);$('celebration').hidden=false;$('replay').focus({preventScroll:true});}
function finish(){if(challenge())session.complete(phase==='win');else if(phase==='win')freeWins++;updateInfo();updateControls();if(challenge()&&session.finished){$('status').textContent=phase==='win'?'HOLE IN ONE!':t().roundMiss;finishTimer=setTimeout(result,850);return;}if(phase==='win'){$('status').textContent='HOLE IN ONE!';$('bigTitle').innerHTML='HOLE<br>IN ONE!';$('medal').textContent='1';$('medal').classList.remove('score-medal');$('confetti').hidden=false;$('celebration').classList.remove('quiet');$('winDetail').textContent=challenge()?`${session.score} / 5 ✓`:guided?t().guidewin:t().win;$('replay').hidden=!!challenge();$('replay').textContent=t().replay;$('nextWin').textContent=t().next;$('celebration').hidden=false;$('nextWin').focus({preventScroll:true});}else status(challenge()?'roundMiss':phase);}
function shoot(){if(challenge()&&session.settled){advance();return;}if(phase==='flight'||phase==='win'||phase==='result'||!session.begin())return;stop();attempts++;phase='flight';ball=Golf.launch(course,angle,power);points=[[ball.x,ball.y]];updateInfo();updateControls();status('flight');frame=requestAnimationFrame(tick);}
function adjust(kind){if(phase==='flight'||phase==='win'||phase==='result'||challenge()&&session.used)return;ball=null;phase='ready';guided=false;if(kind==='angle'){angle=GolfPlay.turn(anchor,Number($('angle').value));zoomed=!zoomDismissed;}else power=Number($('power').value);drawBall();updateControls();status('ready');}

$('angle').addEventListener('input',()=>adjust('angle'));$('angle').addEventListener('change',centerFine);$('power').addEventListener('input',()=>adjust('power'));$('nudgeLeft').onclick=()=>nudge(1);$('nudgeRight').onclick=()=>nudge(-1);$('shot').onclick=shoot;$('zoomAim').onclick=()=>{zoomed=!zoomed;zoomDismissed=!zoomed;updateControls();};$('closeZoom').onclick=e=>{e.stopPropagation();zoomed=false;zoomDismissed=true;updateControls();$('zoomAim').focus({preventScroll:true});};$('giveUp').onclick=()=>{if(challenge()&&!session.finished){stop();session.giveUp();result();}};$('reset').onclick=()=>reset();$('hint').onclick=()=>{if(challenge())return;reset();const h=golfSolutions[course.id];angle=h.angle;power=h.power;guided=true;centerFine();updateControls();status('guided');};$('next').onclick=advance;$('nextWin').onclick=()=>finalScreen?menu():advance();$('replay').onclick=()=>finalScreen?start():reset();$('start').onclick=start;$('menuButton').onclick=menu;$('mode').onchange=labels;$('language').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang);}catch{}labels();};
const board=$('fieldWrap');board.addEventListener('pointerdown',e=>{if(e.button!==0||phase==='flight'||phase==='win'||phase==='result'||challenge()&&session.used||drag||e.target.closest('button'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{board.setPointerCapture(e.pointerId);}catch{}e.preventDefault();});board.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dist=Math.hypot(dx,dy);if(dist<28&&!drag.moved)return;if(dist<28)return;if(!drag.moved){angle=GolfPlay.turn(Math.atan2(dy,-dx)*180/Math.PI,0);drag.moved=true;}else angle=GolfPlay.dragAngle(angle,dx,dy);const r=$('course').getBoundingClientRect();power=Math.round(Math.max(5,Math.min(100,dist/r.width*Number($('course').getAttribute('viewBox').split(' ')[2])/1.6))*2)/2;guided=false;zoomed=!zoomDismissed;phase='ready';ball=null;centerFine();drawBall();updateControls();});board.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const moved=drag.moved;drag=null;centerFine();if(moved)status('ready');});function cancelDrag(){if(!drag)return;drag=null;centerFine();updateControls();}board.addEventListener('pointercancel',cancelDrag);board.addEventListener('lostpointercapture',cancelDrag);document.addEventListener('touchmove',e=>{if(playing&&e.target.closest('.field-wrap'))e.preventDefault();},{passive:false});document.addEventListener('visibilitychange',()=>{last=0;accumulator=0;if(document.hidden)drag=null;});for(let i=0;i<28;i++){const el=document.createElement('i');el.style.cssText=`--x:${i*3.71}%;--delay:${-i*.11}s;--r:${i*31}deg`;$('confetti').appendChild(el);}labels();viewport();
