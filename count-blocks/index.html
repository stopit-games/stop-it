<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COUNT BLOCKS! v1.0 | PLAY ROOM</title><meta name="description" content="Count hidden cubes in a free 3D block counting puzzle. Ten levels, five questions per round, no time limit. Play on mobile or desktop."><link rel="canonical" href="https://stopit-game.com/count-blocks/"><meta name="theme-color" content="#101b30"><style>
:root{color-scheme:dark;--gold:#ffe28a;--mint:#85efce}*{box-sizing:border-box}body{margin:0;background:#101b30;color:#f2f6ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:540px;margin:auto;padding:10px 14px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:23px;margin:4px 0}small,.muted{color:#b6c7df;font-size:13px}button,select{font:inherit;color:inherit;background:#243b5b;border:1px solid #758eaf;border-radius:12px;padding:11px;min-height:44px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button:disabled{cursor:default}select{width:100%;margin-top:6px}label{display:block;margin:18px 0;font-size:14px}.primary{background:#286653;border-color:var(--mint);font-weight:800;width:100%;margin-top:12px}.panel{background:#1c2c48;border:1px solid #40597b;border-radius:18px;padding:18px;margin-top:16px}.intro{font-size:14px;line-height:1.6;color:#c5d5ec}.stats{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:10px}.scene{background:radial-gradient(ellipse,#2a4260,#14213a);border:1px solid #476485;border-radius:18px;margin:10px 0;overflow:hidden}svg{display:block;width:100%;height:clamp(128px,calc(100vh - 365px),205px);height:clamp(128px,calc(100svh - 365px),205px)}.tools{display:flex;gap:8px}.tools button{flex:1;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.choices button{font-size:26px;font-weight:850;min-height:50px;transition:background .2s}.choices .wrong{background:#713644;border-color:#ff8891}.choices .correct{background:#216b50;border:2px solid #a8ffcf;box-shadow:0 0 20px #73efad80;animation:answerGlow .7s ease-in-out 2}.feedback{min-height:24px;text-align:center;font-weight:750;font-size:14px}.next{width:100%;margin-top:8px;background:#286653;font-weight:800}.result{text-align:center}.bigScore{font-size:58px;font-weight:900;color:var(--mint);margin:8px}.stars{font-size:32px;color:var(--gold);letter-spacing:5px}.record{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.record span{background:#243b5b;padding:8px 2px;border-radius:9px;font-size:12px;line-height:1.8}.record .passed{border:1px solid #85efce}.backBtn{background:transparent;margin-top:12px;width:100%}footer{text-align:center;font-size:12px;line-height:2;margin-top:24px;border-top:1px solid #354864;padding-top:12px}a{color:#b8dcff;margin:0 4px}[hidden]{display:none!important}.blast{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;background:#06102299}.blast:before{content:'';position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 10deg,#ffdb632a 0deg 9deg,transparent 9deg 22deg);animation:rays 8s linear infinite}.blast:after{content:'';position:absolute;width:75vw;height:75vw;border:4px solid var(--gold);border-radius:50%;animation:ring 1.3s ease-out forwards}.blast h2{z-index:2;width:100%;font-size:clamp(48px,13vw,115px);line-height:.98;font-weight:1000;font-style:italic;text-align:center;color:#fff0a6;text-shadow:0 5px 0 #98532c,0 0 35px #ffd45c;animation:pop .45s cubic-bezier(.16,.9,.3,1.25);margin:0;letter-spacing:-.06em}.blast.epic h2{font-size:clamp(58px,16vw,145px)}.confetti{position:absolute;top:-10%;width:10px;height:17px;animation:fall 2.2s ease-in forwards}.shake main{animation:shake .35s}.sample{margin:-6px 0 6px;background:radial-gradient(ellipse,#2c4563,transparent 70%);border-radius:14px}.sample svg{height:124px}.settingsTitle{font-size:19px;margin-top:0}@keyframes answerGlow{50%{box-shadow:0 0 28px #a8ffcfcc}}@keyframes pop{from{transform:scale(.15) rotate(-9deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes ring{from{transform:scale(.1);opacity:1}to{transform:scale(2.6);opacity:0}}@keyframes rays{to{transform:rotate(360deg)}}@keyframes fall{to{transform:translateY(120vh) rotate(650deg)}}@keyframes shake{25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><header><div><h1>COUNT BLOCKS!</h1><small>v1.0 · PLAY ROOM</small></div><button id="language">日本語</button></header>
<section id="setup" class="panel"><div class="sample"><svg id="sampleScene" viewBox="0 0 460 310" role="img" aria-label="Sample stacked cubes"></svg></div><label><span id="playLabel"></span><select id="playType"><option value="single"></option><option value="journey"></option></select></label><label id="levelWrap"><span id="levelLabel">LEVEL</span><select id="level"></select></label><p class="muted" id="savedInfo"></p><button class="primary" id="start"></button></section>
<section id="game" hidden><div class="stats"><span id="progress"></span><span id="score"></span></div><div class="scene"><svg id="scene" viewBox="0 0 460 310" role="img"></svg></div><div class="tools"><button id="rotate"></button><button id="top"></button></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" hidden></button></section>
<section id="result" class="panel result" hidden><h2 id="resultTitle"></h2><div class="stars" id="stars"></div><div class="bigScore" id="resultScore"></div><p id="resultText" class="intro"></p><div class="record" id="record"></div><button id="continue" class="primary"></button><button id="home" class="backBtn"></button></section>
<footer><a href="/games/" id="back"></a><br><a href="/about.html" id="about"></a> · <a href="/privacy.html" id="privacy"></a> · <a href="/contact.html" id="contact"></a></footer></main><div class="blast" id="blast" hidden aria-hidden="true"><h2 id="blastText"></h2></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const dict={en:{setupTitle:'Choose your challenge',intro:'How many cubes? Include hidden cubes.',playLabel:'PLAY STYLE',single:'5-Question Challenge',journey:'Complete All Levels',start:'START →',resume:'CONTINUE →',newJourney:'NEW JOURNEY →',saved:'Journey progress',rotate:'↻ Rotate view',top:'↗ View from above',normal:'↘ Normal view',question:'Q',score:'Correct',correct:'CORRECT!',wrong:'Answer:',next:'NEXT →',finish:'RESULTS →',clear:'LEVEL CLEAR!',retry:'TRY AGAIN!',perfect:'PERFECT!',all:'ALL CLEAR!',master:'PERFECT MASTER!',passText:'4 out of 5 clears a level. Great work!',retryText:'4 correct answers clear a level. Try a new set of questions.',allText:'You completed all 10 levels!',restart:'TRY FROM LEVEL 1',failedRun:'Challenge ended. Practice a level or try again from level 1.',nextLevel:'NEXT LEVEL →',again:'PLAY THIS LEVEL AGAIN',home:'Choose mode / level',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact',storage:'Progress cannot be saved in this browser.'},ja:{setupTitle:'遊び方を選ぶ',intro:'隠れた分も含めて、全部で何個？',playLabel:'遊び方',single:'5問チャレンジ',journey:'全レベル制覇',start:'スタート →',resume:'続きから →',newJourney:'新しく挑戦 →',saved:'制覇モードの進み具合',rotate:'↻ 向きを変える',top:'↗ 上から見る',normal:'↘ 元の視点',question:'問題',score:'正解',correct:'正解！',wrong:'正解は',next:'次の問題へ →',finish:'結果を見る →',clear:'LEVEL CLEAR!',retry:'TRY AGAIN!',perfect:'PERFECT!',all:'ALL CLEAR!',master:'PERFECT MASTER!',passText:'5問中4問以上でレベルクリア！',retryText:'クリアは5問中4問以上。別の問題でもう一度挑戦しましょう。',allText:'全10レベルを制覇しました！',restart:'レベル1から再挑戦',failedRun:'今回はここまで。練習して、レベル1から再挑戦！',nextLevel:'次のレベルへ →',again:'同じレベルに再挑戦',home:'モード・レベルを選ぶ',back:'← PLAY ROOMに戻る',about:'このサイトについて',privacy:'プライバシーポリシー',contact:'お問い合わせ',storage:'このブラウザでは進み具合を保存できません。'}};
const configs=[null,[2,2,2,4,6],[3,2,2,6,9],[3,3,2,9,13],[3,3,3,12,17],[4,3,3,17,23],[4,4,3,23,30],[4,4,4,30,39],[5,4,4,39,49],[5,5,5,49,65],[5,5,6,65,85]];
const STORAGE='count-blocks-progress-v03';
let lang='en',store={recent:{}},storageOK=true;
try{lang=localStorage.getItem('stopit-language-v1')==='ja'?'ja':'en';const s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(s&&s.recent){for(let l=1;l<=10;l++)if(Array.isArray(s.recent[l]))store.recent[l]=s.recent[l].filter(k=>typeof k==='string').slice(-100)}}catch{storageOK=false}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(store))}catch{storageOK=false}}
const total=a=>a.flat().reduce((s,h)=>s+h,0);
function rotateMatrix(a){return a[0].map((_,i)=>a.map(row=>row[i]).reverse())}
function trim(a){let ys=[],xs=[];a.forEach((r,y)=>r.forEach((h,x)=>{if(h){ys.push(y);xs.push(x)}}));if(!ys.length)return [];const y0=Math.min(...ys),y1=Math.max(...ys),x0=Math.min(...xs),x1=Math.max(...xs);return a.slice(y0,y1+1).map(r=>r.slice(x0,x1+1))}
function key(a){a=trim(a);const keys=[];for(let i=0;i<4;i++){keys.push(JSON.stringify(a));a=rotateMatrix(a)}return keys.sort()[0]}
function connected(a){const cells=[];a.forEach((r,y)=>r.forEach((h,x)=>{if(h)cells.push([x,y])}));if(!cells.length)return false;const seen=new Set(),q=[cells[0]];while(q.length){const [x,y]=q.pop(),k=x+','+y;if(seen.has(k)||!a[y]?.[x])continue;seen.add(k);q.push([x-1,y],[x+1,y],[x,y-1],[x,y+1])}return seen.size===cells.length}
function seeded(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
const pools={};
function pool(level){if(pools[level])return pools[level];const [w,h,max,minN,maxN]=configs[level],map=new Map();const add=a=>{const n=total(a);if(n<minN||n>maxN||!connected(a)||Math.max(...a.flat())!==max)return;const b=trim(a);map.set(key(b),b)};
if(level===1){for(let n=0;n<3**4;n++){let k=n;const a=Array.from({length:2},()=>Array.from({length:2},()=>{const v=k%3;k=Math.floor(k/3);return v}));add(a)}}else{const rand=seeded(17331+level*7919);for(let i=0;i<60000&&map.size<180;i++){const a=Array.from({length:h},()=>Array.from({length:w},()=>Math.floor(rand()*(max+1))));add(a)}}return pools[level]=[...map.values()]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectQuestions(level){const all=pool(level),recent=store.recent[level]||[],fresh=shuffle(all.filter(a=>!recent.includes(key(a)))),old=shuffle(all.filter(a=>recent.includes(key(a))));const selected=fresh.concat(old).slice(0,5);if(selected.length<5)throw Error('Insufficient question pool');store.recent[level]=recent.concat(selected.map(key)).slice(-Math.min(100,Math.max(0,all.length-5)));persist();return selected}
function rankPlan(){return shuffle([0,1,2,3,Math.floor(Math.random()*4)])}
function options(n,rank=Math.floor(Math.random()*4)){return Array.from({length:4},(_,i)=>n-rank+i)}
let runScores=[],answerRanks=[];
let screen='setup',level=1,style='single',questions=[],index=0,score=0,turn=0,high=false,answered=false,picked=null,blastTimer=null,advanceTimer=null;
function view(){let a=questions[index].map(r=>r.slice());for(let i=0;i<turn;i++)a=rotateMatrix(a);return a}
function draw(a=view(),target=$('scene'),raised=high){const cubes=[];for(let y=0;y<a.length;y++)for(let x=0;x<a[y].length;x++)for(let z=0;z<a[y][x];z++)cubes.push({x,y,z});cubes.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.z-b.z);const wx=31,hy=raised?24:15,hz=raised?17:32,faces=[];let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;const face=(pts,fill)=>{for(const[x,y]of pts){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}faces.push({pts,fill})};for(const{x,y,z}of cubes){const sx=(x-y)*wx,sy=(x+y)*hy-z*hz;face([[sx-wx,sy],[sx,sy+hy],[sx,sy+hy+hz],[sx-wx,sy+hz]],'#398da9');face([[sx,sy+hy],[sx+wx,sy],[sx+wx,sy+hz],[sx,sy+hy+hz]],'#25627e');face([[sx,sy-hy],[sx+wx,sy],[sx,sy+hy],[sx-wx,sy]],'#85e3eb')}
const scale=Math.min(1.45,420/(maxX-minX),280/(maxY-minY));const ox=230-(minX+maxX)*scale/2,oy=155-(minY+maxY)*scale/2;target.innerHTML='<g transform="translate('+ox+','+oy+') scale('+scale+')">'+faces.map(f=>'<polygon points="'+f.pts.map(p=>p.join(',')).join(' ')+'" fill="'+f.fill+'" stroke="#102b43" stroke-width="1.7" stroke-linejoin="round"/>').join('')+'</g>';target.setAttribute('aria-label',lang==='ja'?(raised?'上から斜めに見た積み木':'斜めから見た積み木'):(raised?'Cubes viewed from above':'Stacked cubes'));}

function show(name){screen=name;for(const id of ['setup','game','result'])$(id).hidden=id!==name}
function nextUnlocked(p){const a=runScores;for(let i=0;i<10;i++)if(!(a[i]>=4))return i+1;return 11}
function setupLabels(){const t=dict[lang];$('levelWrap').hidden=$('playType').value==='journey';$('start').textContent=t.start;$('savedInfo').textContent=''}
function labels(){const t=dict[lang];document.documentElement.lang=lang;$('language').textContent=lang==='en'?'日本語':'English';for(const id of ['playLabel','back','about','privacy','contact','home'])$(id).textContent=t[id];for(const id of ['playType'])for(const o of $(id).options)o.textContent=t[o.value];setupLabels();if(screen==='setup')draw([[2,1,1],[3,2,1],[1,1,1]],$('sampleScene'),false);if(screen==='game'){$('progress').textContent='LEVEL '+level+' · '+t.question+' '+(index+1)+'/5';$('score').textContent=t.score+' '+score;$('rotate').textContent=t.rotate;$('top').textContent=high?t.normal:t.top;$('next').textContent=index===4?t.finish:t.next;$('feedback').textContent=answered?(picked===total(questions[index])?t.correct:t.wrong+' '+total(questions[index])):'';draw()}if(screen==='result')resultLabels()}
function question(){answered=false;picked=null;turn=0;high=false;$('next').hidden=true;$('choices').innerHTML='';for(const n of options(total(questions[index]),answerRanks[index])){const b=document.createElement('button');b.textContent=n;b.dataset.value=n;b.onclick=()=>answer(n);$('choices').appendChild(b)}labels()}
function answer(n){if(answered||screen!=='game')return;answered=true;picked=n;const correct=total(questions[index]);if(n===correct)score++;for(const b of $('choices').children){const v=Number(b.dataset.value);b.disabled=true;if(v===correct)b.classList.add('correct');else if(v===n)b.classList.add('wrong')}$('next').hidden=n===correct;labels();if(n===correct)advanceTimer=setTimeout(()=>{advanceTimer=null;next()},1000)}
function next(){if(!answered||screen!=='game')return;clearTimeout(advanceTimer);advanceTimer=null;if(index<4){index++;question()}else finish()}
function startRound(l){clearTimeout(advanceTimer);advanceTimer=null;clearTimeout(blastTimer);$('blast').hidden=true;document.body.classList.remove('shake');level=l;index=0;score=0;questions=selectQuestions(level);answerRanks=rankPlan();show('game');question()}
function finish(){if(style==='journey'){runScores[level-1]=score}show('result');labels();if(score>=4){const complete=style==='journey'&&level===10&&nextUnlocked('relaxed')===11;celebrate(complete?(runScores.every(n=>n===5)?'PERFECT<br>MASTER!':'ALL<br>CLEAR!'):score===5?'PERFECT!':'LEVEL<br>CLEAR!',complete,score===5||complete)}}
function resultLabels(){const t=dict[lang],complete=style==='journey'&&level===10&&nextUnlocked('relaxed')===11;$('resultTitle').textContent=complete?(runScores.every(n=>n===5)?t.master:t.all):score===5?t.perfect:score>=4?t.clear:t.retry;$('stars').textContent=score===5?'★★★':score===4?'★★':'☆';$('resultScore').textContent=score+' / 5';$('resultText').textContent=(complete?t.allText:score>=4?t.passText:style==='journey'?t.failedRun:t.retryText);$('continue').textContent=style==='journey'&&score>=4&&level<10?t.nextLevel:style==='journey'?t.restart:t.again;$('record').hidden=style!=='journey';$('record').innerHTML='';if(style==='journey')for(let i=0;i<10;i++){const el=document.createElement('span'),n=runScores[i];el.className=n>=4?'passed':'';el.textContent='L'+(i+1)+' · '+(n==null?'—':n+'/5');$('record').appendChild(el)}}
function celebrate(text,epic,particles){clearTimeout(blastTimer);const el=$('blast');el.querySelectorAll('.confetti').forEach(e=>e.remove());$('blastText').innerHTML=text;el.className='blast'+(epic?' epic':'');el.hidden=false;document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');if(particles)for(let i=0;i<(epic?52:28);i++){const p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=['#ffe28a','#85efce','#b8a4ff','#fff'][i%4];p.style.animationDelay=Math.random()*.4+'s';el.appendChild(p)}blastTimer=setTimeout(()=>{el.hidden=true;document.body.classList.remove('shake')},epic?2400:1500)}
for(let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent='LEVEL '+i;$('level').appendChild(o)}
$('language').onclick=()=>{lang=lang==='en'?'ja':'en';try{localStorage.setItem('stopit-language-v1',lang)}catch{}labels()};$('playType').onchange=setupLabels;
$('start').onclick=()=>{style=$('playType').value;let l=Number($('level').value);if(style==='journey'){runScores=[];l=1}startRound(l)};
$('rotate').onclick=()=>{turn=(turn+1)%4;labels()};$('top').onclick=()=>{high=!high;labels()};$('next').onclick=next;$('continue').onclick=()=>{if(style==='journey'){if(score>=4&&level<10)startRound(level+1);else{runScores=[];startRound(1)}}else startRound(level)};$('home').onclick=()=>{clearTimeout(advanceTimer);advanceTimer=null;show('setup');labels()};labels();
</script></body></html>
