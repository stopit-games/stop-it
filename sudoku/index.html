      ? t('黄色のマスに '+values+' の候補が限られるので、薄紫のマスから外せます。',
          values+' is confined to the yellow squares in the intersecting units. Remove it from the purple squares.')
      : t('黄色の2マスは '+values+' の組なので、薄紫のマスから両方を外せます。',
          'The two yellow squares must take '+values+'. Remove both from the purple squares.');
    const next = t(
      (hint.steps > 1 ? 'さらに候補を絞ると、' : '候補を消すと、')+locationName(selected)+'は '+hint.value+' です。',
      (hint.steps > 1 ? 'After further eliminations, ' : 'After this elimination, ')+locationName(selected).toLowerCase()+' takes '+hint.value+'.'
    );
    return detail+' '+next;
  }
  if (hint) return t('今の盤面で示せるヒントが見つかりませんでした。','No hint was found for this position.');
  if (celebration?.kind === 'digit') return t(
    celebration.digit+'が9個そろいました！',
    'All nine '+celebration.digit+'s are in place!'
  );
  if (musicError) return t('BGMを読み込めませんでした。BGMボタンで再試行できます。','Music could not load. Press BGM to retry.');
  if (pencil && memoDigit) return t(
    'メモ '+memoDigit+'：空いているマスをタップ。もう一度タップすると消せます。',
    'Note '+memoDigit+': tap empty squares. Tap again to remove the note.'
  );
  if (pencil) return t('メモする数字を下から選んでください。','Choose a number below to start adding notes.');
  if (completed.has(board[selected])) return t(
    board[selected]+'は9個すべて正しい位置に入り、固定されています。',

}
function render() {
  document.documentElement.lang = lang;
  const level = t(['初級','中級','上級'],['Easy','Medium','Hard'])[stages[stageIndex][2]];
  $('stage').textContent = level+' · '+(stageIndex+1)+' / '+stages.length;

  $('board').setAttribute('aria-label',t('数独の盤面','Sudoku board'));
  $('undo').textContent = t('元に戻す','Undo');
  $('erase').textContent = t('消す','Erase');
  $('memo').textContent = t('メモ','Notes');
  $('hint').textContent = t('ヒント','Hint');
  $('memo').setAttribute('aria-pressed',pencil);
  const completed = new Set(digits.filter(digitComplete));
  digits.forEach((n,i) => {
    const button = $('keys').children[i];
    button.hidden = completed.has(n);
    if (pencil) button.setAttribute('aria-pressed', n === memoDigit);
    else button.removeAttribute('aria-pressed');
  });
  $('undo').disabled = history.length === 0;
  $('erase').disabled = !!given[selected] || completed.has(board[selected]) || !(board[selected] || notes[selected]);
  const solved = finished();
  $('hint').disabled = solved;
  const showStageActions = solved && !celebration;
  $('replay').hidden = !showStageActions;
  $('replay').textContent = t('もう一度遊ぶ','Play again');
  $('next').hidden = !showStageActions || stageIndex === stages.length - 1;
  $('next').textContent = t('次の問題へ','Next puzzle');
  const repeated = new Set(conflictCells(board));
  const related = new Set(unitCache[selected].flat());
  const selectedValue = board[selected];
  const evidence = new Set(hint?.evidence?.map(item => item.cell) ?? hint?.first?.cells ?? hint?.cells ?? []);
  const eliminated = new Set(hint?.first?.removed ?? []);
  cells.forEach((el,i) => {
    el.classList.toggle('fixed',!!given[i]);
    el.classList.toggle('completed',completed.has(board[i]));
    el.classList.toggle('related',related.has(i));
    el.classList.toggle('same-number',!!selectedValue && board[i] === selectedValue && i !== selected);
    el.classList.toggle('evidence', evidence.has(i));
    el.classList.toggle('eliminated', eliminated.has(i) && i !== selected);
    el.classList.toggle('selected',i === selected);
    el.classList.toggle('conflict',repeated.has(i));
    el.classList.toggle('box-right', col(i) === 2 || col(i) === 5);
    el.classList.toggle('box-bottom', row(i) === 2 || row(i) === 5);
    el.classList.toggle('last-col',col(i) === 8);
    el.classList.toggle('last-row',row(i) === 8);
    el.tabIndex = selected === i ? 0 : -1;
    el.setAttribute('aria-pressed',selected === i);
    const memoDigits = digits.filter(n => notes[i] & 1 << n);
    const valueLabel = board[i] || (memoDigits.length ? t('メモ ','Notes ')+memoDigits.join(', ') : t('空欄','Empty'));
    const lockLabel = completed.has(board[i]) ? t('（固定）',' (locked)') : '';
    el.setAttribute('aria-label',locationName(i)+' '+valueLabel+lockLabel);
    el.textContent = board[i] || '';
    if (memoDigits.length) {
      const marks = document.createElement('span');
      marks.className = 'marks';
      marks.setAttribute('aria-hidden','true');
      for (const n of digits) {
        const mark = document.createElement('span');
        mark.textContent = memoDigits.includes(n) ? n : '';
        marks.append(mark);

      el.append(marks);
    }
  });
  $('status').textContent = statusText(completed);
}
function stopCelebration() {
  clearTimeout(celebrationTimer);
  if (!celebration) return;
  $('board').classList.remove('is-clearing');
  cells.forEach(cell => cell.classList.remove('number-finish','clear-wave'));
  celebration = null;
}
function celebrate(kind, digit) {
  stopCelebration();
  celebration = {kind,digit};
  if (kind === 'clear') {
    $('board').classList.add('is-clearing');
    cells.forEach(cell => cell.classList.add('clear-wave'));
  } else {
    cells.forEach((cell,i) => {
      if (board[i] === digit) cell.classList.add('number-finish');
    });
  }
  celebrationTimer = setTimeout(() => { stopCelebration(); render(); }, kind === 'clear' ? 1550 : 1150);
  playCue(kind);
}

async function needAudio() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    audioContext ??= new Audio();
    if (audioContext.state !== 'running') await audioContext.resume();
    return audioContext;
  } catch { return null; }
}
function tone(ctx, output, midi, start, length, volume, shape = 'sine') {
  const oscillator = ctx.createOscillator();
  const envelope = ctx.createGain();
  oscillator.type = shape;
  oscillator.frequency.value = 440 * 2 ** ((midi - 69) / 12);
  envelope.gain.setValueAtTime(0.0001,start);
  envelope.gain.exponentialRampToValueAtTime(volume,start + 0.025);
  envelope.gain.exponentialRampToValueAtTime(0.0001,start + length);
  oscillator.connect(envelope);
  envelope.connect(output);
  oscillator.start(start);
  oscillator.stop(start + length + 0.015);
}
async function playCue(kind) {
  if (!soundEnabled) return;
  const ctx = await needAudio();
  if (!ctx || !soundEnabled) return;
  const start = ctx.currentTime + 0.02;
  if (kind === 'digit') {
    tone(ctx,ctx.destination,76,start,.34,.05);
    tone(ctx,ctx.destination,81,start + .11,.46,.045);
  } else {
    [60,67,72,76,79,84].forEach((n,i) => tone(ctx,ctx.destination,n,start + i * .09,.67,.05));
    [60,64,71].forEach(n => tone(ctx,ctx.destination,n,start + .36,1.08,.026,'triangle'));
  }
}
function loadMusic(ctx) {
  musicBufferPromise ??= (async () => {
    const response = await fetch('./soundtrack.dat');
    if (!response.ok) throw new Error('Soundtrack download failed');
    const bytes = await response.arrayBuffer();
    const keyBytes = Uint8Array.from(atob(musicAssetKey), character => character.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
    const track = await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
    return ctx.decodeAudioData(track);
  })().catch(error => {
    musicBufferPromise = undefined;
    throw error;
  });
  return musicBufferPromise;
}
async function startMusic() {
  if (!musicEnabled || musicPlayback || document.hidden) return;
  const session = musicSession;
  try {
    const ctx = await needAudio();
    if (session !== musicSession || !musicEnabled || musicPlayback || document.hidden) return;
    if (!ctx) throw new Error('Web Audio unavailable');
    const buffer = await loadMusic(ctx);
    if (session !== musicSession || !musicEnabled || musicPlayback || document.hidden) return;
    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(musicVolume,ctx.currentTime + .15);
    source.connect(gain);
    gain.connect(ctx.destination);
    source.onended = () => { source.disconnect(); gain.disconnect(); };
    source.start();
    musicPlayback = {source,gain};
  } catch {
    if (session !== musicSession || !musicEnabled) return;
    musicEnabled = false;
    musicError = true;
    save(musicKey,'off');
    render();
  }
}
function stopMusic() {
  musicSession++;
  if (!musicPlayback) return;
  const {source,gain} = musicPlayback;
  musicPlayback = undefined;
  const now = audioContext.currentTime;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setTargetAtTime(0,now,.018);
  source.stop(now + .09);
}
$('music').onclick = () => {
  musicEnabled = !musicEnabled;
  musicError = false;
  save(musicKey,musicEnabled ? 'on' : 'off');
  if (musicEnabled) startMusic();
  else stopMusic();
  render();
};
$('sound').onclick = () => {

  save(soundKey,soundEnabled ? 'on' : 'off');

};
document.addEventListener('visibilitychange',() => {
  if (document.hidden) stopMusic();
  else if (musicEnabled && audioContext) startMusic();
});
document.addEventListener('pointerdown',() => {

});
$('language').onclick = () => { lang = t('en','ja'); save(langKey,lang); render(); };
$('undo').onclick = undo;
$('replay').onclick = () => {

$('erase').onclick = () => enter(0);
$('memo').onclick = () => {

  memoDigit = 0;
  hint = null;
  render();
};
$('hint').onclick = getHint;
document.addEventListener('keydown', event => {
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  if (/^[1-9]$/.test(event.key)) { event.preventDefault(); chooseDigit(Number(event.key)); }
  if (event.key === 'Backspace' || event.key === 'Delete') { event.preventDefault(); enter(0); }
  const movement = {ArrowUp:row(selected)>0?-9:0,ArrowDown:row(selected)<8?9:0,ArrowLeft:col(selected)>0?-1:0,ArrowRight:col(selected)<8?1:0};
  if (movement[event.key] && $('board').contains(event.target)) {
    event.preventDefault();
    select(selected + movement[event.key], true);

});
