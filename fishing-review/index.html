<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>DEEP CATCH! v0.3 — PLAY ROOM</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:#eef6ff;font:16px system-ui}main{max-width:560px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:10px 0;color:#8de5d6;font-size:30px}button{font:inherit;cursor:pointer;border:1px solid #52708c;border-radius:12px;background:#243d58;color:white;padding:12px;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.stats{display:flex;justify-content:space-between;padding:14px 0}.sea{position:relative}canvas{display:block;width:100%;height:min(58vh,460px);background:#123854;border-radius:20px;touch-action:none}#message{min-height:48px;text-align:center;padding:12px 0;color:#b8e8e2}#cast{width:100%;background:#237e73;font-weight:bold}.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.note,footer{text-align:center;font-size:13px;color:#b8c9da}a{color:#a4dcf0}button:focus-visible{outline:3px solid #fdd27a}</style><main><header><h1>DEEP CATCH!</h1><button id="language">English</button></header><p class="note" id="tag"></p><div class="stats"><b id="money"></b><span id="depth"></span><span id="capacity"></span></div><div class="sea"><canvas id="sea" aria-label="Fishing area"></canvas></div><div id="message" aria-live="polite"></div><button id="cast"></button><div class="shop"><button id="upgradeDepth"></button><button id="upgradeBag"></button></div><p class="note" id="help"></p><footer><a href="/games/">PLAY ROOM</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/contact.html">Contact</a></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('sea'),ctx=canvas.getContext('2d');let ja=true,state='idle',coins=0,dl=0,bl=0,hookX=.5,targetX=.5,hookY=0,fish=[],catchList=[],last=0,result='',pointer=null,left=false,right=false;
const key='playroom-deepcatch-review-v01';try{let s=JSON.parse(localStorage.getItem(key));if(s){coins=Math.max(0,Math.min(1e9,Number(s.coins)||0));dl=Math.max(0,Math.min(12,Math.floor(s.dl)||0));bl=Math.max(0,Math.min(12,Math.floor(s.bl)||0));ja=s.ja!==false}}catch{}
const depth=()=>30+dl*15,bag=()=>3+bl,costD=()=>Math.round(35*1.65**dl),costB=()=>Math.round(45*1.7**bl);
function save(){try{localStorage.setItem(key,JSON.stringify({coins,dl,bl,ja}))}catch{}}
function labels(){document.documentElement.lang=ja?'ja':'en';$('language').textContent=ja?'English':'日本語';$('tag').textContent=ja?'深く潜って、魚を集めよう。':'Dive deeper. Bring home a bigger catch.';$('money').textContent='● '+coins;$('depth').textContent=depth()+' m';$('capacity').textContent='🐟 '+bag();$('cast').textContent=state==='idle'?(ja?'釣りに出る':'CAST LINE'):(ja?'釣り上げ中…':'FISHING…');$('cast').disabled=state!=='idle';$('upgradeDepth').textContent=(ja?'深さ +15m':'Depth +15m')+' · '+costD();$('upgradeBag').textContent=(ja?'釣れる数 +1':'Capacity +1')+' · '+costB();$('upgradeDepth').disabled=state!=='idle'||coins<costD()||dl>=12;$('upgradeBag').disabled=state!=='idle'||coins<costB()||bl>=12;$('help').textContent=ja?'指・マウス・← → で左右操作。金色★は売値3倍。限られた枠で狙う魚を選ぼう。':'Drag, move your mouse, or use ← →. Gold ★ fish sell for 3×. Choose your catch before your basket fills.';$('message').textContent=result|| (state==='down'?(ja?'潜降中…深い海へ！':'Descending… into the deep!'):state==='up'?(catchList.length>=bag()?(ja?'満杯！ 素早く引き上げます':'Full! Reeling in quickly'):(ja?'魚を集めよう！':'Collect your catch!')):(ja?'釣った収入で、深さと釣れる数を強化。':'Use your earnings to upgrade depth and capacity.'))}
function cast(){if(state!=='idle')return;state='down';hookY=0;hookX=targetX=.5;catchList=[];result='';fish=[];const total=depth();const groups=5;const startLeft=Math.random()<.5;for(let g=0;g<groups;g++){const center=g===0?.5:((g%2===0)===startLeft)?.19:.81;const d=5+(g+.5)/groups*(total-9);for(let j=0;j<(g===0?1:3);j++){const rare=j===2&&g%2===0;fish.push({x:Math.max(.05,Math.min(.95,center+(Math.random()-.5)*.12)),d:Math.max(3,Math.min(total-2,d+(Math.random()-.5)*2)),v:(Math.random()<.5?-1:1)*.008,value:(d>90?15:d>50?8:d>25?4:2)*(rare?3:1),color:rare?'#ffd166':d>90?'#df9df5':d>50?'#f9b0a4':d>25?'#8fe2ba':'#91cdef',rare,caught:false})}}labels()}
function finish(){const earned=catchList.reduce((a,f)=>a+f.value,0);coins+=earned;state='idle';result=ja?`${catchList.length}匹を売却！ +${earned} コイン`:`Sold ${catchList.length} fish! +${earned} coins`;save();labels()}
function update(dt){if(state==='idle')return;if(left)targetX-=dt*.65;if(right)targetX+=dt*.65;targetX=Math.max(.035,Math.min(.965,targetX));hookX+=(targetX-hookX)*Math.min(1,dt*12);hookY+=dt*(state==='down'?depth()/3.5:catchList.length>=bag()?-depth()/1.1:-depth()/9);if(state==='down'&&hookY>=depth()){hookY=depth();state='up';labels()}for(const f of fish){f.x+=f.v*dt;if(f.x<.06||f.x>.94)f.v*=-1;if(state==='up'&&!f.caught&&catchList.length<bag()&&Math.abs(f.d-hookY)<2.5&&Math.abs(f.x-hookX)<.065){f.caught=true;catchList.push(f);if(catchList.length===bag())labels()}}if(state==='up'&&hookY<=0)finish()}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2b9ca9');g.addColorStop(1,'#09162d');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#d7f8ed';ctx.font='13px system-ui';for(let n=0;n<=4;n++){let y=38+n*(h-65)/4;ctx.globalAlpha=.22;ctx.fillRect(0,y,w,1);ctx.globalAlpha=1;ctx.fillText(Math.round(depth()*n/4)+'m',10,y-6)}const yof=d=>38+d/depth()*(h-65);for(const f of fish){if(f.caught)continue;let x=f.x*w,y=yof(f.d);ctx.fillStyle=f.color;ctx.beginPath();ctx.ellipse(x,y,12,7,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-9,y);ctx.lineTo(x-18,y-7);ctx.lineTo(x-18,y+7);ctx.fill();ctx.fillStyle='#17243b';ctx.fillRect(x+5,y-3,3,3);if(f.rare){ctx.fillStyle='#ffe8a6';ctx.font='bold 12px system-ui';ctx.fillText('★',x-5,y-12)}}let x=hookX*w,y=yof(Math.max(0,hookY));ctx.strokeStyle='#eef9ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,y);ctx.stroke();ctx.strokeStyle='#ffd99a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+4,y,7,0,Math.PI);ctx.stroke();if(state!=='idle'){ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText(catchList.length+' / '+bag(),w-12,24);ctx.textAlign='left'}else{ctx.font='45px system-ui';ctx.fillText('⛵',w/2-24,56)}}
function frame(t){const dt=last?Math.min(.04,(t-last)/1000):0;last=t;if(!document.hidden)update(dt);draw();requestAnimationFrame(frame)}
function point(e){const r=canvas.getBoundingClientRect();targetX=(e.clientX-r.left)/r.width}canvas.addEventListener('pointerdown',e=>{pointer=e.pointerId;canvas.setPointerCapture(pointer);point(e)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||pointer===e.pointerId)point(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>pointer=null);window.addEventListener('keydown',e=>{if(state==='idle')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();left=e.key==='ArrowLeft';right=e.key==='ArrowRight'}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});window.addEventListener('blur',()=>left=right=false);$('cast').onclick=cast;$('language').onclick=()=>{ja=!ja;result='';save();labels()};$('upgradeDepth').onclick=()=>{if(state==='idle'&&dl<12&&coins>=costD()){coins-=costD();dl++;save();labels()}};$('upgradeBag').onclick=()=>{if(state==='idle'&&bl<12&&coins>=costB()){coins-=costB();bl++;save();labels()}};labels();requestAnimationFrame(frame);
</script></html>
