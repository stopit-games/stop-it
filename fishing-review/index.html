<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>DEEP CATCH! v0.4 — PLAY ROOM</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:#eef6ff;font:16px system-ui}main{max-width:390px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:10px 0;color:#8de5d6;font-size:30px}button{font:inherit;cursor:pointer;border:1px solid #52708c;border-radius:12px;background:#243d58;color:white;padding:12px;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.stats{display:flex;justify-content:space-between;padding:14px 0}.sea{position:relative}canvas{display:block;width:100%;height:min(62vh,520px);background:#123854;border-radius:20px;touch-action:none}#message{min-height:48px;text-align:center;padding:12px 0;color:#b8e8e2}#cast{width:100%;background:#237e73;font-weight:bold}.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.note,footer{text-align:center;font-size:13px;color:#b8c9da}a{color:#a4dcf0}button:focus-visible{outline:3px solid #fdd27a}</style><main><header><h1>DEEP CATCH!</h1><button id="language">English</button></header><p class="note" id="tag"></p><div class="stats"><b id="money"></b><span id="depth"></span><span id="capacity"></span></div><div class="sea"><canvas id="sea" aria-label="Fishing area"></canvas></div><div id="message" aria-live="polite"></div><button id="cast"></button><div class="shop"><button id="upgradeDepth"></button><button id="upgradeBag"></button></div><p class="note" id="help"></p><footer><a href="/games/">PLAY ROOM</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/contact.html">Contact</a></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('sea'),ctx=canvas.getContext('2d');let ja=true,state='idle',coins=0,dl=0,bl=0,hookX=.5,targetX=.5,hookY=0,fish=[],catchList=[],last=0,result='',pointer=null,left=false,right=false;
const species=[{at:0,ja:'イワシ',en:'Sardine',value:10,color:'#8ed7f3',shape:0},{at:4,ja:'クマノミ',en:'Clownfish',value:25,color:'#ffa85c',shape:1},{at:7,ja:'クラゲ',en:'Jellyfish',value:60,color:'#e9b6ef',shape:2},{at:10,ja:'エイ',en:'Ray',value:120,color:'#9baff3',shape:3},{at:13,ja:'チョウチンアンコウ',en:'Anglerfish',value:240,color:'#b5dc83',shape:4}];
const key='playroom-deepcatch-review-v02';try{let s=JSON.parse(localStorage.getItem(key));if(s){coins=Math.max(0,Math.min(1e9,Number(s.coins)||0));dl=Math.max(0,Math.min(12,Math.floor(s.dl)||0));bl=Math.max(0,Math.min(12,Math.floor(s.bl)||0));ja=s.ja!==false}}catch{}
const depth=()=>3+dl,bag=()=>3+bl,costD=()=>Math.round(35*1.65**dl),costB=()=>Math.round(45*1.7**bl);
function save(){try{localStorage.setItem(key,JSON.stringify({coins,dl,bl,ja}))}catch{}}
function labels(){document.documentElement.lang=ja?'ja':'en';$('language').textContent=ja?'English':'日本語';$('tag').textContent=ja?'深く潜って、魚を集めよう。':'Dive deeper. Bring home a bigger catch.';$('money').textContent='● '+coins;$('depth').textContent=depth()+' m';$('capacity').textContent='🐟 '+bag();$('cast').textContent=state==='idle'?(ja?'釣りに出る':'CAST LINE'):(ja?'釣り上げ中…':'FISHING…');$('cast').disabled=state!=='idle';$('upgradeDepth').textContent=(ja?'深さ +1m':'Depth +1m')+' · '+costD();$('upgradeBag').textContent=(ja?'釣れる数 +1':'Capacity +1')+' · '+costB();$('upgradeDepth').disabled=state!=='idle'||coins<costD()||dl>=12;$('upgradeBag').disabled=state!=='idle'||coins<costB()||bl>=12;$('help').textContent=ja?'指・マウス・← → で左右操作。金色★は売値3倍。限られた枠で狙う魚を選ぼう。':'Drag, move your mouse, or use ← →. Gold ★ fish sell for 3×. Choose your catch before your basket fills.';const next=species.find(f=>f.at>depth());$('tag').textContent=next?(ja?`次の魚：${next.ja} · 水深${next.at}m`:`Next: ${next.en} · ${next.at}m`):(ja?'すべての深さに到達！':'All depths reached!');$('message').textContent=result|| (state==='down'?(ja?'潜降中…深い海へ！':'Descending… into the deep!'):state==='up'?(catchList.length>=bag()?(ja?'満杯！ 素早く引き上げます':'Full! Reeling in quickly'):(ja?'魚を集めよう！':'Collect your catch!')):(ja?'釣った収入で、深さと釣れる数を強化。':'Use your earnings to upgrade depth and capacity.'))}
function cast(){if(state!=='idle')return;state='down';hookY=0;hookX=targetX=.5;catchList=[];result='';fish=[];const total=depth();for(let i=0;i<Math.min(48,10+dl*3);i++){const d=.35+Math.random()*(total-.5);const sp=[...species].reverse().find(f=>d>=f.at)||species[0];const rare=Math.random()<.14;fish.push({x:.2+Math.random()*.6,d,v:(Math.random()<.5?-1:1)*.025,value:sp.value*(rare?3:1),color:rare?'#ffd166':sp.color,shape:sp.shape,rare,caught:false})}labels()}
function finish(){const earned=catchList.reduce((a,f)=>a+f.value,0);coins+=earned;state='idle';result=ja?`${catchList.length}匹を売却！ +${earned} コイン`:`Sold ${catchList.length} fish! +${earned} coins`;save();labels()}
function update(dt){if(state==='idle')return;if(left)targetX-=dt*.65;if(right)targetX+=dt*.65;targetX=Math.max(.17,Math.min(.83,targetX));hookX+=(targetX-hookX)*Math.min(1,dt*12);hookY+=dt*(state==='down'?depth()/1.25:catchList.length>=bag()?-depth()/.55:-depth()/4.8);if(state==='down'&&hookY>=depth()){hookY=depth();state='up';labels()}for(const f of fish){f.x+=f.v*dt;if(f.x<.17||f.x>.83)f.v*=-1;if(state==='up'&&!f.caught&&catchList.length<bag()&&Math.abs(f.d-hookY)<.14&&Math.abs(f.x-hookX)<.07){f.caught=true;catchList.push(f);if(catchList.length===bag())labels()}}if(state==='up'&&hookY<=0)finish()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,ratio=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio)}ctx.setTransform(ratio,0,0,ratio,0,0);const surface=88,scale=(h-125)/Math.max(3,Math.min(6,depth()));const camera=state==='idle'?0:Math.max(0,hookY-2.5)*scale;const yof=d=>surface+d*scale-camera;ctx.fillStyle='#83c9d5';ctx.fillRect(0,0,w,h);let water=ctx.createLinearGradient(0,0,0,h);water.addColorStop(0,'#258f9f');water.addColorStop(1,'#102b4d');ctx.fillStyle=water;ctx.fillRect(0,Math.max(0,yof(0)),w,h);for(const side of [0,1]){ctx.fillStyle='#34495b';ctx.beginPath();ctx.moveTo(side?w:0,0);for(let y=0;y<=h+15;y+=15){let world=y+camera;let edge=32+9*Math.sin(world*.025)+5*Math.sin(world*.061);ctx.lineTo(side?w-edge:edge,y)}ctx.lineTo(side?w:0,h);ctx.closePath();ctx.fill()}ctx.font='12px system-ui';ctx.fillStyle='#c2e5ea';for(let d=1;d<=depth();d++){let y=yof(d);if(y<0||y>h)continue;ctx.fillText(d+'m',w-29,y)}for(const f of fish){if(f.caught)continue;const x=f.x*w,y=yof(f.d);if(y<-20||y>h+20)continue;ctx.fillStyle=f.color;ctx.beginPath();if(f.shape===2){ctx.arc(x,y,11,Math.PI,0);ctx.lineTo(x+9,y+8);ctx.lineTo(x,y+4);ctx.lineTo(x-9,y+8)}else if(f.shape===3){ctx.moveTo(x,y-10);ctx.lineTo(x+17,y);ctx.lineTo(x,y+10);ctx.lineTo(x-17,y)}else{ctx.ellipse(x,y,f.shape===4?14:12,f.shape===0?5:8,0,0,Math.PI*2)}ctx.fill();if(f.shape!==2&&f.shape!==3){ctx.beginPath();ctx.moveTo(x-9,y);ctx.lineTo(x-18,y-7);ctx.lineTo(x-18,y+7);ctx.fill()}if(f.shape===1){ctx.fillStyle='#fff6';ctx.fillRect(x-4,y-7,4,14)}if(f.shape===4){ctx.strokeStyle='#c9ec9a';ctx.beginPath();ctx.moveTo(x+3,y-6);ctx.quadraticCurveTo(x+7,y-23,x+16,y-15);ctx.stroke();ctx.fillStyle='#fff2a0';ctx.fillRect(x+14,y-17,5,5)}ctx.fillStyle='#152439';ctx.fillRect(x+5,y-3,3,3);if(f.rare){ctx.font='bold 12px system-ui';ctx.fillStyle='#ffe8a6';ctx.fillText('★',x-5,y-13)}}const sy=yof(0);if(sy>-50){const bob=Math.sin(performance.now()/700)*2,x=w/2;ctx.fillStyle='#cc925c';ctx.beginPath();ctx.moveTo(x-40,sy-11+bob);ctx.lineTo(x+35,sy-11+bob);ctx.lineTo(x+24,sy+4+bob);ctx.lineTo(x-28,sy+4+bob);ctx.fill();ctx.fillStyle='#f1cca4';ctx.beginPath();ctx.arc(x-8,sy-42+bob,7,0,7);ctx.fill();ctx.strokeStyle='#f4bd62';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x-8,sy-34+bob);ctx.lineTo(x-8,sy-17+bob);ctx.stroke();ctx.strokeStyle='#e9d7bf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-5,sy-27+bob);ctx.lineTo(x+12,sy-29+bob);ctx.lineTo(x+35,sy-52+bob);ctx.stroke()}const x=hookX*w,y=yof(Math.max(0,hookY));ctx.strokeStyle='#edf8ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2+35,Math.min(sy-52,0));ctx.lineTo(x,y);ctx.stroke();ctx.strokeStyle='#ffe4a3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+3,y,6,0,Math.PI);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='right';ctx.fillText(catchList.length+' / '+bag(),w-45,22);ctx.textAlign='left'}
function frame(t){const dt=last?Math.min(.04,(t-last)/1000):0;last=t;if(!document.hidden)update(dt);draw();requestAnimationFrame(frame)}
function point(e){const r=canvas.getBoundingClientRect();targetX=(e.clientX-r.left)/r.width}canvas.addEventListener('pointerdown',e=>{pointer=e.pointerId;canvas.setPointerCapture(pointer);point(e)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||pointer===e.pointerId)point(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>pointer=null);window.addEventListener('keydown',e=>{if(state==='idle')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();left=e.key==='ArrowLeft';right=e.key==='ArrowRight'}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});window.addEventListener('blur',()=>left=right=false);$('cast').onclick=cast;$('language').onclick=()=>{ja=!ja;result='';save();labels()};$('upgradeDepth').onclick=()=>{if(state==='idle'&&dl<12&&coins>=costD()){coins-=costD();dl++;save();labels()}};$('upgradeBag').onclick=()=>{if(state==='idle'&&bl<12&&coins>=costB()){coins-=costB();bl++;save();labels()}};labels();requestAnimationFrame(frame);
</script></html>
