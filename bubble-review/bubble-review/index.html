const text={ja:{ammo:'残りの玉',score:'スコア',stage:'ステージ',help:'遊び方',restart:'やり直す',ready:'短い点線で反射方向を予想。狙って、指を離す。',flying:'',miss:'くっついた！ 次は同じ色を3個以上に。',pop:n=>n+'個消えた！',drop:(m,d)=>m+'個消して、さらに'+d+'個落下！',sideTitle:'狙いを変えると、\n一気に変わる。',sideText:'同じ色を3個以上つなげて消そう。支えを失った玉はまとめて落下。上のかたまりを狙うと、大きな一手に。',sideRule:'時間制限なし。ゆっくり狙おう。',sideRuleText:'CASCADEは着地点表示・次の3個・大量落下・新しい玉の追加。上部のCASCADEボタンでCLASSICに切り替えられます。',silent:'確認版は無音です。音楽・効果音は遊び心地を確認した後に選びます。',clear:'STAGE CLEAR!',clearText:n=>'すべての玉を消しました。'+n+'点！',lost:'もう一度、狙おう。',lostAmmo:'持ち玉を使い切りました。支えを消す順番を変えてみよう。',lostLine:'玉が下のラインに届きました。上のかたまりを狙ってみよう。',next:'次のステージ',again:'もう一度',all:'8面クリア！',allText:'すべての面をクリアしました。好きな面で記録に挑戦できます。',choose:'ステージを選ぶ',helpTitle:'遊び方',instructions:'<p>① 盤面をタップすると、その方向へ玉を発射します。指やマウスを動かしてから離すと、狙いを調整して発射できます。</p><p>② 同じ色の玉が3個以上つながると消えます。天井につながらなくなった玉は、色に関係なく落ちます。</p><p>③ 左右の壁で玉が反射します。点線は着地点まで続き、反射点を白い印、くっつく位置を丸い輪で示します。天井に当たった玉はくっつきます。手元の玉と「次」の色を見て、奥のかたまりを狙ってみましょう。</p><p>④ すべての玉を消せばクリア。持ち玉がなくなるか、玉が下のラインに届くと終了です。時間制限はありません。</p><p>キーボード：盤面を選択し、← → で狙い、Space / Enter で発射。マウスは盤面内でドラッグを開始すれば、枠外へ動かしても照準を維持し、離すと発射します。枠外でのクリックからは発射しません。タッチ操作で枠外に指を離した場合や下向きの操作は取り消します。</p>',helpNote:'試作は8面。どの面からでも試せます。各面の持ち玉でクリアに到達できる手順をプログラム検証済み。人が感じる難しさと実機操作は確認中です。',nextBall:'次',now:'発射',clearCount:'クリア',back:'← PLAY ROOM',about:'このサイトについて',privacy:'プライバシーポリシー',contact:'お問い合わせ',canvas:'バブルシューター。指で狙って離すと発射。矢印キーとスペースでも操作できます。',close:'閉じる'},en:{ammo:'BALLS LEFT',score:'SCORE',stage:'STAGE',help:'How to play',restart:'Restart',ready:'Follow the full guide to the landing ring. Aim and release.',flying:'',miss:'Attached! Line up 3 or more of the same color.',pop:n=>n+' bubbles popped!',drop:(m,d)=>m+' popped. '+d+' more dropped!',sideTitle:'A small angle.\nA big difference.',sideText:'Connect 3 or more of the same color. Bubbles that lose their link to the ceiling fall away. Aim for the supporting clusters.',sideRule:'No timer. Take your time.',sideRuleText:'CASCADE: full landing guide, next three bubbles, big drops, and new rows. Use the CASCADE button above to switch to CLASSIC.',silent:'This review is silent. We will choose music and sound effects after checking the feel of play.',clear:'STAGE CLEAR!',clearText:n=>'Every bubble cleared. '+n+' points!',lost:'TRY ANOTHER ANGLE.',lostAmmo:'Out of bubbles. Try clearing the supporting clusters first.',lostLine:'The bubbles reached the lower line. Aim higher into the clusters.',next:'Next stage',again:'Try again',all:'ALL 8 CLEARED!',allText:'You cleared every stage. Revisit a stage and beat your best.',choose:'Choose a stage',helpTitle:'How to play',instructions:'<p>1. Tap the board to fire toward that point. Drag your finger or mouse, then release to fine-tune your aim and shoot.</p><p>2. Connect 3 or more bubbles of the same color to pop them. Any bubbles no longer connected to the ceiling fall away, whatever their color.</p><p>3. Bounce shots off the side walls. The short dotted guide hints at the first bounce without revealing the landing spot. Bubbles stick when they reach the ceiling. Check your current and next bubble to plan a route into the clusters.</p><p>4. Clear every bubble to win. The round ends when you run out of shots or bubbles reach the lower line. There is no timer.</p><p>Keyboard: focus the board; use ← → to aim and Space / Enter to shoot. Start a mouse drag on the board; you can continue aiming outside its frame and release to shoot. Clicks outside the board never start a shot. Releasing a touch outside the board or aiming downward cancels the shot.</p>',helpNote:'8 review stages, all available to try. A clear path within the shot budget has been programmatically verified for each stage. Human difficulty and device controls still need testing.',nextBall:'NEXT',now:'FIRE',clearCount:'cleared',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact',canvas:'Bubble shooter. Drag and release to shoot, or use arrow keys and Space.',close:'Close'}};
const palette=['#ef829d','#64cddd','#e8bf68','#a79af0','#83c59b'],marks=['●','◆','—','✦','••'];
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,done,best}));}catch(e){}}
function render(){needsDraw=true;const t=text[lang];document.documentElement.lang=lang;$('lang').textContent=lang==='ja'?'EN':'日本語';$('lang').setAttribute('aria-label',lang==='ja'?'Switch to English':'日本語に切替');for(const [id,key] of Object.entries({ammoLabel:'ammo',scoreLabel:'score',help:'help',restart:'restart',sideText:'sideText',sideRule:'sideRule',sideRuleText:'sideRuleText',silent:'silent',helpTitle:'helpTitle',chooseTitle:'choose',helpNote:'helpNote',back:'back',about:'about',privacy:'privacy',contact:'contact'}))$(id).textContent=t[key];$('sideTitle').textContent=t.sideTitle;$('sideTitle').style.whiteSpace='pre-line';$('sideBack').textContent=t.back;$('instructions').innerHTML=t.instructions;$('close').setAttribute('aria-label',t.close);canvas.setAttribute('aria-label',t.canvas);$('ammo').textContent=state.ammo;$('score').textContent=state.score.toLocaleString(lang==='ja'?'ja-JP':'en-US');$('stage').textContent=(mode==='cascade'?'CASCADE · ':'CLASSIC · ')+t.stage+' '+(state.level+1)+' / 8';$('mode').textContent=mode==='cascade'?'CASCADE ▾':'CLASSIC ▾';const count=lastEvent.matched.length,d=lastEvent.dropped.length;$('message').textContent=lastEvent.wave?(lang==='ja'?'新しい玉が上から登場！':'New bubbles incoming!'):note==='drop'?t.drop(count,d):note==='pop'?t.pop(count):t[note]??t.ready;$('message').dataset.good=String(good);$('end').hidden=state.status==='playing'||Boolean(flight);if(state.status!=='playing'&&!flight){const clear=state.status==='clear',all=done.every(Boolean);$('endTag').textContent=clear?'NICE SHOT!':'TAKE YOUR TIME';$('endTitle').textContent=clear?(all?t.all:t.clear):t.lost;$('endText').textContent=clear?(all?t.allText:t.clearText(state.score)):(state.ammo<=0?t.lostAmmo:t.lostLine);$('continue').textContent=clear&&state.level<7?t.next:t.again;}$('stages').innerHTML=C.LEVELS.map((l,i)=>'<button type="button" data-stage="'+i+'" class="'+(i===state.level?'current ':'')+(done[i]?'done':'')+'" aria-label="'+t.stage+' '+(i+1)+(done[i]?' ✓':'')+'">'+(i+1)+' function load(n){flight=null;particles=[];waveAnimation=0;state=C.create(n,mode);aim=0;note='ready';good=false;lastEvent={matched:[],dropped:[]};last=0;save();render();}
function fire(){if(flight||state.status!=='playing'||$('dialog').open||document.hidden)return;const result=C.shoot(state,aim);if(!result)return;let length=0,parts=[];for(let i=1;i<result.event.path.length;i++){const a=result.event.path[i-1],b=result.event.path[i],d=Math.hypot(b.x-a.x,b.y-a.y);parts.push({a,b,d,start:length});length+=d;}flight={result,parts,length,travel:0,color:state.current};note='flying';good=false;render();}
function finishFlight(){const r=flight.result;state=r.state;lastEvent=r.event;const count=r.event.matched.length;good=count>0;note=r.event.dropped.length?'drop':count?'pop':'miss';const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;for(const b of r.event.matched){const p=C.point(b.r,b.c);if(!reduced)for(let n=0;n<5;n++){const a=n*Math.PI*2/5;particles.push({x:p.x,y:p.y,vx:Math.cos(a)*70,vy:Math.sin(a)*70,life:.38,max:.38,color:b.color,small:true});}}for(const b of r.event.dropped){const p=C.point(b.r,b.c);particles.push({x:p.x,y:p.y,vx:(b.c%3-1)*25,vy:40,life:reduced?.15:.65,max:reduced?.15:.65,color:b.color,small:false});}particles=particles.slice(-180);if(r.event.wave)waveAnimation=performance.now();flight=null;if(state.status==='clear'){done[state.level]=true;best[state.level]=Math.max(best[state.level],state.score);}save();render();}
function blocksShot(e){const hit=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):e.target;return Boolean(hit&&hit.closest&&hit.closest('button,a,dialog,input,select,textarea,summary,[role="button"]'));}
// v0.3: keep the last valid aim while dragging beyond the court; never fire from a fresh outside click.
function aimAt(e,allowOutside=false){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*C.W,y=(e.clientY-r.top)/r.height*C.H;const inside=x>=0&&x<=C.W&&y>=0&&y<=C.H;const insidePage=e.clientX>=0&&e.clientY>=0&&e.clientX<=(window.innerWidth||Infinity)&&e.clientY<=(window.innerHeight||Infinity);const permitted=(inside||allowOutside&&insidePage)&&y<C.LAUNCH.y-30&&!blocksShot(e);if(permitted){validDrag=true;needsDraw=true;aim=Math.max(-75,Math.min(75,Math.atan2(x-C.LAUNCH.x,C.LAUNCH.y-y)*180/Math.PI));}else if(!drag){validDrag=false;}return permitted;}
function startAim(e){if(e.button!==0||flight||state.status!=='playing'||$('dialog').open||document.hidden)return;drag=true;validDrag=false;aimAt(e,e.pointerType==='mouse');try{canvas.setPointerCapture(e.pointerId);}catch(_){}canvas.focus({preventScroll:true});}

canvas.addEventListener('pointerdown',startAim);
canvas.addEventListener('pointermove',e=>{if(drag)aimAt(e,e.pointerType==='mouse');else if(e.pointerType==='mouse'&&!flight&&state.status==='playing'&&!$('dialog').open)aimAt(e,true);});

canvas.addEventListener('pointercancel',()=>{drag=false;validDrag=false;});canvas.addEventListener('lostpointercapture',()=>{drag=false;});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.target===canvas||flight||state.status!=='playing'||$('dialog').open)return;aimAt(e,true);});
// A click outside the board does not begin a shot; dragging started on the board stays captured.
window.addEventListener('blur',()=>{drag=false;validDrag=false;});
canvas.addEventListener('keydown',e=>{if($('dialog').open)return;if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();needsDraw=true;if(e.key==='ArrowLeft')aim=Math.max(-75,aim-2);else if(e.key==='ArrowRight')aim=Math.min(75,aim+2);else if(!e.repeat)fire();}});
$('mode').onclick=()=>{mode=mode==='cascade'?'classic':'cascade';load(0);};$('restart').onclick=()=>load(state.level);$('continue').onclick=()=>load(state.status==='clear'&&state.level<7?state.level+1:state.level);$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang);}catch(e){}render();};$('help').onclick=()=>{$('dialog').showModal();last=0;drag=false;};$('close').onclick=()=>{$('dialog').close();last=0;};$('stages').onclick=e=>{const b=e.target.closest('[data-stage]');if(b){load(Number(b.dataset.stage));$('dialog').close();}};document.addEventListener('visibilitychange',()=>{last=0;drag=false;needsDraw=true;});
function bubble(x,y,color,r=C.R,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);const g=ctx.createRadialGradient(x-r*.28,y-r*.35,r*.05,x,y,r);g.addColorStop(0,'#efffff');g.addColorStop(.13,palette[color]);g.addColorStop(.75,palette[color]);g.addColorStop(1,'#253c55');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=palette[color];ctx.lineWidth=.8;ctx.stroke();if(r>8){ctx.fillStyle='#102739b8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.round(r*.75)+'px system-ui';ctx.fillText(marks[color],x,y+1);ctx.beginPath();ctx.arc(x-r*.28,y-r*.35,r*.16,0,Math.PI*2);ctx.fillStyle='#ffffff85';ctx.fill();}ctx.restore();}
function draw(){ctx.setTransform(canvas.width/C.W,0,0,canvas.height/C.H,0,0);ctx.clearRect(0,0,C.W,C.H);const bg=ctx.createLinearGradient(0,0,0,C.H);bg.addColorStop(0,'#14283e');bg.addColorStop(1,'#0b182a');ctx.fillStyle=bg;ctx.fillRect(0,0,C.W,C.H);ctx.fillStyle='#badde312';for(let r=0;r<14;r++)for(let c=0;c<C.cols(r);c++){const p=C.point(r,c);ctx.beginPath();ctx.arc(p.x,p.y,.9,0,Math.PI*2);ctx.fill();}ctx.save();ctx.setLineDash([4,7]);ctx.strokeStyle=state.board.some(b=>C.point(b.r,b.c).y>330)?'#f0ac83a0':'#748aa43d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,C.LIMIT);ctx.lineTo(C.W-10,C.LIMIT);ctx.stroke();ctx.restore();
if(!flight&&state.status==='playing'&&!$('dialog').open){

 if(mode==='cascade'){ctx.save();ctx.beginPath();ctx.moveTo(p0.x,p0.y);for(const p of ray.path.slice(1))ctx.lineTo(p.x,p.y);ctx.strokeStyle='#c6f9e8b8';ctx.lineWidth=1.8;ctx.setLineDash([3,7]);ctx.stroke();if(ray.target){const p=C.point(ray.target.r,ray.target.c);ctx.setLineDash([]);ctx.strokeStyle='#ffffffc9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,17,0,Math.PI*2);ctx.stroke();}ctx.restore();}
 if(mode!=='cascade'){
 // Show direction, not the answer: up to the first bounce and only a short
 // continuation after it. No landing circle or exact target indicator.
 let remaining=260,firstBounce=false,pts=[p0];
 for(let i=1;i<ray.path.length&&remaining>0;i++){
  const a=ray.path[i-1],b=ray.path[i],dist=Math.hypot(b.x-a.x,b.y-a.y);
  const step=Math.min(dist,remaining);
  pts.push({x:a.x+(b.x-a.x)*step/dist,y:a.y+(b.y-a.y)*step/dist});
  remaining-=step;
  if(i<ray.path.length-1){firstBounce=true;remaining=Math.min(remaining,70);}
  if(step<dist)break;
 }
 ctx.save();ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p0.x,p0.y);
 for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
 ctx.setLineDash([3,7]);ctx.strokeStyle='#d8fff3c8';ctx.lineWidth=2.1;ctx.stroke();
 if(firstBounce&&pts.length>=2){const bounce=ray.path[1];
  if(Math.hypot(pts[1].x-bounce.x,pts[1].y-bounce.y)<.01){
   ctx.setLineDash([]);ctx.beginPath();ctx.arc(bounce.x,bounce.y,3.5,0,Math.PI*2);
   ctx.fillStyle='#b6ffe5';ctx.fill();
  }
 }
 ctx.restore();}
}
for(const b of state.board){const p=C.point(b.r,b.c);const offset=waveAnimation?Math.max(0,1-(performance.now()-waveAnimation)/480)*(-C.DY*2):0;bubble(p.x,p.y+offset,b.color);}for(const p of particles)bubble(p.x,p.y,p.color,p.small?3.1:C.R,p.life/p.max);
ctx.save();ctx.translate(C.LAUNCH.x,C.LAUNCH.y);ctx.rotate(aim*Math.PI/180);ctx.strokeStyle='#6f93a8';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,-26);ctx.stroke();ctx.strokeStyle=palette[state.current];ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,-27);ctx.stroke();ctx.restore();ctx.strokeStyle='#344f65';ctx.lineWidth=1;ctx.beginPath();ctx.arc(C.LAUNCH.x,C.LAUNCH.y,25,0,Math.PI*2);ctx.stroke();if(!flight)bubble(C.LAUNCH.x,C.LAUNCH.y,state.current,19);if(mode==='cascade'){for(let i=0;i<3;i++)bubble(C.LAUNCH.x+49+i*27,C.LAUNCH.y+7,state.queue[i],10);}else bubble(C.LAUNCH.x+77,C.LAUNCH.y+7,state.next,12);ctx.fillStyle='#9fb4c8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='9px system-ui';ctx.fillText(mode==='cascade'?(lang==='ja'?'次の3個':'NEXT 3'):text[lang].nextBall,C.LAUNCH.x+77,C.LAUNCH.y+30);ctx.fillText(text[lang].now,C.LAUNCH.x,C.LAUNCH.y+34);
if(flight){let p=flight.parts[flight.parts.length-1].b;for(const s of flight.parts){if(flight.travel<=s.start+s.d){const k=Math.min(1,Math.max(0,(flight.travel-s.start)/s.d));p={x:s.a.x+(s.b.x-s.a.x)*k,y:s.a.y+(s.b.y-s.a.y)*k};break;}}bubble(p.x,p.y,flight.color);}}
function frame(now){if(!document.hidden&&!$('dialog').open){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(flight){flight.travel+=dt*690;if(flight.travel>=flight.length)finishFlight();}for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;}particles=particles.filter(p=>p.life>0&&p.y<C.H+20);}else last=0;if(waveAnimation&&now-waveAnimation>480)waveAnimation=0;if(!document.hidden&&(needsDraw||flight||particles.length||waveAnimation)){draw();needsDraw=false;}requestAnimationFrame(frame);}
const observer=new ResizeObserver(()=>{const r=canvas.getBoundingClientRect(),scale=Math.min(window.devicePixelRatio||1,2);if(r.width>0&&r.height>0){canvas.width=Math.round(r.width*scale);canvas.height=Math.round(r.height*scale);needsDraw=true;}});observer.observe(canvas);save();render();requestAnimationFrame(frame);
