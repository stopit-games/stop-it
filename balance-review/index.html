$('loose').innerHTML=l.fixed.map(([p,w])=>hanger(p,[],w)).join('')+[...new Set(placement.filter(p=>p!==null))].map(p=>hanger(p,placement.map((x,i)=>x===p?i:-1).filter(i=>i>=0),null)).join('');
$('tray').innerHTML=l.weights.map((w,i)=>'<button data-weight="'+i+'" class="'+(selected===i?'selected ':'')+(placement[i]!==null?'placed':'')+'" '+(running?'disabled ':'')+'aria-pressed="'+(selected===i)+'" aria-label="'+t.weight+' '+w+(placement[i]!==null?' '+t.return:'')+'">'+(placement[i]!==null?'↩ '+w:'<span class="weight" data-w="'+w+'">'+w+'</span>')+'</button>').join('');draw()}
function draw(){const t=texts[lang],l=E.levels[index];$('beam').style.transform='rotate('+((sim?.angle||0)*180/Math.PI)+'deg)';let message=note;$('scene').classList.toggle('cleared',sim?.status==='clear');const sliding=sim?.bodies.some(b=>Math.abs(b.v)>.04),danger=sim&&(sliding||Math.abs(sim.angle)>Math.atan(l.grip)*.78);$('scene').classList.toggle('danger',Boolean(sim?.status==='running'&&danger));for(const group of $('loose').querySelectorAll('.hanger-group')){let x=null,lost=false;if(sim&&!group.classList.contains('locked-group')){const ids=group.dataset.group.split(',').map(Number),body=sim.bodies.find(b=>b.ids.includes(ids[0]));if(body){x=body.x;lost=body.lost}}if(x!==null)group.style.left=((x+l.range+.6)/(2*(l.range+.6))*100)+'%';group.querySelector('.hang-line').style.transform='translateY('+(lost?100:0)+'px) rotate('+(-(sim?.angle||0)*180/Math.PI)+'deg)';group.classList.toggle('dropped',lost)}if(sim){if(sim.status==='running')message=sim.time>=3?'settle':danger?'danger':'hold';else if(sim.status==='clear')message=stars.every(n=>n>0)?'finish':sim.rating===3?'perfect':sim.rating===1?'close':'clear';else message=sim.status}

function edit(){if(sim?.status==='running')return false;stop();hintPos=null;return true}
