ing:'Still sliding. Try a different arrangement.',hint:'Choose the gold-outlined weight and dotted mark.',hintRemove:'Use the selected ↩ tray button, then ask for another hint.',release:'▶ Let go',retry:'↻ Rearrange',undo:'↶ Undo',hintButton:'✧ Hint',next:'Next puzzle →',finish:'All 10 cleared! Try for ★★★ on every puzzle.',fit:'↔ See whole beam',zoom:'＋ Enlarge marks',scroll:'Swipe sideways inside the beam area.',legend:'Small numbers = distance　▣ = fixed weight',settings:'Settings',dialog:'This review has no music or sound effects. We will choose them together after testing the game.',rulesTitle:'How to play & ratings',rules:'<p>Choose a colored weight, then tap an empty mark. Tap a placed weight followed by an empty mark to move it. Use its ↩ tray button to take it off. The beam stays locked while you plan.</p><p>Place every weight, then Let go. The beam sways; loose weights slide when it tips too far. Keep them on for 3 seconds and let the motion settle to clear. If weights are still sliding after 3 seconds, judging continues.</p><p>Level = ★★★, stable with a tilt = ★★, holding on at a risky angle = ★. All count as a clear. Marks grow from 3 to 5 to 7 on each side. Swipe inside the beam area or use See whole beam.</p><p>Hint gives one level solution. Other arrangements also win if nothing falls. Locked beige weights hang under the beam.</p>',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact',weight:'Weight',left:'Left ',right:'Right ',empty:'empty',return:'return',completed:'cleared',mark:'marks',pause:'Paused'}};

function getHint(){return E.hint(E.levels[index],placement)}
let hintPos=null;
function render(){const t=texts[lang],l=E.levels[index],running=sim?.status==='running';document.documentElement.lang=lang;$('lang').textContent=lang==='ja'?'English':'日本語';$('tag').textContent=t.tag;$('settings').setAttribute('aria-label',t.settings);$('levelTitle').textContent=(lang==='ja'?'問題 ':'PUZZLE ')+(index+1)+' / 10';$('wins').textContent=stars.filter(n=>n>0).length+' / 10 '+t.completed;$('mission').textContent=t.mission;$('trayLabel').textContent=t.tray;$('legend').textContent=t.legend;$('rulesTitle').textContent=t.rulesTitle;$('rules').innerHTML=t.rules;$('dialogTitle').textContent=t.settings;$('dialogText').textContent=t.dialog;$('close').setAttribute('aria-label',lang==='ja'?'閉じる':'Close');for(const id of ['back','about','privacy','contact'])$(id).textContent=t[id];$('release').textContent=t.release;$('release').disabled=running||placement.some(p=>p===null);$('undo').textContent=t.undo;$('undo').disabled=running||!history.length;$('reset').textContent=t.retry;$('reset').disabled=running;$('hint').textContent=t.hintButton;$('hint').disabled=running;$('next').textContent=t.next;$('next').hidden=sim?.status!=='clear'||index===9;$('view').textContent=fit?t.zoom:t.fit;$('view').disabled=running;$('placing').textContent=sim?'':t.placing;$('scrollNote').textContent=l.range>3&&!fit?t.scroll:'';$('arena').style.minWidth=fit?'100%':Math.max(300,l.range*2*46+56)+'px';$('scene').classList.toggle('fit',fit);
$('levels').innerHTML=E.levels.map((_,i)=>'<button data-level="'+i+'" class="'+(i===index?'current ':'')+(stars[i]?'done':'')+'" '+(running?'disabled ':'')+(i===index?'aria-current="step" ':'')+'aria-label="'+(lang==='ja'?'問題 ':'Puzzle ')+(i+1)+' '+stars[i]+' stars">'+(i+1)+(stars[i]?'<small>'+('★'.repeat(stars[i]))+'</small>':'')+'</button>').join('');
const px=p=>(p+l.range+.6)/(2*(l.range+.6))*100;
$('slots').innerHTML=E.positions(l).map(p=>{const f=l.fixed.find(x=>x[0]===p);return '<button class="slot '+(f?'fixed ':'')+(hintPos===p?'hint-slot':'')+'" data-pos="'+p+'" style="left:'+px(p)+'%" '+(running?'disabled ':'')+'aria-label="'+(p<0?t.left:t.right)+Math.abs(p)+(f?' '+t.weight+' '+f[1]+' ▣':' '+t.empty)+'">'+(f?'<span class="weight" data-w="'+f[1]+'">'+f[1]+'<span class="lock">▣</span></span>':'<span class="slot-ring"></span>')+'<span class="distance">'+Math.abs(p)+'</span></button>'}).join('');
$('loose').innerHTML=l.weights.map((w,i)=>placement[i]===null?'':'<button class="slot loose '+(selected===i?'selected':'')+'" data-loose="'+i+'" id="loose'+i+'" style="left:'+px(placement[i])+'%" '+(running?'disabled ':'')+'aria-label="'+t.weight+' '+w+'"><span class="weight" data-w="'+w+'">'+w+'</span></button>').join('');
$('tray').innerHTML=l.weights.map((w,i)=>'<button data-weight="'+i+'" class="'+(selected===i?'selected ':'')+(placement[i]!==null?'placed':'')+'" '+(running?'disabled ':'')+'aria-pressed="'+(selected===i)+'" aria-label="'+t.weight+' '+w+(placement[i]!==null?' '+t.return:'')+'">'+(placement[i]!==null?'↩ '+w:'<span class="weight" data-w="'+w+'">'+w+'</span>')+'</button>').join('');draw()}
function draw(){const t=texts[lang],l=E.levels[index];$('beam').style.transform='rotate('+((sim?.angle||0)*180/Math.PI)+'deg)';let message=note;$('scene').classList.toggle('cleared',sim?.status==='clear');const sliding=sim?.bodies.some(b=>Math.abs(b.v)>.04),danger=sim&&(sliding||Math.abs(sim.angle)>Math.atan(l.grip)*.78);$('scene').classList.toggle('danger',Boolean(sim?.status==='running'&&danger));if(sim){for(const b of sim.bodies){const el=$('loose'+b.id);if(el){el.style.left=((b.x+l.range+.6)/(2*(l.range+.6))*100)+'%';el.classList.toggle('dropped',b.lost)}}if(sim.status==='running')message=sim.time>=3?'settle':danger?'danger':'hold';else if(sim.status==='clear')message=stars.every(n=>n>0)?'finish':sim.rating===3?'perfect':sim.rating===1?'close':'clear';else message=sim.status}
$('status').textContent=t[message]||t.ready;$('status').classList.toggle('success',sim?.status==='clear');$('rating').textContent=sim?.status==='clear'?'★'.repeat(sim.rating)+'☆'.repeat(3-sim.rating):'';$('timeText').textContent=sim?(Math.min(3,sim.time).toFixed(1)+' / 3.0 s'):'';$('holdFill').style.width=sim?Math.min(100,sim.time/3*100)+'%':'0%';$('holdbar').setAttribute('aria-valuenow',String(sim?Math.min(3,sim.time).toFixed(1):0))}
function edit(){if(sim?.status==='running')return false;stop();hintPos=null;return true}
$('slots').onclick=e=>{const b=e.target.closest('[data-pos]');if(!b||!edit())return;const p=Number(b.dataset.pos),l=E.levels[index];if(l.fixed.some(x=>x[0]===p)){note='fixed';render();return}if(placement.includes(p)){note='selected';render();return}if(selected===null){note='ready';render();return}snapshot();placement[selected]=p;selected=null;render();save()};
$('loose').onclick=e=>{const b=e.target.closest('[data-loose]');if(!b||!edit())return;const i=Number(b.dataset.loose);selected=selected===i?null:i;note='selected';render()};
$('tray').onclick=e=>{const b=e.target.closest('[data-weight]');if(!b||!edit())return;const i=Number(b.dataset.weight);if(placement[i]!==null){snapshot();placement[i]=null;selected=i}else selected=selected===i?null:i;note='selected';render();save()};
$('release').onclick=()=>{if(placement.some(p=>p===null)){note='need';render();return}if(sim?.status==='running')return;history.push(placement.slice());sim=E.create(E.levels[index],placement);selected=null;hintPos=null;last=0;accumulator=0;render()};
$('undo').onclick=()=>{if(sim?.status==='running'||!history.length)return;stop();placement=history.pop();selected=null;hintPos=null;note='ready';render();save()};$('reset').onclick=()=>load(index);$('next').onclick=()=>load((index+1)%10);$('levels').onclick=e=>{const b=e.target.closest('[data-level]');if(b&&sim?.status!=='running')load(Number(b.dataset.level))};$('hint').onclick=()=>{if(!edit())return;const h=getHint();if(!h){note='ready';render();return}selected=h.weight;hintPos=h.pos;note=h.pos===null?'hintRemove':'hint';render()};
$('view').onclick=()=>{fit=!fit;render();center()};$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang)}catch{}render()};$('settings').onclick=()=>{$('dialog').showModal();last=0};$('close').onclick=()=>{$('dialog').close();last=0};document.addEventListener('visibilitychange',()=>{last=0;accumulator=0});
function frame(now){if(sim?.status==='running'&&!document.hidden&&!$('dialog').open){if(last)accumulator+=Math.min(.1,(now-last)/1000);last=now;let count=0;while(accumulator>=1/120&&sim.status==='running'&&count++<12){E.step(E.levels[index],sim,1/120);accumulator-=1/120}if(sim.status!=='running'){if(sim.status==='clear')stars[index]=Math.max(stars[index],sim.rating);save();render()}else draw()}else last=0;requestAnimationFrame(frame)}
if(!E.valid(E.levels[index],placement))placement=E.levels[index].weights.map(()=>null);render();center();requestAnimationFrame(frame);
</script></body></html>
