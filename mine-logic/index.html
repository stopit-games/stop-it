$('start').onclick=start;$('next').onclick=start;$('new').onclick=start;$('back').onclick=menu;$('inspect').onclick=()=>{$('finish').hidden=true;};$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang);}catch{}text();if(game&&game.outcome!=='play'){const wasHidden=$('finish').hidden;finishIfNeeded();$('finish').hidden=wasHidden;}};
$('openMode').onclick=()=>{mode='open';if(message!=='clue')message=game?'play':'ready';status();};$('flagMode').onclick=()=>{mode='flag';if(message!=='clue')message=game?'play':'ready';status();};$('zoom').onclick=()=>{zoom=!zoom;text();fit();};$('hint').onclick=()=>{if(!game){message='ready';status();return;}const i=Mine.hint(game);if(i!==null){clue=i;message='clue';render();cells[i].scrollIntoView({block:'nearest',inline:'nearest'});}};
for(let i=0;i<24;i++){let e=document.createElement('i');e.style.left=(i*41%100)+'%';e.style.animationDelay=(-i*.09)+'s';e.style.background=['#ffe19b','#a7f0d7','#8ecbff'][i%3];$('sparks').append(e);}text();})();
</script></body></html>
