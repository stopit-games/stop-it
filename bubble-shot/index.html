 if(!sfxEnabled||!audioContext||!cueData[name])return;
 try{
  if(!cueBuffers.has(name)){
   const bytes=atob(cueData[name]);
   const buffer=audioContext.createBuffer(1,bytes.length/2,22050),samples=buffer.getChannelData(0);
   for(let i=0;i<samples.length;i++){

   }
   cueBuffers.set(name,buffer);
  }

  activeCues.add(cue);
  cue.onended=()=>{activeCues.delete(cue);cue.disconnect();gain.disconnect();};
  cue.start(audioContext.currentTime+delay);

function render(){needsDraw=true;const t=text[lang];renderSettings(t);document.documentElement.lang=lang;$('lang').textContent=lang==='ja'?'EN':'日本語';$('lang').setAttribute('aria-label',lang==='ja'?'Switch to English':'日本語に切替');for(const [id,key] of Object.entries({ammoLabel:'ammo',scoreLabel:'score',help:'help',restart:'restart',sideText:'sideText',sideRule:'sideRule',sideRuleText:'sideRuleText',silent:'Toggle sound effects in How to play.',helpTitle:'helpTitle',chooseTitle:'choose',helpNote:'helpNote',back:'back',about:'about',privacy:'privacy',contact:'contact'}))$(id).textContent=t[key];$('sideTitle').textContent=t.sideTitle;$('sideTitle').style.whiteSpace='pre-line';$('sideBack').textContent=t.back;$('instructions').innerHTML=t.instructions;$('close').setAttribute('aria-label',t.close);canvas.setAttribute('aria-label',t.canvas);$('ammo').textContent=state.ammo;$('score').textContent=state.score.toLocaleString(lang==='ja'?'ja-JP':'en-US');$('stage').textContent=(mode==='cascade'?'CASCADE · ':'CLASSIC · ')+t.stage+' '+(state.level+1)+' / '+C.stageCount(mode);$('compactStage').textContent=mode.toUpperCase()+' '+(state.level+1)+'/'+C.stageCount(mode);$('mode').textContent=mode==='cascade'?'CASCADE ▾':'CLASSIC ▾';const count=lastEvent.matched.length,d=lastEvent.dropped.length;$('message').textContent=lastEvent.wave?(lang==='ja'?'ナイスショット！':'Great shot!'):note==='drop'?(d>=20?(lang==='ja'?'BIG DROP! '+d+'個一斉落下！':'BIG DROP! '+d+' bubbles fell!'):t.drop(count,d)):note==='pop'?t.pop(count):t[note]??t.ready;$('message').dataset.good=String(good);$('end').hidden=state.status==='playing'||Boolean(flight)||resolving;if(state.status!=='playing'&&!flight&&!resolving){const clear=state.status==='clear',all=done.every(Boolean);$('endTag').textContent=clear?'NICE SHOT!':'TAKE YOUR TIME';$('endTitle').textContent=clear?(all?t.all(C.stageCount(mode)):t.clear):t.lost;$('endText').textContent=clear?(all?t.allText:t.clearText(state.score))+(clear&&d?(lang==='ja'?' '+count+'個消去＋'+d+'個落 function renderStages(t){
 const buttons=Array.from({length:C.stageCount(mode)},(_,i)=>'<button type="button" data-stage="'+i+'" class="'+(i===state.level?'current ':'')+(done[i]?'done':'')+'" aria-label="'+t.stage+' '+(i+1)+(done[i]?' ✓':'')+'">'+(i+1)+'</button>');

  const heading=buttons.length>8?'<h4>'+(i+1)+'–'+(i+8)+'</h4>':'';

function load(n){stopCues();resolving=false;flight=null;particles=[];waveAnimation=0;state=C.create(n,mode);boardGeometry=C.geometry(state.mode,state.level);aim=0;note='ready';good=false;lastEvent={matched:[],dropped:[]};last=0;save();render();}
function fire(){if(resolving||flight||state.status!=='playing'||$('dialog').open||document.hidden)return;const result=C.shoot(state,aim);if(!result)return;prepareAudio();playCue('shot');let length=0,parts=[];for(let i=1;i<result.event.path.length;i++){const a=result.event.path[i-1],b=result.event.path[i],d=Math.hypot(b.x-a.x,b.y-a.y);parts.push({a,b,d,start:length});length+=d;}flight={result,parts,length,travel:0,nextWall:0,color:state.current};note='flying';good=false;render();}
function finishFlight(){resolving=true;const r=flight.result;state=r.state;lastEvent=r.event;const count=r.event.matched.length;
 if(count)playCue('pop');
 if(r.event.dropped.length)playCue('drop',{delay:.13,volume:Math.min(.54,.24+r.event.dropped.length*.008),rate:r.event.dropped.length<15?1.22:1});

function blocksShot(e){const hit=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):e.target;return Boolean(hit&&hit.closest&&hit.closest('button,a,dialog,input,select,textarea,summary,label,[role="button"]'));}
// v0.9: mouse background clicks and captured drags share the same guarded shot path.
function aimAt(e,allowOutside=false){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*C.W,y=(e.clientY-r.top)/r.height*C.H;const inside=x>=0&&x<=C.W&&y>=0&&y<=C.H;const insidePage=e.clientX>=0&&e.clientY>=0&&e.clientX<=(window.innerWidth||Infinity)&&e.clientY<=(window.innerHeight||Infinity);const permitted=(inside||allowOutside&&insidePage)&&y<boardGeometry.LAUNCH.y-30&&!blocksShot(e);if(permitted){validDrag=true;needsDraw=true;aim=Math.max(-75,Math.min(75,Math.atan2(x-boardGeometry.LAUNCH.x,boardGeometry.LAUNCH.y-y)*180/Math.PI));}else if(!drag){validDrag=false;}return permitted;}
function startAim(e){if(e.button!==0||resolving||flight||state.status!=='playing'||$('dialog').open||document.hidden)return;validDrag=false;if(!aimAt(e,e.pointerType==='mouse'))return;drag=true;try{canvas.setPointerCapture(e.pointerId);}catch(_){}canvas.focus({preventScroll:true});}
function endAim(e){if(!drag)return;const permitted=aimAt(e,e.pointerType==='mouse');drag=false;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(validDrag&&!blocksShot(e)&&(e.pointerType==='mouse'?e.clientX>=0&&e.clientY>=0&&e.clientX<=window.innerWidth&&e.clientY<=window.innerHeight:permitted))fire();validDrag=false;}
canvas.addEventListener('pointerdown',startAim);
canvas.addEventListener('pointermove',e=>{if(drag)aimAt(e,e.pointerType==='mouse');else if(e.pointerType==='mouse'&&!flight&&state.status==='playing'&&!$('dialog').open)aimAt(e,true);});
canvas.addEventListener('pointerup',endAim);
canvas.addEventListener('pointercancel',()=>{drag=false;validDrag=false;});canvas.addEventListener('lostpointercapture',()=>{drag=false;});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.target===canvas||flight||state.status!=='playing'||$('dialog').open)return;aimAt(e,true);});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.target!==canvas)startAim(e);});

window.addEventListener('blur',()=>{drag=false;validDrag=false;});
canvas.addEventListener('keydown',e=>{if($('dialog').open)return;if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();needsDraw=true;if(e.key==='ArrowLeft')aim=Math.max(-75,aim-2);else if(e.key==='ArrowRight')aim=Math.min(75,aim+2);else if(!e.repeat)fire();}});
$('mode').onclick=()=>{mode=mode==='cascade'?'classic':'cascade';done=records[mode].done;best=records[mode].best;load(0);};$('restart').onclick=()=>load(state.level);$('continue').onclick=()=>load(state.status==='clear'&&state.level+1<C.stageCount(mode)?state.level+1:state.level);$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang);}catch(e){}render();};$('help').onclick=()=>{$('dialog').showModal();stopCues();last=0;drag=false;};$('close').onclick=()=>{$('dialog').close();last=0;};$('stages').onclick=e=>{const b=e.target.closest('[data-stage]');if(b){load(Number(b.dataset.stage));$('dialog').close();}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCues();last=0;drag=false;needsDraw=true;});

};
$('settingsMode').onclick=()=>{$('mode').onclick();$('dialog').close();};

$('settingsAudio').onclick=()=>{
 sfxEnabled=!sfxEnabled;

function renderSettings(t){
 const ja=lang==='ja';
 const label=ja?'設定':'Settings';
 const audioButton=$('settingsAudio');
 audioButton.textContent=ja?(sfxEnabled?'効果音 オン':'効果音 オフ'):(sfxEnabled?'Sound effects on':'Sound effects off');

function bubble(x,y,color,r=boardGeometry.R,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);const g=ctx.createRadialGradient(x-r*.28,y-r*.35,r*.05,x,y,r);g.addColorStop(0,'#efffff');g.addColorStop(.13,palette[color]);g.addColorStop(.75,palette[color]);g.addColorStop(1,'#253c55');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=palette[color];ctx.lineWidth=.8;ctx.stroke();if(r>8){ctx.fillStyle='#102739b8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.round(r*.75)+'px system-ui';ctx.fillText(marks[color],x,y+1);ctx.beginPath();ctx.arc(x-r*.28,y-r*.35,r*.16,0,Math.PI*2);ctx.fillStyle='#ffffff85';ctx.fill();}ctx.restore();}
function draw(){ctx.setTransform(canvas.width/C.W,0,0,canvas.height/C.H,0,0);ctx.clearRect(0,0,C.W,C.H);const bg=ctx.createLinearGradient(0,0,0,C.H);bg.addColorStop(0,'#14283e');bg.addColorStop(1,'#0b182a');ctx.fillStyle=bg;ctx.fillRect(0,0,C.W,C.H);ctx.fillStyle='#badde312';for(let r=0;r<boardGeometry.ROWS-1;r++)for(let c=0;c<boardGeometry.cols(r);c++){const p=boardGeometry.point(r,c);ctx.beginPath();ctx.arc(p.x,p.y,.9,0,Math.PI*2);ctx.fill();}ctx.save();ctx.setLineDash([4,7]);ctx.strokeStyle=state.board.some(b=>boardGeometry.point(b.r,b.c).y>330)?'#f0ac83a0':'#748aa43d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,C.LIMIT);ctx.lineTo(C.W-10,C.LIMIT);ctx.stroke();ctx.restore();
if(!resolving&&!flight&&state.status==='playing'&&!$('dialog').open){
 const ray=boardGeometry.trace([],aim),p0=ray.path[0];
 {
 // Show direction, not the answer: up to the first bounce and only a short
 // continuation after it. No landing circle or exact target indicator.
 let remaining=190,firstBounce=false,pts=[p0];
 for(let i=1;i<ray.path.length&&remaining>0;i++){
  const a=ray.path[i-1],b=ray.path[i],dist=Math.hypot(b.x-a.x,b.y-a.y);
  const step=Math.min(dist,remaining);
  pts.push({x:a.x+(b.x-a.x)*step/dist,y:a.y+(b.y-a.y)*step/dist});
  remaining-=step;
  if(i<ray.path.length-1){firstBounce=true;remaining=Math.min(remaining,45);}
  if(step<dist)break;
 }
 ctx.save();ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p0.x,p0.y);

 if(firstBounce&&pts.length>=2){const bounce=ray.path[1];
  if(Math.hypot(pts[1].x-bounce.x,pts[1].y-bounce.y)<.01){
   ctx.setLineDash([]);ctx.beginPath();ctx.arc(bounce.x,bounce.y,3.5,0,Math.PI*2);

  }

}
for(const b of state.board){const p=boardGeometry.point(b.r,b.c);const offset=waveAnimation?Math.max(0,1-(performance.now()-waveAnimation)/480)*(-boardGeometry.DY*2):0;bubble(p.x,p.y+offset,b.color);}for(const p of particles)bubble(p.x,p.y,p.color,p.small?3.1:boardGeometry.R,p.small?p.life/p.max:Math.min(1,p.life/.16));
ctx.save();ctx.translate(boardGeometry.LAUNCH.x,boardGeometry.LAUNCH.y);ctx.rotate(aim*Math.PI/180);ctx.strokeStyle='#6f93a8';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,-26);ctx.stroke();ctx.strokeStyle=palette[state.current];ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,-27);ctx.stroke();ctx.restore();ctx.strokeStyle='#344f65';ctx.lineWidth=1;ctx.beginPath();const {x,y}=boardGeometry.LAUNCH,scale=boardGeometry.R/C.R;

if(!flight)bubble(x,y,state.current,19*scale);
bubble(nextX,y+7,state.next,12*scale);

ctx.fillText(text[lang].nextBall,nextX,y+30);ctx.fillText(text[lang].now,x,y+34);

function frame(now){if(!document.hidden&&!$('dialog').open){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(flight){flight.travel+=dt*690;

       &&flight.travel>=flight.parts[flight.nextWall+1].start){
   playCue('bounce');
   flight.nextWall++;

const observer=new ResizeObserver(()=>{const r=canvas.getBoundingClientRect(),scale=Math.min(window.devicePixelRatio||1,2);if(r.width>0&&r.height>0){canvas.width=Math.round(r.width*scale);canvas.height=Math.round(r.height*scale);needsDraw=true;}});observer.observe(canvas);save();render();requestAnimationFrame(frame);
