<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAKE ONE! — Prototype v0.6 v0.5</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f7ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#202d55,#0b1020 65%)}main{max-width:550px;margin:auto;padding:25px 16px 45px}header{text-align:center}h1{font-size:clamp(32px,9vw,48px);letter-spacing:.08em;margin:8px 0 2px}small{color:#aab7d6}.sub{color:#b6c4e4;margin:4px 0 20px}.panel{background:#18233f;border:1px solid #344362;border-radius:20px;padding:16px;margin:14px 0}.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}button{cursor:pointer;font:inherit}button.control{background:#263859;color:white;border:1px solid #48628c;padding:10px 15px;border-radius:12px;font-weight:700}button.control.active{background:#00b7ac;color:#081d29;border-color:#5af8e4}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}.stat strong{font-size:26px;display:block}.stat span{font-size:12px;color:#b2bfda}.board{display:grid;gap:8px;margin:18px auto;max-width:440px;aspect-ratio:1;touch-action:manipulation}.board{grid-auto-rows:minmax(0,1fr)}.tile{min-width:0;min-height:0;width:100%;height:100%;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;appearance:none;-webkit-appearance:none;border:0;border-radius:15%;box-shadow:inset 0 -5px 0 #0002;transition:transform .1s}.tile:active{transform:scale(.91)}.tile:focus-visible{outline:3px solid white}.msg{text-align:center;min-height:48px;font-weight:700}.primary{background:#ffce4e;color:#18213a;border:0;border-radius:14px;padding:14px 28px;font-size:18px;font-weight:900;width:100%}.note{color:#a9b8d6;font-size:13px;text-align:center;line-height:1.6}.hidden{display:none!important}.badge{display:inline-block;background:#314568;border-radius:999px;padding:5px 12px;font-size:12px;color:#bce9ff}#finish{text-align:center}#finish h2{font-size:30px}#finish .big{font-size:60px;font-weight:900;color:#ffce4e}
</style></head><body><main><header><span class="badge">PLAY ROOM</span><h1>FAKE ONE!</h1><p class="sub" id="subtitle">ひとつだけ違う色を見つけろ！</p></header>
<div class="panel" id="setup"><div class="row" style="margin-bottom:13px"><button class="control active" id="ja" onclick="setLang('ja')">日本語</button><button class="control" id="en" onclick="setLang('en')">English</button></div><div class="row" style="margin-bottom:15px"><button class="control active" id="timed" onclick="setMode('timed')">30秒チャレンジ</button><button class="control" id="endless" onclick="setMode('endless')">エンドレス</button></div><div class="row" style="margin-bottom:13px"><button class="control" id="one" onclick="setFindMode('one')">ONE · 1個</button><button class="control active" id="multi" onclick="setFindMode('multi')">MULTI · 2〜3個</button></div><div class="row" style="align-items:center;margin-bottom:12px"><label for="perQuestion" id="perQuestionLabel">1問の制限時間</label><select id="perQuestion" onchange="setLimit(this.value)" style="background:#263859;color:white;border:1px solid #48628c;border-radius:10px;padding:9px 12px;font:inherit"><option value="3">3秒</option><option value="5" selected>5秒</option><option value="7">7秒</option><option value="10">10秒</option></select></div><p class="note" id="rules">ひとつだけ色の違うタイルをタップ。正解するほど難しくなります。</p><button class="primary" id="start" onclick="startGame()">スタート！</button></div>
<div id="playing" class="hidden"><div class="panel stats"><div class="stat"><strong id="score">0</strong><span id="scoreLabel">正解数</span></div><div class="stat"><strong id="time">30.0</strong><span id="timeLabel">残り時間</span></div><div class="stat"><strong id="best">0</strong><span id="bestLabel">自己ベスト</span></div></div><div style="height:7px;background:#314568;border-radius:10px;overflow:hidden;margin-top:10px"><div id="roundBar" style="height:100%;width:100%;background:#ffce4e"></div></div><p class="msg" id="progress" style="min-height:20px;margin:0"></p><div class="board" id="board"></div><div class="msg" id="feedback" aria-live="polite"></div><button class="control" id="quit" onclick="finish()">終了する</button></div>
<div id="finish" class="panel hidden"><h2 id="finishTitle">結果</h2><div class="big" id="finalScore">0</div><p id="finalMessage"></p><button class="primary" id="again" onclick="startGame()">もう一度遊ぶ</button><div style="height:10px"></div><button class="control" id="back" onclick="backToSetup()">設定に戻る</button></div><p style="text-align:center;margin:20px 0"><a href="/games/" style="color:#bce9ff;font-weight:700;text-decoration:underline" id="moreGames">🎮 ほかのゲームを見る / More Games</a></p><p class="note" id="foot"></p></main>
<script>
let lang='ja',mode='timed',findMode='multi',limit=5,score=0,deadline=0,roundDeadline=0,timer=null,active=false,wrong=0,remaining=0,round=0,started=0;
const $=id=>document.getElementById(id);
const t={ja:{subtitle:'違う色のタイルを見つけろ！',timed:'30秒チャレンジ',endless:'エンドレス',start:'スタート！',score:'得点',time:'残り時間',elapsed:'経過時間',best:'自己ベスト',quit:'終了する',result:'結果',again:'もう一度遊ぶ',back:'設定に戻る',wrong:'惜しい！',good:'正解！',finish:'あなたの記録',foot:''},en:{subtitle:'Find the different-colored tiles!',timed:'30-second challenge',endless:'Endless',start:'START!',score:'Score',time:'Time left',elapsed:'Elapsed',best:'Personal best',quit:'Finish',result:'Results',again:'Play again',back:'Settings',wrong:'Not quite!',good:'Correct!',finish:'Your score',foot:'Prototype only. Your live game website is unchanged.'}};
function setLang(l){lang=l;$('ja').classList.toggle('active',l==='ja');$('en').classList.toggle('active',l==='en');document.documentElement.lang=l;renderLabels()}
function setMode(m){mode=m;$('timed').classList.toggle('active',m==='timed');$('endless').classList.toggle('active',m==='endless');renderLabels()}
function setFindMode(m){findMode=m;$('one').classList.toggle('active',m==='one');$('multi').classList.toggle('active',m==='multi');renderLabels()}
function setLimit(v){limit=Number(v);renderLabels()}
function bestKey(){return 'fakeone_v05_'+findMode+'_'+mode+'_'+limit+'_best'}
function renderLabels(){const x=t[lang];for(const id of ['subtitle','timed','endless','start','scoreLabel','bestLabel','quit','finishTitle','again','back','foot']){const k={scoreLabel:'score',bestLabel:'best',finishTitle:'result'}[id]||id;$(id).textContent=x[k]}$('timeLabel').textContent=x[mode==='timed'?'time':'elapsed'];$('best').textContent=localStorage.getItem(bestKey())||0;$('one').textContent=lang==='ja'?'ONE · 1個':'ONE · 1 tile';$('multi').textContent=lang==='ja'?'MULTI · 2〜3個':'MULTI · 2–3 tiles';$('perQuestionLabel').textContent=lang==='ja'?'1問の制限時間':'Time per puzzle';for(const o of $('perQuestion').options)o.textContent=o.value+(lang==='ja'?'秒':' sec');$('moreGames').textContent=lang==='ja'?'🎮 ほかのゲームを見る':'🎮 More Games';$('rules').textContent=lang==='ja'?'すべて見つけると即次の問題へ。時間切れは30秒モードなら見逃し減点、エンドレスなら終了。':'Find all tiles to advance. Timeout costs points in 30-second mode; in Endless it ends the game.'}
function startGame(){clearInterval(timer);score=0;wrong=0;round=0;active=true;started=performance.now();deadline=started+30000;$('setup').classList.add('hidden');$('finish').classList.add('hidden');$('playing').classList.remove('hidden');$('score').textContent='0';$('feedback').textContent='';renderLabels();nextBoard();tick();timer=setInterval(tick,40)}
function tick(){if(!active)return;const now=performance.now();const overall=mode==='timed'?Math.max(0,(deadline-now)/1000):(now-started)/1000;$('time').textContent=overall.toFixed(1);$('roundBar').style.width=(Math.max(0,Math.min(1,(roundDeadline-now)/(limit*1000)))*100)+'%';if(mode==='timed'&&now>=deadline){finish('time');return}if(now>=roundDeadline){if(mode==='endless'){finish('missed');return}score-=remaining;wrong+=remaining;$('score').textContent=score;$('feedback').textContent=lang==='ja'?`時間切れ！ ${remaining}個見逃し`:`Time up! ${remaining} missed`;nextBoard()}}
function nextBoard(){if(!active)return;round++;roundDeadline=performance.now()+limit*1000;const n=round<3?3:round<7?4:round<13?5:round<21?6:7,count=n*n;const needed=findMode==='one'?1:(round<5?2:3);remaining=needed;const selected=new Set();while(selected.size<needed)selected.add(Math.floor(Math.random()*count));const hue=Math.floor(Math.random()*360),sat=62,light=48,delta=Math.max(6,Math.round(14-round*.5)),direction=Math.random()<.5?-1:1;const base=`hsl(${hue} ${sat}% ${light}%)`,other=`hsl(${hue} ${sat}% ${Math.min(80,Math.max(20,light+direction*delta))}%)`;const board=$('board');board.innerHTML='';board.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;board.style.gap=n>=6?'5px':'8px';let found=0;function progress(){$('progress').textContent=findMode==='multi'?(lang==='ja'?`残り ${needed-found} 個`:`${needed-found} remaining`):''}progress();for(let i=0;i<count;i++){const b=document.createElement('button');b.className='tile';b.style.background=selected.has(i)?other:base;b.setAttribute('aria-label',`${i+1}`);b.onclick=()=>{if(!active||b.disabled)return;if(mode==='timed'&&performance.now()>=deadline){finish('time');return}if(performance.now()>=roundDeadline){tick();return}if(selected.has(i)){b.disabled=true;b.style.background='#20c997';b.style.outline='3px solid white';b.textContent='✓';b.style.color='#08282a';b.style.fontWeight='900';b.style.fontSize='min(6vw,30px)';found++;remaining=needed-found;score++;$('score').textContent=score;progress();$('feedback').textContent=t[lang].good;if(found===needed)nextBoard()}else{wrong++;$('feedback').textContent=t[lang].wrong;if(mode==='timed')deadline-=1000;else finish('mistake')}};board.appendChild(b)}}
function finish(reason){if(!active)return;active=false;clearInterval(timer);$('playing').classList.add('hidden');$('finish').classList.remove('hidden');const key=bestKey(),best=Number(localStorage.getItem(key)||0);if(score>best)localStorage.setItem(key,score);$('finalScore').textContent=score;const reasonText=reason==='missed'?(lang==='ja'?'時間切れ・見逃しで終了':'Timeout — missed tiles'):reason==='mistake'?(lang==='ja'?'誤タップで終了':'Wrong tap'):'';$('finalMessage').textContent=`${reasonText?reasonText+' • ':''}${t[lang].finish} • ${t[lang].best}: ${Math.max(score,best)} • ${lang==='ja'?'ミス・見逃し':'Mistakes / missed'}: ${wrong}`}
function backToSetup(){clearInterval(timer);active=false;$('finish').classList.add('hidden');$('setup').classList.remove('hidden');renderLabels()}
renderLabels();
</script></body></html>
