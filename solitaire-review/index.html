function animeCard(c,back=false){if(back||c.r<=10)return popCard(c,back).replaceAll('#dd4e62','#b33546').replaceAll('#fffdf7','#fff9ee');const ink=K.red(c)?'#b33546':'#243749';const corner=`<rect x="2" y="2" width="22" height="38" rx="4" fill="#fff9ee"/><text x="6" y="22" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="${ink}">${rank(c.r)}</text><text x="6" y="36" font-family="Georgia,serif" font-size="17" fill="${ink}">${suit[c.s]}</text>`;return `<svg viewBox="0 0 100 140" aria-hidden="true"><rect x=".5" y=".5" width="99" height="139" rx="7" fill="#fff9ee" stroke="#c6b88f"/><defs><clipPath id="court-${c.r}-${c.s}"><rect x="16.5" y="3" width="67" height="134"/></clipPath></defs><g clip-path="url(#court-${c.r}-${c.s})"><image x="${16.5-(c.r-11)*67}" y="3" width="201" height="134" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="${portraitSheet}"/></g><rect x="3" y="3" width="94" height="134" rx="5" fill="none" stroke="#bfa46c" stroke-width=".6"/>${corner}<g transform="rotate(180 50 70)">${corner}</g></svg>`}

let layout;function render(){const scroll=board.scrollTop;board.replaceChildren();const w=board.clientWidth,h=board.clientHeight,gap=w<420?5:9,available=(w-gap*8)/7,wide=window.innerWidth>window.innerHeight,cw=Math.min(available,wide?Math.max(46,(h-30)/3.4):105),ch=cw*1.4,step=Math.max(18,cw*.29),pad=(w-(cw*7+gap*6))/2,row=8+ch+14;layout={cw,ch,step,row,gap,pad};const offsets=g.t.map(a=>{let y=row;return a.map((c,i)=>{let old=y;y+=c.up?step:Math.max(11,cw*.22);return old})});let needed=row+ch+8;offsets.forEach(a=>{if(a.length)needed=Math.max(needed,a[a.length-1]+ch+8)});board.style.setProperty('--board-height',Math.ceil(needed)+'px');const spacer=document.createElement('div');spacer.style.cssText=`height:${needed}px;width:1px;pointer-events:none`;board.append(spacer);const x=i=>pad+i*(cw+gap);

function slot(i,y,label,p,stock=false){let el=document.createElement('button');el.className='slot';el.style.cssText=`left:${x(i)}px;top:${y}px;width:${cw}px;height:${ch}px`;el.textContent=label;el.setAttribute('aria-label',stock?text('山札をめくる','Draw stock'):label);el.onclick=()=>stock?draw():target(p);el.dataset.dest=JSON.stringify(p);board.append(el)}
slot(0,8,g.stock.length?'':'↻',null,true);slot(1,8,'', {k:'w',i:0});for(let i=0;i<4;i++)slot(i+3,8,suit[i],{k:'f',i});for(let i=0;i<7;i++)slot(i,row,'K',{k:'t',i});
function card(c,i,y,p,back=false){const el=document.createElement('div');el.className='card'+(back?' back':K.red(c)?' red':'');el.style.cssText=`left:${x(i)}px;top:${y}px;width:${cw}px;height:${ch}px`;if(back)el.innerHTML=animeCard(c,true);if(!back){el.innerHTML=animeCard(c);el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label',cardName(c));el.dataset.src=JSON.stringify(p);el.dataset.dest=JSON.stringify({k:p.k,i:p.i});if(selected&&selected.k===p.k&&selected.i===p.i&&(p.k!=='t'||p.at>=selected.at))el.classList.add('selected');el.onclick=()=>{if(suppress)return;if(selected&&selected.k===p.k&&selected.i===p.i&&selected.at===p.at){if(toFoundation(p))return;selected=null;render();message('');return}if(selected&&target({k:p.k,i:p.i}))return;selected=p;render();message(text('移動先を選んでください','Choose a destination'))};el.ondblclick=()=>toFoundation(p);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};el.onpointerdown=e=>beginDrag(e,p,el)}else if(i===0&&y===8){el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label',text('山札をめくる','Draw stock'));el.onclick=draw;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();draw()}}}board.append(el)}
if(g.stock.length)card(g.stock[g.stock.length-1],0,8,null,true);if(g.waste.length)card(g.waste[g.waste.length-1],1,8,{k:'w',i:0});g.f.forEach((a,i)=>{if(a.length)card(a[a.length-1],i+3,8,{k:'f',i})});g.t.forEach((a,i)=>a.forEach((c,at)=>card(c,i,offsets[i][at],{k:'t',i,at},!c.up)));board.scrollTop=scroll;labels();if(K.won(g))message(text('クリア！すべてのカードが揃いました。','You win! All 52 cards are home.'))}
function commit(p,q){if(!K.legal(g,p,q))return false;stopAuto();record();K.move(g,p,q);selected=null;save();render();message(K.won(g)?text('クリア！おめでとう！','You win! Well played!'):'');return true}
function target(q){if(!selected)return false;return commit(selected,q)}function draw(){stopAuto();if(!g.stock.length&&!g.waste.length)return;record();K.draw(g);selected=null;save();render();message('')}
function toFoundation(p){for(let i=0;i<4;i++)if(commit(p,{k:'f',i}))return true;return false}
function beginDrag(e,p,el){if(e.button!==0||!K.source(g,p))return;drag={id:e.pointerId,p,pointerType:e.pointerType,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,el,ghost:null};el.setPointerCapture(e.pointerId)}
window.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;if(d.pointerType==='touch'&&!d.ghost&&Math.abs(e.clientY-d.startY)>Math.abs(e.clientX-d.startX)+4)return;if(!d.ghost&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>7){d.ghost=d.el.cloneNode(true);d.ghost.classList.add('ghost');d.ghost.removeAttribute('tabindex');document.body.append(d.ghost);d.ghost.style.width=layout.cw+'px';d.ghost.style.height=layout.ch+'px'}if(d.ghost){e.preventDefault();d.ghost.style.left=e.clientX-layout.cw/2+'px';d.ghost.style.top=e.clientY-18+'px'}},{passive:false});
function release(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(d.ghost){d.ghost.remove();suppress=true;setTimeout(()=>suppress=false,100);if(!cancel){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-dest]');let dest=el?JSON.parse(el.dataset.dest):null;if(!dest){const r=board.getBoundingClientRect(),i=Math.floor((e.clientX-r.left-layout.pad)/(layout.cw+layout.gap));if(e.clientY-r.top+board.scrollTop>=layout.row&&i>=0&&i<7)dest={k:'t',i}}if(!commit(d.p,dest))message(text('そこには置けません','That move is not allowed'))}}}
window.addEventListener('pointerup',e=>release(e));window.addEventListener('pointercancel',e=>release(e,true));$('undo').onclick=()=>{stopAuto();if(!history.length)return;g=history.pop();selected=null;save();render();message('')};$('hint').onclick=()=>{const opts=K.options(g);if(opts.length){selected=opts[0].p;render();const p=opts[0].q;message(p.k==='f'?text('選んだカードを右上の同じマークへ','Move the selected card to its suit pile'):text('選んだカードを '+(p.i+1)+' 列目へ','Move the selected cards to column '+(p.i+1)));board.querySelectorAll('[data-dest]').forEach(el=>{const q=JSON.parse(el.dataset.dest);if(q&&q.k===p.k&&q.i===p.i)el.classList.add('hint')})}else{selected=null;message(g.stock.length||g.waste.length?text('山札をめくってみましょう。巡回しても進めなければ戻すか配り直せます。','Try drawing the stock. If cycling does not help, undo or start a new hand.'):text('場札から動かせるカードはありません。戻すか配り直せます。','No available moves. Undo or start a new hand.'))}};
