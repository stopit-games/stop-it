let layout;function render(){const scroll=board.scrollTop;board.replaceChildren();const w=board.clientWidth,h=board.clientHeight,gap=w<420?5:9,available=(w-gap*8)/7,wide=window.innerWidth>window.innerHeight,cw=Math.min(available,wide?Math.max(46,(h-30)/3.4):105),ch=cw*1.4,step=Math.max(18,cw*.29),pad=(w-(cw*7+gap*6))/2,row=8+ch+14;layout={cw,ch,step,row,gap,pad};const offsets=g.t.map(a=>{let y=row;return a.map((c,i)=>{let old=y;y+=c.up?step:Math.max(8,cw*.14);return old})});let needed=row+ch+8;offsets.forEach(a=>{if(a.length)needed=Math.max(needed,a[a.length-1]+ch+8)});const spacer=document.createElement('div');spacer.style.cssText=`height:${needed}px;width:1px;pointer-events:none`;board.append(spacer);const x=i=>pad+i*(cw+gap);

function slot(i,y,label,p,stock=false){let el=document.createElement('button');el.className='slot';el.style.cssText=`left:${x(i)}px;top:${y}px;width:${cw}px;height:${ch}px`;el.textContent=label;el.setAttribute('aria-label',stock?text('山札をめくる','Draw stock'):label);el.onclick=()=>stock?draw():target(p);el.dataset.dest=JSON.stringify(p);board.append(el)}

function commit(p,q){if(!K.legal(g,p,q))return false;stopAuto();record();K.move(g,p,q);selected=null;save();render();message(K.won(g)?text('クリア！おめでとう！','You win! Well played!'):'');return true}
