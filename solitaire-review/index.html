<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>SOLITAIRE! — PLAY ROOM</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2a;color:#eef5f7;font:15px system-ui}main{max-width:850px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:27px;letter-spacing:.06em;margin:8px 0;color:#b1e3d3}button{font:inherit;cursor:pointer;color:inherit;background:#263c4d;border:1px solid #526777;border-radius:10px;padding:10px 12px;touch-action:manipulation}button:disabled{opacity:.4}.info{display:flex;justify-content:space-between;color:#b9ccd0;font-size:13px;margin:8px 0}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tools button{flex:1;white-space:nowrap}#board{position:relative;background:radial-gradient(ellipse at top,#286857,#153f36);border:1px solid #467c69;border-radius:18px;min-height:470px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}.slot{position:absolute;border:1px dashed #a4cebc60;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#b9dbcb66;font-size:25px}.card{position:absolute;background:#fffdf4;border:1px solid #c6c9bc;border-radius:7px;box-shadow:0 2px 4px #0004;color:#152535;cursor:pointer;padding:4px;line-height:1;font-weight:750;touch-action:none}.card.red{color:#ba3545}.card.back{background:repeating-linear-gradient(45deg,#284565 0 4px,#355777 4px 7px);border:3px solid #e1e4d9}.corner{font-size:clamp(15px,3.5vw,23px);display:flex;gap:2px;align-items:center}.center{position:absolute;inset:25% 0 0;display:grid;place-items:center;font-size:clamp(23px,5vw,40px)}.selected{outline:3px solid #ffdf77;outline-offset:-2px;filter:brightness(1.05)}.hint{animation:pulse .6s alternate 3}@keyframes pulse{to{box-shadow:0 0 0 4px #ffe078}}.ghost{position:fixed;pointer-events:none;opacity:.9;z-index:1000}#message{min-height:36px;margin:8px 0;text-align:center;color:#f3df9b;font-size:14px}footer{text-align:center;font-size:12px;line-height:2.1}a{color:#a8d7df}dialog{background:#192b39;color:#edf4fa;border:1px solid #6c8992;border-radius:18px;max-width:440px;width:90%;padding:24px}dialog::backdrop{background:#0009}dialog p{line-height:1.8}.dialogtop{display:flex;justify-content:space-between;align-items:center}h2{font-size:22px}button:focus-visible{outline:3px solid #ffdf77}@media(max-width:450px){main{padding:7px}h1{font-size:23px}button{padding:9px 8px;font-size:13px}.tools{gap:4px}}</style><main><header><h1>SOLITAIRE!</h1><div><button id="lang">日本語</button> <button id="help" aria-label="Rules">?</button></div></header><div class="info"><span id="mode"></span><span id="stats"></span></div><div id="board" role="group" aria-label="Solitaire board"></div><div id="message" role="status" aria-live="polite"></div><div class="tools"><button id="undo"></button><button id="hint"></button><button id="auto"></button><button id="new"></button></div><footer><a href="/games/">PLAY ROOM</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/contact.html">Contact</a></footer><dialog id="rules"><div class="dialogtop"><h2 id="rt"></h2><button id="closeRules" aria-label="Close">×</button></div><p id="ruleText"></p></dialog><dialog id="newDialog"><h2 id="nt"></h2><p id="newText"></p><div class="tools"><button id="cancelNew"></button><button id="confirmNew"></button></div></dialog></main><script>'use strict';
const Klondike=(()=>{
const red=c=>c.s===1||c.s===2;
const copy=x=>JSON.parse(JSON.stringify(x));
function deal(random=Math.random){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({s,r,up:false});for(let i=51;i;i--){let j=Math.floor(random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}const t=Array.from({length:7},()=>[]);for(let i=0;i<7;i++){for(let j=0;j<=i;j++)t[i].push(d.pop());t[i][i].up=true}return{t,f:[[],[],[],[]],stock:d,waste:[],moves:0}}
function pile(g,p){return p.k==='t'?g.t[p.i]:p.k==='f'?g.f[p.i]:p.k==='w'?g.waste:null}
function source(g,p){const a=pile(g,p);if(!a||!a.length)return null;const at=p.k==='t'?p.at:a.length-1;if(!Number.isInteger(at)||at<0||at>=a.length||!a[at].up)return null;const seq=a.slice(at);if(p.k!=='t'&&seq.length!==1)return null;for(let i=1;i<seq.length;i++)if(!seq[i].up||seq[i-1].r!==seq[i].r+1||red(seq[i-1])===red(seq[i]))return null;return{a,at,seq}}
function legal(g,p,q){const a=source(g,p);if(!a||!q||p.k===q.k&&p.i===q.i)return false;const c=a.seq[0];if(q.k==='f'){const f=g.f[q.i];return !!f&&a.seq.length===1&&c.s===q.i&&c.r===(f.length?f[f.length-1].r+1:1)}if(q.k==='t'){const t=g.t[q.i];if(!t)return false;return t.length?t[t.length-1].up&&t[t.length-1].r===c.r+1&&red(t[t.length-1])!==red(c):c.r===13}return false}
function move(g,p,q){if(!legal(g,p,q))return false;const a=source(g,p);pile(g,q).push(...a.a.splice(a.at));if(p.k==='t'&&a.a.length)a.a[a.a.length-1].up=true;g.moves++;return true}
function draw(g){if(g.stock.length){const c=g.stock.pop();c.up=true;g.waste.push(c)}else if(g.waste.length){g.stock=g.waste.reverse();g.waste=[];for(const c of g.stock)c.up=false}else return false;g.moves++;return true}
function options(g){const src=[];if(g.waste.length)src.push({k:'w',i:0});for(let i=0;i<7;i++)for(let at=0;at<g.t[i].length;at++)if(g.t[i][at].up)src.push({k:'t',i,at});const out=[];for(const p of src)for(let i=0;i<4;i++){const q={k:'f',i};if(legal(g,p,q))out.push({p,q})}for(const p of src)for(let i=0;i<7;i++){const q={k:'t',i};if(legal(g,p,q)&&!(p.k==='t'&&p.at===0&&g.t[i].length===0))out.push({p,q})}return out}
function valid(g){try{if(g.t.length!==7||g.f.length!==4||!Number.isInteger(g.moves))return false;const all=[...g.t.flat(),...g.f.flat(),...g.stock,...g.waste];return all.length===52&&new Set(all.map(c=>c.s*13+c.r)).size===52&&all.every(c=>Number.isInteger(c.s)&&c.s>=0&&c.s<4&&Number.isInteger(c.r)&&c.r>=1&&c.r<=13&&typeof c.up==='boolean')&&g.f.every((a,s)=>a.every((c,i)=>c.s===s&&c.r===i+1&&c.up))&&g.stock.every(c=>!c.up)&&g.waste.every(c=>c.up)&&g.t.every(a=>{let up=false;return a.every((c,i)=>{if(up&&!c.up)return false;up||=c.up;return !i||!a[i-1].up||a[i-1].r===c.r+1&&red(a[i-1])!==red(c)})})}catch{return false}}
return{deal,red,copy,pile,source,legal,move,draw,options,valid,won:g=>g.f.every(a=>a.length===13)};
})();
if(typeof module!=='undefined')module.exports=Klondike;
</script><script>
'use strict';const K=Klondike,$=id=>document.getElementById(id),board=$('board'),key='playroom-klondike-review-v1';let g=K.deal(),history=[],ja=false,selected=null,drag=null,suppress=false,autoTimer=null;
try{const v=JSON.parse(localStorage.getItem(key));if(v&&K.valid(v.g)){g=v.g;history=(v.history||[]).filter(K.valid).slice(-150);ja=!!v.ja}}catch{}
const text=(a,b)=>ja?a:b,suit=['♠','♥','♦','♣'],rank=r=>({1:'A',11:'J',12:'Q',13:'K'}[r]||r),cardName=c=>rank(c.r)+suit[c.s];
function save(){try{localStorage.setItem(key,JSON.stringify({g,history,ja}))}catch{}}
function stopAuto(){clearTimeout(autoTimer);autoTimer=null}
function record(){history.push(K.copy(g));if(history.length>150)history.shift()}
function message(s){$('message').textContent=s}
function labels(){document.documentElement.lang=ja?'ja':'en';$('lang').textContent=ja?'English':'日本語';$('mode').textContent=text('クロンダイク · 1枚めくり','Klondike · Draw 1');$('stats').textContent=text('手数 ','Moves ')+g.moves+' · '+g.f.flat().length+'/52';for(const [id,a,b]of[['undo','戻す','Undo'],['hint','ヒント','Hint'],['auto','自動整理','Auto finish'],['new','新しいゲーム','New game'],['rt','遊び方','How to play'],['nt','新しいゲーム','New game'],['cancelNew','続ける','Keep playing'],['confirmNew','配り直す','Deal new cards']])$(id).textContent=text(a,b);$('ruleText').textContent=text('左上の山札を押して1枚めくります。場札は赤と黒を交互に、数字が1つ小さいカードを重ねます。空いた列にはKだけを置けます。右上には同じマークをAからKまで順番に集めます。カードを選んで行き先を押すか、ドラッグで移動。同じカードをもう一度押すと右上へ送れます。山札は何度でも巡回可能。ランダム配札のため、すべてのゲームが解けるとは限りません。ヒントは合法な一手の案内で、解決を保証しません。','Tap the stock to draw one card. Build columns downward in alternating colors. Only Kings fill empty columns. Build the four suit piles from Ace to King. Select a card, then tap its destination, or drag it. Tap the selected card again to send it to its suit pile. Unlimited stock passes. Random deals are not guaranteed winnable. Hints show a legal move, not a guaranteed solution.');$('newText').textContent=text('現在のゲームを終了して、新しく配り直しますか？','End this game and deal a new hand?');$('undo').disabled=!history.length;$('auto').disabled=!(g.stock.length===0&&g.waste.length===0&&g.t.every(a=>a.every(c=>c.up)))||K.won(g)}
let layout;function render(){board.replaceChildren();const w=board.clientWidth,gap=w<420?5:10,pad=gap,cw=(w-pad*2-gap*6)/7,ch=cw*1.4,step=Math.max(19,cw*.37),row=pad+ch+20;layout={cw,ch,step,row,gap,pad};let needed=row+ch;g.t.forEach(a=>needed=Math.max(needed,row+(a.length-1)*step+ch+18));board.style.height=Math.max(440,needed)+'px';const x=i=>pad+i*(cw+gap);
function slot(i,y,label,p,stock=false){let el=document.createElement('button');el.className='slot';el.style.cssText=`left:${x(i)}px;top:${y}px;width:${cw}px;height:${ch}px`;el.textContent=label;el.setAttribute('aria-label',stock?text('山札をめくる','Draw stock'):label);el.onclick=()=>stock?draw():target(p);el.dataset.dest=JSON.stringify(p);board.append(el)}
slot(0,pad,g.stock.length?'':'↻',null,true);slot(1,pad,'', {k:'w',i:0});for(let i=0;i<4;i++)slot(i+3,pad,suit[i],{k:'f',i});for(let i=0;i<7;i++)slot(i,row,'K',{k:'t',i});
function card(c,i,y,p,back=false){const el=document.createElement('div');el.className='card'+(back?' back':K.red(c)?' red':'');el.style.cssText=`left:${x(i)}px;top:${y}px;width:${cw}px;height:${ch}px`;if(!back){el.innerHTML=`<span class="corner">${rank(c.r)} ${suit[c.s]}</span><span class="center">${suit[c.s]}</span>`;el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label',cardName(c));el.dataset.src=JSON.stringify(p);el.dataset.dest=JSON.stringify({k:p.k,i:p.i});if(selected&&selected.k===p.k&&selected.i===p.i&&(p.k!=='t'||p.at>=selected.at))el.classList.add('selected');el.onclick=()=>{if(suppress)return;if(selected&&selected.k===p.k&&selected.i===p.i&&selected.at===p.at){if(toFoundation(p))return;selected=null;render();message('');return}if(selected&&target({k:p.k,i:p.i}))return;selected=p;render();message(text('移動先を選んでください','Choose a destination'))};el.ondblclick=()=>toFoundation(p);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};el.onpointerdown=e=>beginDrag(e,p,el)}else if(i===0&&y===pad){el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label',text('山札をめくる','Draw stock'));el.onclick=draw;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();draw()}}}board.append(el)}
if(g.stock.length)card(g.stock[g.stock.length-1],0,pad,null,true);if(g.waste.length)card(g.waste[g.waste.length-1],1,pad,{k:'w',i:0});g.f.forEach((a,i)=>{if(a.length)card(a[a.length-1],i+3,pad,{k:'f',i})});g.t.forEach((a,i)=>a.forEach((c,at)=>card(c,i,row+at*step,{k:'t',i,at},!c.up)));labels();if(K.won(g))message(text('クリア！すべてのカードが揃いました。','You win! All 52 cards are home.'))}
function commit(p,q){if(!K.legal(g,p,q))return false;stopAuto();record();K.move(g,p,q);selected=null;save();render();message(K.won(g)?text('クリア！おめでとう！','You win! Well played!'):'');return true}
function target(q){if(!selected)return false;return commit(selected,q)}function draw(){stopAuto();if(!g.stock.length&&!g.waste.length)return;record();K.draw(g);selected=null;save();render();message('')}
function toFoundation(p){for(let i=0;i<4;i++)if(commit(p,{k:'f',i}))return true;return false}
function beginDrag(e,p,el){if(e.button!==0||!K.source(g,p))return;drag={id:e.pointerId,p,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,el,ghost:null};el.setPointerCapture(e.pointerId)}
window.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;if(!d.ghost&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>7){d.ghost=d.el.cloneNode(true);d.ghost.classList.add('ghost');d.ghost.removeAttribute('tabindex');document.body.append(d.ghost);d.ghost.style.width=layout.cw+'px';d.ghost.style.height=layout.ch+'px'}if(d.ghost){e.preventDefault();d.ghost.style.left=e.clientX-layout.cw/2+'px';d.ghost.style.top=e.clientY-18+'px'}},{passive:false});
function release(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(d.ghost){d.ghost.remove();suppress=true;setTimeout(()=>suppress=false,100);if(!cancel){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-dest]');let dest=el?JSON.parse(el.dataset.dest):null;if(!dest){const r=board.getBoundingClientRect(),i=Math.floor((e.clientX-r.left-layout.pad)/(layout.cw+layout.gap));if(e.clientY-r.top>=layout.row&&i>=0&&i<7)dest={k:'t',i}}if(!commit(d.p,dest))message(text('そこには置けません','That move is not allowed'))}}}
window.addEventListener('pointerup',e=>release(e));window.addEventListener('pointercancel',e=>release(e,true));$('undo').onclick=()=>{stopAuto();if(!history.length)return;g=history.pop();selected=null;save();render();message('')};$('hint').onclick=()=>{const opts=K.options(g);if(opts.length){selected=opts[0].p;render();const p=opts[0].q;message(p.k==='f'?text('選んだカードを右上の同じマークへ','Move the selected card to its suit pile'):text('選んだカードを '+(p.i+1)+' 列目へ','Move the selected cards to column '+(p.i+1)));board.querySelectorAll('[data-dest]').forEach(el=>{const q=JSON.parse(el.dataset.dest);if(q&&q.k===p.k&&q.i===p.i)el.classList.add('hint')})}else{selected=null;message(g.stock.length||g.waste.length?text('山札をめくってみましょう。巡回しても進めなければ戻すか配り直せます。','Try drawing the stock. If cycling does not help, undo or start a new hand.'):text('場札から動かせるカードはありません。戻すか配り直せます。','No available moves. Undo or start a new hand.'))}};
$('auto').onclick=()=>{if($('auto').disabled)return;function step(){const m=K.options(g).find(m=>m.q.k==='f');if(!m)return;commit(m.p,m.q);if(!K.won(g))autoTimer=setTimeout(step,160)}step()};$('new').onclick=()=>{stopAuto();$('newDialog').showModal()};$('cancelNew').onclick=()=>$('newDialog').close();$('confirmNew').onclick=()=>{g=K.deal();history=[];selected=null;$('newDialog').close();save();render();message('')};$('lang').onclick=()=>{ja=!ja;save();render();message('')};$('help').onclick=()=>$('rules').showModal();$('closeRules').onclick=()=>$('rules').close();window.addEventListener('resize',()=>{if(drag?.ghost)drag.ghost.remove();drag=null;render()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAuto()});render();
</script></html>
