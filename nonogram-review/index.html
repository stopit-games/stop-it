function lineTo(i){const n=puzzle().size,a=stroke.last;let x=a%n,y=Math.floor(a/n);const bx=i%n,by=Math.floor(i/n),dx=Math.abs(bx-x),dy=Math.abs(by-y),sx=x<bx?1:-1,sy=y<by?1:-1;let error=dx-dy;while(true){setCell(y*n+x);if(x===bx&&y===by)break;const e=2*error;if(e>-dy){error-=dy;x+=sx;}if(e<dx){error+=dx;y+=sy;}}stroke.last=i;}

$('hint').onclick=()=>{finish();const d=E.deductions(puzzle(),board);if(d.contradiction){$('message').textContent=t('bad');return;}const h=d.steps[0];if(!h){$('message').textContent=t('none');return;}history.push(board.slice());board[h.index]=h.value;draw();save();const axis=lang==='ja'?(h.axis?'列':'行'):(h.axis?'Column':'Row'),action=h.value===1?t('paint'):'×';$('message').textContent=lang==='ja'?`${axis}${h.line+1}、数字 ${h.clue.join('・')||'0'}。入力に合う${h.candidates}通りすべてで${h.position+1}マス目は「${action}」になるため確定。`:`${axis} ${h.line+1}, clues ${h.clue.join(', ')||'0'}: all ${h.candidates} valid arrangements agree that position ${h.position+1} is ${action}.`;check();};
P.forEach((p,i)=>{const el=document.createElement('option');el.value=i;el.textContent=`${p.size}×${p.size} · Stage ${i+1}`;$('stage').append(el);});$('stage').onchange=e=>{finish(true);save();id=+e.target.value;load();save();};$('settingsButton').onclick=()=>{finish();$('settings').showModal();};$('closeSettings').onclick=()=>$('settings').close();$('language').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang);}catch{}render();$('message').textContent=t('initial');};$('restart').onclick=()=>{if(!confirm(lang==='ja'?'この問題を最初からやり直しますか？':'Restart this puzzle?'))return;board.fill(-1);history=[];draw();save();$('settings').close();};$('next').onclick=()=>{$('clear').close();if(id<P.length-1){id++;load();save();}};$('back').onclick=()=>$('clear').close();window.addEventListener('pagehide',()=>{finish(true);save();});new ResizeObserver(resize).observe($('puzzleArea'));window.visualViewport?.addEventListener('resize',resize);load();
