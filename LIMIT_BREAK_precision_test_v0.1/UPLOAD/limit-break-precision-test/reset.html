<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>検証設定の解除</title></head><body><h1>検証設定の解除</h1><p>この検証フォルダに登録した設定だけを解除します。</p><button id="reset">解除する</button><p id="state" role="status"></p><script>
document.getElementById('reset').addEventListener('click',async()=>{try{if(navigator.serviceWorker){const scope=new URL('./',location.href).href,registrations=scope.endsWith('/limit-break-precision-test/')?await navigator.serviceWorker.getRegistrations():[];for(const r of registrations){if(r.scope===scope)await r.unregister();}}document.getElementById('state').textContent='解除しました。この検証タブを閉じてください。';}catch(e){document.getElementById('state').textContent='解除できませんでした：'+e.message;}});
</script></body></html>
