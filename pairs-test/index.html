const words={en:{menuTitle:'Find your quiet focus.',menuIntro:'Four of each tile. Which pair comes first?',garden:'Garden',terrace:'Terrace',moon:'Moonrise',dragon:'Dragon',zoomIn:'＋ Zoom',zoomOut:'− Fit',rotate:'136 tiles: turn your phone sideways for the full board.',tiles:'tiles',menu:'← Menu',undo:'↶ Undo',hint:'✧ Hint',shuffle:'↻ Retry',next:'NEW BOARD →',ready:'Match two tiles: nothing above, and one side open.',selected:'Now choose its matching tile.',blocked:'Free the top and at least one side first.',different:'Different designs. Try another pair.',stuck:'No pairs left. Undo a move or retry the same board.',rescue:'UNDO A MOVE',shuffled:'A fresh arrangement. Every remaining tile can be cleared.',hinted:'A possible pair. Think about what it uncovers.',win:'A little space, beautifully cleared.',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact',soundOn:'Sound on',soundOff:'Sound off',names:[...Array.from({length:9},(_,i)=>(i+1)+' Circles'),...Array.from({length:9},(_,i)=>(i+1)+' Bamboo'),...Array.from({length:9},(_,i)=>(i+1)+' Characters'),'East','South','West','North','Red dragon','Green dragon','White dragon'],tile:'Tile',free:'free',locked:'blocked'},ja:{menuTitle:'重なりをほどく、ひと休み。',menuIntro:'同じ牌は4枚。どの2枚から取る？',garden:'花庭',terrace:'重庭',moon:'月楼',dragon:'龍城',zoomIn:'＋ 拡大',zoomOut:'− 全体',rotate:'136枚はスマホを横向きにすると見やすくなります。',tiles:'枚',menu:'← メニュー',undo:'↶ 1手戻す',hint:'✧ ヒント',shuffle:'↻ やり直す',next:'新しい問題 →',ready:'上に牌がなく、左右どちらかが空いた牌を2枚。',selected:'同じ絵柄の牌を選んでください。',blocked:'上と、左右どちらかを空けると取れます。',different:'絵柄が違います。別のペアを探そう。',stuck:'手詰まりです。戻って取り方を変えるか、やり直そう。',rescue:'1手戻して考え直す',shuffled:'残りの牌を、すべて消せる配置に並べ直しました。',hinted:'取れるペアの例です。下に何があるかも考えよう。',win:'すっきり、最後のひと組まで。',back:'← PLAY ROOMに戻る',about:'このサイトについて',privacy:'プライバシーポリシー',contact:'お問い合わせ',soundOn:'音あり',soundOff:'音なし',names:[...['一','二','三','四','五','六','七','八','九'].map(n=>n+'筒'),...['一','二','三','四','五','六','七','八','九'].map(n=>n+'索'),...['一','二','三','四','五','六','七','八','九'].map(n=>n+'萬'),'東','南','西' let mode='garden',tiles=[],initial=[],history=[],selected=null,hints=[],active=false,busy=false,status='ready',total=0,timer=null,sound=false,audio=null,zoomed=false;
const clone=a=>a.map(t=>({...t}));
function tone(win=false){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=win?[523,659,784,1046]:[659,880];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25)})}catch{}}
function chooseMode(m){mode=m;labels()}
function labels(){const t=words[lang];document.documentElement.lang=lang;$('language').textContent=lang==='en'?'日本語':'English';for(const id of ['menuTitle','menuIntro','undo','hint','shuffle','next','back','about','privacy','contact','stuckText','rescue','winText'])$(id).textContent=t[id==='stuckText'?'stuck':id==='winText'?'win':id];$('menuButton').textContent=t.menu;$('zoom').textContent=t[zoomed?'zoomOut':'zoomIn'];$('rotateNote').textContent=t.rotate;$('rotateNote').hidden=mode!=='dragon';$('sound').textContent=sound?'♫':'♪';$('sound').setAttribute('aria-label',t[sound?'soundOn':'soundOff']);$('sound').setAttribute('aria-pressed',String(sound));$('layouts').innerHTML=['garden','terrace','moon','dragon'].map(m=>'<button class="layout" data-mode="'+m+'" aria-pressed="'+(m===mode)+'"><strong>'+t[m]+'</strong><small>'+E.counts[m]+' '+t.tiles+'</small></button>').join('');if(active&&!busy)render()}
function sizeBoard(){const board=$('board'),host=board.parentElement,positions=E.layout(mode),maxZ=Math.max(...positions.map(t=>t.z)),cols=Math.max(...positions.map(t=>t.x+1)),rows=Math.max(...positions.map(t=>t.y+1)),wide=matchMedia('(orientation:landscape) and (max-height:600px)').matches,availW=host.clientWidth-22,availH=wide?host.clientHeight-30:Infinity;
let sx=wide?Math.min(availW/(cols+maxZ*.1),availH/(rows*1.25+maxZ*.12)):(mode==='dragon'?Math.max(34,Math.min(60,availW/(cols+maxZ*.1))):Math.min(390,availW)/(cols+maxZ*.1));sx*=zoomed?1.4:1;const sy=sx*1.25,dx=sx*.08,dy=sy*.08;
board.style.width=(cols*sx+maxZ*dx)+'px';board.style.height=(rows*sy+maxZ*dy+8)+'px';board.querySelectorAll('.tile').forEach(b=>{const p=tiles.find(t=>t.id===Number(b.dataset.id));if(!p)return;b.style.left=(p.x*sx+p.z*dx)+'px';b.style.top=(p.y*sy+(maxZ-p.z)*dy)+'px';b.style.width=(sx-3)+'px';b.style.height=(sy-6)+'px';b.style.zIndex=String(p.z*10000+Math.round(p.y*100)+p.x)})}
function render(){const t=words[lang],board=$('board'),focusId=document.activeElement?.dataset?.id;board.innerHTML=tiles.map(p=>{const free=E.free(tiles,p.id),sel=selected===p.id;return '<button class="tile'+(free?'':' blocked')+(sel?' selected':'')+(hints.includes(p.id)?' hinted':'')+'" data-id="'+p.id+'" aria-label="'+t.tile+' '+(p.id+1)+' · '+t.names[p.type]+' · '+(free?t.free:t.locked)+'" aria-pressed="'+sel+'">'+art(p.type)+'</button>'}).join('');sizeBoard();if(focusId!==undefined)board.querySelector('[data-id="'+focusId+'"]')?.focus({preventScroll:true});$('counter').innerHTML='<b>'+tiles.length/2+'</b> / '+total/2+' '+(lang==='ja'?'組':'pairs');$('progress').style.width=(100*(total-tiles.length)/total)+'%';$('status').textContent=t[status]||t.ready;$('undo').disabled=busy||!history.length;$('hint').disabled=busy||!tiles.length||!E.pairs(tiles).length;$('shuffle').disabled=busy||!tiles.length;$('win').hidden=tiles.length!==0;$('rescue').disabled=busy||!history.length;$('stuck').hidden=!tiles.length||busy||E.pairs(tiles).length>0}
function stop(){clearTimeout(timer);timer=null;busy=false;hints=[];selected=null}
function start(){stop();zoomed=false;document.querySelector('main').classList.toggle('full-board',mode==='dragon');$('zoom').textContent=words[lang].zoomIn;tiles=E.challenge(mode).tiles;initial=clone(tiles);total=tiles.length;history=[];active=true;status='ready';$('menu').hidden=true;$('play').hidden=false;render()}
function menu(){stop();active=false;$('menu').hidden=false;$('play').hidden=true;document.querySelector('main').classList.remove('full-board')}
function mark(id){const b=$('board').querySelector('[data-id="'+id+'"]');b?.classList.remove('shake');if(b){void b.offsetWidth;b.classList.add('shake')}}
function tap(id){if(!active||busy)return;const p=tiles.find(t=>t.id===id);if(!p)return;hints=[];if(!E.free(tiles,id)){status='blocked';render();mark(id);return}if(selected===id){selected=null;status='ready';render();return}if(selected===null){selected=id;status='selected';render();return}const result=E.remove(tiles,selected,id);if(!result){selected=id;status='different';render();return}history.push(clone(tiles));busy=true;for(const key of [selected,id])$('board').querySelector('[data-id="'+key+'"]')?.classList.add('removing');$('undo').disabled=true;$('hint').disabled=true;$('shuffle').disabled=true;tone();timer=setTimeout(()=>{timer=null;tiles=result;selected=null;busy=false;status=tiles.length&&!E.pairs(tiles).length?'stuck':'ready';if(!tiles.length){zoomed=false;$('zoom').textContent=words[lang].zoomIn;$('board').parentElement.scrollLeft=0;$('board').parentElement.scrollTop=0}render();if(!tiles.length)tone(true)},280)}
