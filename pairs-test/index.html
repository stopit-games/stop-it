function menu(){stop();active=false;$('menu').hidden=false;$('play').hidden=true}
function mark(id){const b=$('board').querySelector('[data-id="'+id+'"]');b?.classList.remove('shake');if(b){void b.offsetWidth;b.classList.add('shake')}}
function tap(id){if(!active||busy)return;const p=tiles.find(t=>t.id===id);if(!p)return;hints=[];if(!E.free(tiles,id)){status='blocked';render();mark(id);return}if(selected===id){selected=null;status='ready';render();return}if(selected===null){selected=id;status='selected';render();return}const result=E.remove(tiles,selected,id);if(!result){selected=id;status='different';render();return}history.push(clone(tiles));busy=true;for(const key of [selected,id])$('board').querySelector('[data-id="'+key+'"]')?.classList.add('removing');$('undo').disabled=true;$('hint').disabled=true;$('shuffle').disabled=true;tone();timer=setTimeout(()=>{timer=null;tiles=result;selected=null;busy=false;status=tiles.length&&!E.pairs(tiles).length?'stuck':'ready';render();if(!tiles.length)tone(true)},280)}
function undo(){if(busy||!history.length)return;tiles=history.pop();selected=null;hints=[];status='ready';render()}
function shuffle(){if(busy||!tiles.length)return;history.push(clone(tiles));tiles=E.deal(tiles,Math.random,true).tiles;selected=null;hints=[];status='shuffled';render()}
function hint(){if(busy)return;const p=E.pairs(tiles)[0];if(!p){status='stuck';render();return}selected=null;hints=p;status='hinted';render()}
$('layouts').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)chooseMode(b.dataset.mode)});
$('board').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)tap(Number(b.dataset.id));else if(!busy){selected=null;hints=[];status='ready';render()}});
$('start').onclick=start;$('menuButton').onclick=menu;$('undo').onclick=undo;$('shuffle').onclick=shuffle;$('rescue').onclick=shuffle;$('hint').onclick=hint;$('next').onclick=start;$('winNext').onclick=start;
$('language').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('stopit-language-v1',lang)}catch{}labels()};
$('sound').onclick=()=>{sound=!sound;labels();if(sound)tone()};
window.addEventListener('resize',()=>{if(active)sizeBoard()});
$('sampleA').innerHTML=art(0);$('sampleB').innerHTML=art(0);$('petals').innerHTML=Array.from({length:22},(_,i)=>'<i style="left:'+i*4.7+'%;animation-delay:'+(i%7)*.21+'s;animation-duration:'+(2.5+(i%4)*.4)+'s;opacity:'+(.3+(i%3)*.2)+'"></i>').join('');labels();
</script></body></html>
