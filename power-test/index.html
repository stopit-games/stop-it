<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONNECT POWER! v0.4 | PLAY ROOM</title><meta name="theme-color" content="#101b30"><style>
:root{color-scheme:dark;--gold:#ffe184;--mint:#8ff2d0}*{box-sizing:border-box}body{margin:0;color:#f2f6ff;background:radial-gradient(ellipse at top,#223956,#101b30 65%);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:470px;margin:auto;padding:12px 16px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(21px,5.5vw,27px);margin:4px 0;letter-spacing:-.04em}small{font-size:12px;color:#aec3de}button{font:inherit;color:inherit;background:#243b58;border:1px solid #6b84a4;border-radius:12px;min-height:44px;padding:10px 12px;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{cursor:default}.lang{font-size:14px;white-space:nowrap}.tagline{color:#ccdbed;text-align:center;font-size:14px;margin:16px 0 12px;line-height:1.5}.stats{display:flex;justify-content:space-between;margin:12px 0 10px;font-size:14px;color:#bfd2e8}.boardWrap{width:min(100%,max(244px,calc(100svh - 290px)));margin:auto;position:relative;border:1px solid #46607f;border-radius:24px;background:#122038;padding:18px;box-shadow:0 18px 45px #0003}.board{position:relative;aspect-ratio:1}.tile,.slot,.blank{position:absolute;width:calc((100% - 16px)/3);height:calc((100% - 16px)/3);border-radius:12px}.slot{background:#192b43;border:1px solid #304962;pointer-events:none}.tile{padding:0;min-height:0;aspect-ratio:1;overflow:visible;z-index:2;border:1px solid #425c7d;background:linear-gradient(145deg,#2b4262,#1c304c);transition:left .18s ease-out,top .18s ease-out,border-color .15s;-webkit-tap-highlight-color:transparent}.tile.movable{border-color:#9ab8d8;box-shadow:inset 0 0 0 1px #b3d5f51c}.tile:disabled{color:inherit;opacity:1}.tile svg{display:block;width:100%;height:100%;overflow:visible}.backWire{stroke:#0c1728;stroke-width:16;fill:none;stroke-linecap:round;stroke-linejoin:round}.frontWire{stroke:#a9bfd8;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}.connected .frontWire{stroke:var(--gold);filter:drop-shadow(0 0 3px #ffce50)}.blank{border:1px dashed #6b85a3;background:radial-gradient(ellipse,#253e5a,#0c182b);display:grid;place-items:center;color:#6583a2;font-size:26px;pointer-events:none}.pin{position:absolute;z-index:4;top:calc(50% - 13px);width:25px;height:26px;display:grid;place-items:center;border:1px solid #6c87a7;border-radius:8px;background:#122038;pointer-events:none}.sourcePin{left:-16px;color:var(--gold);font-size:23px}.bulbPin{right:-16px}.bulb{width:19px;height:21px;fill:#69829c;stroke:#a4bed7;stroke-width:1.5}.connected .bulb{fill:#ffe184;stroke:#fff1ad;filter:drop-shadow(0 0 7px #ffe184)}.pinHolder{position:absolute;width:calc((100% - 16px)/3);height:calc((100% - 16px)/3);pointer-events:none;z-index:4}.boardWrap.connected{border-color:#ffe184;box-shadow:0 0 30px #ffe18444}.status{min-height:38px;margin:12px 0 8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:800;color:#c4d5e9}.status.success{color:var(--gold);font-size:20px}.tools{display:flex;gap:8px}.tools button{flex:1;font-size:13px;padding:10px 6px}.tile.demoTarget{border-color:#ffe184;box-shadow:0 0 18px #ffe18488;z-index:3}.tools button:disabled{opacity:.45}.retry{width:100%;background:#286653;border-color:var(--mint);font-weight:800;margin-top:10px}footer{text-align:center;font-size:12px;line-height:2;margin-top:24px;border-top:1px solid #354864;padding-top:12px}a{color:#b8dcff;margin:0 4px}[hidden]{display:none!important}@media(max-height:650px){main{padding-top:8px}.tagline{margin:10px 0 8px}.stats{margin-top:8px}.status{margin-top:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div><h1>CONNECT POWER!</h1><small>v0.4 · PLAY ROOM</small></div><button class="lang" id="language">日本語</button></header><p class="tagline" id="tagline"></p><div class="stats"><span id="puzzleLabel"></span><span id="moves"></span></div><div id="boardWrap" class="boardWrap"><div id="board" class="board"></div></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="tools"><button id="undo"></button><button id="reset"></button><button id="reveal"></button></div><button class="retry" id="again" hidden></button><footer><a id="back" href="/games/"></a><br><a id="about" href="/about.html"></a> · <a id="privacy" href="/privacy.html"></a> · <a id="contact" href="/contact.html"></a></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),D=[[-1,0],[0,1],[1,0],[0,-1]];let SOURCE=0,GOAL=5;
// Eight fixed-orientation tiles; -1 is the empty square.
const questions=[{"source": 0, "target": 5, "masks": [12, 5, 3, 9, 5, 6, 12, 3], "shortest": 4, "initial": [0, 6, -1, 1, 5, 7, 2, 4, 3], "solution": [1, 4, 7, 8]}, {"source": 3, "target": 8, "masks": [9, 6, 10, 12, 9, 6, 3, 10], "shortest": 6, "initial": [2, 3, 4, 1, -1, 5, 0, 6, 7], "solution": [5, 2, 1, 0, 3, 6]}, {"source": 6, "target": 5, "masks": [10, 9, 12, 3, 6, 10, 12, 3], "shortest": 8, "initial": [-1, 3, 5, 2, 4, 6, 0, 1, 7], "solution": [1, 4, 3, 0, 1, 2, 5, 8]}];
const dict={en:{tagline:'Tap beside the empty square to connect the wires.',puzzleLabel:'Puzzle',moves:'Moves',ready:'ϟ → 💡',clear:'POWER CONNECTED!',all:'ALL CONNECTED!',next:'NEXT PUZZLE →',reveal:'Show answer',demo:'Showing solution…',solution:'SOLUTION',retry:'TRY THIS PUZZLE AGAIN',undo:'↶ Undo',reset:'↻ Reset',again:'PLAY AGAIN →',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact',tile:'Tile',move:'slide into the empty square',blocked:'not next to the empty square',empty:'Empty square'},ja:{tagline:'空きマスの隣をタップして、線をつなごう。',puzzleLabel:'問題',moves:'移動',ready:'ϟ → 💡',clear:'POWER CONNECTED!',all:'ALL CONNECTED!',next:'次の問題へ →',reveal:'答えを見る',demo:'正解手順を再生中…',solution:'解答例',retry:'この問題に再挑戦',undo:'↶ 1手戻す',reset:'↻ リセット',again:'もう一度遊ぶ →',back:'← PLAY ROOMに戻る',about:'このサイトについて',privacy:'プライバシーポリシー',contact:'お問い合わせ',tile:'タイル',move:'空きマスへ移動できます',blocked:'空きマスの隣ではありません',empty:'空きマス'}};
function direction(a,b){const d=b-a;return d===-3?0:d===1?1:d===3?2:3}
let questionIndex=0,masks=[],initial=[];
function neighbors(a,b){return Math.abs(a%3-b%3)+Math.abs(Math.floor(a/3)-Math.floor(b/3))===1}
function swapEmpty(a,pos){const next=a.slice(),empty=a.indexOf(-1);if(!neighbors(pos,empty))return null;[next[pos],next[empty]]=[next[empty],next[pos]];return next}
function connected(a){if(a[SOURCE]===-1||a[GOAL]===-1)return false;const ports=a.map(id=>id===-1?0:masks[id]);if(!(ports[SOURCE]&8)||!(ports[GOAL]&2))return false;const q=[SOURCE],seen=new Set;while(q.length){const cell=q.pop();if(seen.has(cell))continue;seen.add(cell);const y=Math.floor(cell/3),x=cell%3;for(let d=0;d<4;d++)if(ports[cell]&(1<<d)){const yy=y+D[d][0],xx=x+D[d][1];if(yy<0||yy>2||xx<0||xx>2){if(!((cell===SOURCE&&d===3)||(cell===GOAL&&d===1)))return false}else{const n=yy*3+xx;if(!(ports[n]&(1<<((d+2)%4))))return false;if(!seen.has(n))q.push(n)}}}return seen.size===8}
let lang='en';try{lang=localStorage.getItem('stopit-language-v1')==='ja'?'ja':'en'}catch{}
let board=[],moves=0,history=[],solved=false,reviewing=false,gaveUp=false,demoIndex=0,demoTimer=null;const buttons=[],slots=[];
function position(el,pos){const x=pos%3,y=Math.floor(pos/3);el.style.left='calc('+x*100/3+'% + '+x*8/3+'px)';el.style.top='calc('+y*100/3+'% + '+y*8/3+'px)'}
function wire(mask){const parts=[];for(let d=0;d<4;d++)if(mask&(1<<d))parts.push('M50 50 L'+[[50,0],[100,50],[50,100],[0,50]][d].join(' '));const line=parts.join(' ');return '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="backWire" d="'+line+'"/><path class="frontWire" d="'+line+'"/><circle cx="50" cy="50" r="3" fill="#e0eaf5"/></svg>'}
function build(){$('board').innerHTML='';buttons.length=0;slots.length=0;for(let pos=0;pos<9;pos++){const el=document.createElement('div');el.className='slot';position(el,pos);$('board').appendChild(el);slots.push(el)}for(let id=0;id<8;id++){const b=document.createElement('button');b.className='tile';b.innerHTML=wire(masks[id]);b.onclick=()=>move(id);$('board').appendChild(b);buttons.push(b)}const blank=document.createElement('div');blank.id='empty';blank.className='blank';blank.textContent='·';blank.setAttribute('role','img');$('board').appendChild(blank);const source=document.createElement('div');source.className='pinHolder';position(source,SOURCE);source.innerHTML='<span class="pin sourcePin" aria-hidden="true">ϟ</span>';$('board').appendChild(source);const target=document.createElement('div');target.className='pinHolder';position(target,GOAL);target.innerHTML='<span class="pin bulbPin" aria-hidden="true"><svg class="bulb" viewBox="0 0 24 24"><path d="M12 2C5 2 3 10 8 14l1 4h6l1-4C21 10 19 2 12 2Z"/><path d="M9 21h6" fill="none"/></svg></span>';$('board').appendChild(target)}
function paint(){const t=dict[lang],empty=board.indexOf(-1);buttons.forEach((b,id)=>{const pos=board.indexOf(id),allowed=!solved&&!reviewing&&neighbors(pos,empty);position(b,pos);b.disabled=!allowed;b.classList.toggle('movable',allowed);b.classList.toggle('demoTarget',reviewing&&id===board[questions[questionIndex].solution[demoIndex]]);b.setAttribute('aria-label',t.tile+' '+(Math.floor(pos/3)+1)+','+(pos%3+1)+' · '+(allowed?t.move:t.blocked))});position($('empty'),empty);$('empty').setAttribute('aria-label',t.empty);$('boardWrap').classList.toggle('connected',solved);$('moves').textContent=t.moves+' '+moves;$('status').textContent=reviewing?t.demo:gaveUp&&solved?t.solution:solved?(questionIndex===questions.length-1?t.all:t.clear):t.ready;$('puzzleLabel').textContent=t.puzzleLabel+' '+(questionIndex+1)+' / '+questions.length;$('again').textContent=gaveUp?t.retry:questionIndex===questions.length-1?t.again:t.next;$('status').className='status'+(solved?' success':'');$('undo').disabled=history.length===0||solved||reviewing;$('reveal').disabled=solved||reviewing;$('reset').disabled=false;$('again').hidden=!solved}
function move(id){if(solved||reviewing)return;const pos=board.indexOf(id),next=swapEmpty(board,pos);if(!next)return;history.push(board.slice());board=next;moves++;solved=connected(board);paint()}
function reset(){stopDemo();gaveUp=false;board=initial.slice();history=[];moves=0;solved=false;paint()}
function loadQuestion(index){stopDemo();gaveUp=false;questionIndex=index;const q=questions[index];SOURCE=q.source;GOAL=q.target;masks=q.masks.slice();initial=q.initial.slice();board=initial.slice();history=[];moves=0;solved=false;build();labels()}
function stopDemo(){clearTimeout(demoTimer);demoTimer=null;reviewing=false}
function reveal(){if(solved||reviewing)return;stopDemo();board=initial.slice();moves=0;history=[];solved=false;gaveUp=true;reviewing=true;demoIndex=0;build();paint();demoTimer=setTimeout(demoStep,800)}
function demoStep(){demoTimer=null;if(!reviewing)return;const route=questions[questionIndex].solution;board=swapEmpty(board,route[demoIndex]);moves++;demoIndex++;if(demoIndex===route.length){reviewing=false;solved=connected(board);paint();return}paint();demoTimer=setTimeout(demoStep,800)}
function labels(){document.documentElement.lang=lang;$('language').textContent=lang==='en'?'日本語':'English';for(const id of ['tagline','undo','reveal','reset','again','back','about','privacy','contact'])$(id).textContent=dict[lang][id];paint()}
$('undo').onclick=()=>{if(solved||reviewing||!history.length)return;board=history.pop();moves=Math.max(0,moves-1);paint()};$('reset').onclick=reset;$('reveal').onclick=reveal;$('again').onclick=()=>{if(!solved)return;if(gaveUp){reset();return}loadQuestion(questionIndex<questions.length-1?questionIndex+1:0)};$('language').onclick=()=>{lang=lang==='en'?'ja':'en';try{localStorage.setItem('stopit-language-v1',lang)}catch{}labels()};loadQuestion(0);
</script></body></html>
