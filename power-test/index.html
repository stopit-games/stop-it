<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONNECT POWER! v0.1 | PLAY ROOM</title><meta name="theme-color" content="#101b30"><style>
:root{color-scheme:dark;--bg:#101b30;--panel:#1b2c46;--line:#46607f;--gold:#ffe184;--mint:#8ff2d0}*{box-sizing:border-box}body{margin:0;color:#f2f6ff;background:radial-gradient(ellipse at top,#223956,#101b30 65%);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:490px;margin:auto;padding:14px 16px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(21px,5.5vw,28px);margin:4px 0;letter-spacing:-.04em}small{font-size:12px;color:#aec3de}button{font:inherit;color:inherit;background:#243b58;border:1px solid #6b84a4;border-radius:12px;min-height:44px;padding:10px 12px;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{cursor:default}.lang{font-size:14px;white-space:nowrap}.panel{margin-top:20px;border:1px solid var(--line);border-radius:24px;padding:20px;background:#1b2c46bb}.tagline{text-align:center;color:#ccdbed;font-size:15px;margin:12px 0 18px;line-height:1.5}.hero{width:100%;height:180px;display:block}.primary{width:100%;background:#286653;border-color:var(--mint);font-weight:800;font-size:18px}.stats{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;font-size:14px}.dots{display:flex;gap:6px}.dot{width:8px;height:8px;background:#415371;border-radius:50%}.dot.done{background:var(--mint)}.dot.current{background:var(--gold);box-shadow:0 0 10px #ffe18466}.boardWrap{width:min(100%,max(220px,calc(100svh - 245px)));margin-inline:auto;position:relative;border:1px solid var(--line);border-radius:24px;background:#122038;padding:12px;box-shadow:0 18px 45px #0003}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{position:relative;padding:0;border:1px solid #405b7a;border-radius:12px;background:linear-gradient(145deg,#2b4262,#1c304c);aspect-ratio:1;min-height:0;overflow:visible;-webkit-tap-highlight-color:transparent}.tile svg{display:block;width:100%;height:100%;overflow:visible}.wire{transform-origin:50px 50px;transition:transform .18s ease-out}.wireBack{stroke:#0c1728;stroke-width:16;fill:none;stroke-linecap:round;stroke-linejoin:round}.wireFront{stroke:#92abc8;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}.tile.powered .wireFront{stroke:var(--gold);filter:drop-shadow(0 0 3px #ffce50)}.tile.source{border-color:#edc76a}.tile.target{border-color:#8ff2d0}.badge{position:absolute;top:3px;left:4px;width:23px;height:23px;background:#101b30;border:1px solid #55718e;border-radius:7px;display:grid;place-items:center;font-size:15px;z-index:2}.target .badge{left:auto;right:4px}.bulbIcon{width:18px;height:18px;fill:#708ba6;stroke:#afc6df;stroke-width:1.5}.lit .bulbIcon{fill:#ffe184;stroke:#fff3b9;filter:drop-shadow(0 0 5px #ffda70)}.entry{position:absolute;left:-7px;top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#ffe184;border:2px solid #fff0ad;z-index:3}.exit{left:auto;right:-7px;background:#7da396;border-color:#a4e8d1}.target.lit .exit{background:#ffe184;border-color:#fff0ad}.status{min-height:38px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#c5d5e8;font-size:15px;margin:10px 0}.status.success{color:var(--gold)}.tools{display:flex;gap:8px}.tools button{flex:1;font-size:14px}.boardWrap.clear{border-color:var(--gold);box-shadow:0 0 28px #ffe18445}.result{text-align:center}.result h2{color:var(--gold);font-size:clamp(39px,10vw,56px);margin:10px 0;line-height:1}.result .bolt{font-size:60px;color:var(--gold);text-shadow:0 0 28px #ffe184}.result p{color:#c0d4eb;line-height:1.7}.resultsList{display:flex;justify-content:space-between;gap:5px;margin:20px 0}.resultsList span{flex:1;background:#253d59;border:1px solid #557596;border-radius:9px;padding:8px 2px;font-size:13px}.result strong{color:var(--mint);font-size:32px}.result .primary{margin-top:16px}footer{text-align:center;font-size:12px;line-height:2;margin-top:26px;border-top:1px solid #354864;padding-top:12px}a{color:#b8dcff;margin:0 4px}[hidden]{display:none!important}@media(max-height:650px){main{padding-top:8px}.stats{margin-top:10px}.boardWrap{padding:10px}.board{gap:6px}.hero{height:145px}.panel{margin-top:14px}.tagline{margin:8px 0 12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div><h1>CONNECT POWER!</h1><small>v0.1 · PLAY ROOM</small></div><button class="lang" id="language">日本語</button></header>
<section class="panel" id="setup"><svg class="hero" viewBox="0 0 330 180" aria-hidden="true"><defs><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><g fill="#233e5b" stroke="#496584"><rect x="34" y="20" width="72" height="65" rx="12"/><rect x="116" y="20" width="72" height="65" rx="12"/><rect x="198" y="20" width="72" height="65" rx="12"/><rect x="34" y="95" width="72" height="65" rx="12"/><rect x="116" y="95" width="72" height="65" rx="12"/><rect x="198" y="95" width="72" height="65" rx="12"/></g><path d="M15 52 H70 V128 H152 V52 H234 V128 H303" fill="none" stroke="#ffd969" stroke-width="12" opacity=".5" filter="url(#glow)"/><path d="M15 52 H70 V128 H152 V52 H234 V128 H303" fill="none" stroke="#ffe184" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 35 L4 54 H14 L9 71 L27 47 H17 L23 35 Z" fill="#ffe184"/><g transform="translate(282,103)"><path d="M22 0 C7 0 4 17 13 25 L15 31 H29 L31 25 C40 17 37 0 22 0Z" fill="#ffe184" stroke="#fff1a9" stroke-width="2"/><path d="M15 35 H29 M18 40 H26" stroke="#b5d1df" stroke-width="3"/></g></svg><p class="tagline" id="tagline"></p><button class="primary" id="start"></button></section>
<section id="game" hidden><div class="stats"><span id="progress"></span><div class="dots" id="dots" aria-hidden="true"></div><span id="moves"></span></div><div class="boardWrap" id="boardWrap"><div class="board" id="board"></div></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="tools"><button id="reset"></button><button id="home"></button></div></section>
<section id="result" class="panel result" hidden><div class="bolt" aria-hidden="true">ϟ</div><h2>ALL<br>CONNECTED!</h2><p id="resultText"></p><strong id="totalMoves"></strong><div class="resultsList" id="resultsList"></div><button class="primary" id="again"></button></section>
<footer><a id="back" href="/games/"></a><br><a id="about" href="/about.html"></a> · <a id="privacy" href="/privacy.html"></a> · <a id="contact" href="/contact.html"></a></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),D=[[-1,0],[0,1],[1,0],[0,-1]];
// Directions are N,E,S,W. Every solved layout is one continuous nine-tile path.
const paths=[[0,1,2,5,4,3,6,7,8],[0,1,4,3,6,7,8,5,2],[6,7,4,3,0,1,2,5,8],[0,3,6,7,8,5,4,1,2],[6,3,0,1,4,7,8,5,2]];
const dict={en:{tagline:'Tap to rotate. Connect every wire and light the bulb.',start:'POWER ON →',progress:'Puzzle',moves:'Moves',reset:'↻ Reset puzzle',home:'Back to start',ready:'Connect all 9 tiles · ϟ → 💡',clear:'POWER CONNECTED!',resultText:'All five puzzles connected!',total:'total moves',again:'PLAY AGAIN →',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact',tile:'Tile',source:'power source',target:'light bulb',powered:'powered',off:'not powered'},ja:{tagline:'タップで回して、すべての線をつなごう。',start:'スタート →',progress:'問題',moves:'回転',reset:'↻ リセット',home:'最初の画面へ',ready:'9マスつないで点灯 · ϟ → 💡',clear:'POWER CONNECTED!',resultText:'全5問の電気がつながりました！',total:'回の回転でクリア',again:'もう一度遊ぶ →',back:'← PLAY ROOMに戻る',about:'このサイトについて',privacy:'プライバシーポリシー',contact:'お問い合わせ',tile:'マス',source:'電源',target:'電球',powered:'通電中',off:'未通電'}};
let lang='en';try{lang=localStorage.getItem('stopit-language-v1')==='ja'?'ja':'en'}catch{}
let screen='setup',index=0,moves=0,bases=[],turns=[],initial=[],solved=false,results=[],pending=null;
function rotateMask(mask,steps){steps=((steps%4)+4)%4;return ((mask<<steps)|(mask>>(4-steps)))&15}
function direction(from,to){const d=to-from;return d===-3?0:d===1?1:d===3?2:3}
function layout(path){const masks=Array(9).fill(0);path.forEach((cell,i)=>{const before=i?direction(cell,path[i-1]):3,after=i<8?direction(cell,path[i+1]):1;masks[cell]=(1<<before)|(1<<after)});return masks}
function inspect(masks,start,end){const powered=new Set(),q=[];if(masks[start]&8)q.push(start);while(q.length){const cell=q.pop();if(powered.has(cell))continue;powered.add(cell);const y=Math.floor(cell/3),x=cell%3;for(let d=0;d<4;d++){if(!(masks[cell]&(1<<d)))continue;const yy=y+D[d][0],xx=x+D[d][1];if(yy<0||yy>2||xx<0||xx>2)continue;const n=yy*3+xx;if(masks[n]&(1<<((d+2)%4)))q.push(n)}}let valid=powered.size===9&&!!(masks[end]&2);if(valid)for(let cell=0;cell<9;cell++){const y=Math.floor(cell/3),x=cell%3;for(let d=0;d<4;d++)if(masks[cell]&(1<<d)){const yy=y+D[d][0],xx=x+D[d][1];if(yy<0||yy>2||xx<0||xx>2){if(!((cell===start&&d===3)||(cell===end&&d===1)))valid=false}else if(!(masks[yy*3+xx]&(1<<((d+2)%4))))valid=false}}return {powered,valid,bulb:valid}}
function scramble(masks,count){const t=Array(9).fill(0),cells=Array.from({length:9},(_,i)=>i);for(let i=8;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}for(const cell of cells.slice(0,count)){const choices=[1,2,3].filter(n=>rotateMask(masks[cell],n)!==masks[cell]);t[cell]=choices[Math.floor(Math.random()*choices.length)]}return t}
function currentMasks(){return bases.map((m,i)=>rotateMask(m,turns[i]))}
const bulb='<svg class="bulbIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C5 2 3 10 8 14l1 4h6l1-4C21 10 19 2 12 2Z"/><path d="M9 21h6" fill="none" stroke-linecap="round"/></svg>';
function tileSVG(mask){const p=[];for(let d=0;d<4;d++)if(mask&(1<<d)){const coords=[[50,0],[100,50],[50,100],[0,50]][d];p.push('M50 50 L'+coords.join(' '))}const line=p.join(' ');return '<svg viewBox="0 0 100 100" aria-hidden="true"><g class="wire"><path class="wireBack" d="'+line+'"/><path class="wireFront" d="'+line+'"/><circle cx="50" cy="50" r="3" fill="#e0eaf5"/></g></svg>'}
function buildBoard(){const path=paths[index],start=path[0],end=path[8];$('board').innerHTML='';for(let i=0;i<9;i++){const b=document.createElement('button');b.className='tile'+(i===start?' source':'')+(i===end?' target':'');b.innerHTML=tileSVG(bases[i])+(i===start?'<span class="entry" aria-hidden="true"></span><span class="badge" aria-hidden="true">ϟ</span>':'')+(i===end?'<span class="entry exit" aria-hidden="true"></span><span class="badge" aria-hidden="true">'+bulb+'</span>':'');b.onclick=()=>turnTile(i);$('board').appendChild(b)}}
function paint(){const path=paths[index],state=inspect(currentMasks(),path[0],path[8]),t=dict[lang];[...$('board').children].forEach((b,i)=>{b.classList.toggle('powered',state.powered.has(i));b.classList.toggle('lit',i===path[8]&&state.bulb);b.querySelector('.wire').style.transform='rotate('+turns[i]*90+'deg)';b.disabled=solved;b.setAttribute('aria-label',t.tile+' '+(Math.floor(i/3)+1)+','+(i%3+1)+(i===path[0]?' · '+t.source:i===path[8]?' · '+t.target:'')+' · '+(state.powered.has(i)?t.powered:t.off));});$('boardWrap').classList.toggle('clear',solved);$('progress').textContent=t.progress+' '+(index+1)+' / 5';$('moves').textContent=t.moves+' '+moves;$('status').textContent=solved?t.clear:t.ready;$('status').className='status'+(solved?' success':'');$('reset').disabled=solved;$('dots').innerHTML=Array.from({length:5},(_,i)=>'<span class="dot '+(i<index?'done':i===index?'current':'')+'"></span>').join('');return state}
function turnTile(cell){if(screen!=='game'||solved)return;turns[cell]++;moves++;const state=paint();if(state.valid){solved=true;results[index]=moves;paint();pending=setTimeout(()=>{pending=null;if(index<4){index++;question()}else finish()},1400)}}
function show(name){screen=name;for(const id of ['setup','game','result'])$(id).hidden=id!==name}
function question(){clearTimeout(pending);pending=null;solved=false;moves=0;bases=layout(paths[index]);initial=scramble(bases,[3,4,5,7,9][index]);turns=initial.slice();buildBoard();paint()}
function labels(){const t=dict[lang];document.documentElement.lang=lang;$('language').textContent=lang==='en'?'日本語':'English';for(const id of ['tagline','start','reset','home','resultText','again','back','about','privacy','contact'])$(id).textContent=t[id];if(screen==='game')paint();if(screen==='result'){$('totalMoves').textContent=results.reduce((s,n)=>s+n,0)+' '+t.total;$('resultsList').innerHTML=results.map((n,i)=>'<span>'+t.progress+' '+(i+1)+'<br>'+n+'</span>').join('')}}
function start(){clearTimeout(pending);pending=null;index=0;results=[];show('game');question()}
function finish(){show('result');labels()}
$('start').onclick=start;$('again').onclick=start;$('reset').onclick=()=>{if(solved)return;moves=0;turns=initial.slice();buildBoard();paint()};$('home').onclick=()=>{clearTimeout(pending);pending=null;show('setup');labels()};$('language').onclick=()=>{lang=lang==='en'?'ja':'en';try{localStorage.setItem('stopit-language-v1',lang)}catch{}labels()};labels();
</script></body></html>
