<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COUNT BLOCKS! v0.2 | PLAY ROOM</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b30;color:#f2f6ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:540px;margin:auto;padding:18px 16px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:24px;margin:8px 0}small{font-size:12px;color:#b2c3dd}button{font:inherit;cursor:pointer;color:inherit;background:#243b5b;border:1px solid #758eaf;border-radius:12px;padding:12px;min-height:48px}button:focus-visible,a:focus-visible{outline:3px solid #f8d477;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.lang{padding:8px 12px}.intro{font-size:14px;color:#bfd0e9;line-height:1.6}.stats{display:flex;justify-content:space-between;padding:12px 14px;background:#1c2c48;border-radius:12px}.scene{background:radial-gradient(ellipse,#2a4260,#14213a);border:1px solid #476485;border-radius:20px;margin:14px 0;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:340px}.tools{display:flex;gap:10px}.tools button{flex:1}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.choices button{font-size:28px;font-weight:800;min-height:64px}.choices button.wrong{border-color:#ff8891;background:#713644}.choices button.correct{border-color:#8ff7bf;background:#24664f}.feedback{min-height:52px;text-align:center;font-weight:700;line-height:1.5;padding:6px}.next{width:100%;background:#24664f;font-weight:800}.hint{margin:12px 0;padding:12px;background:#22344f;border-radius:12px;line-height:1.7}.layers{display:flex;gap:12px;flex-wrap:wrap}.layer{display:grid;gap:3px;background:#122039;padding:6px;border-radius:6px}.cell{width:18px;height:18px;background:#30425b;border-radius:3px}.cell.on{background:#72d9ee;border:1px solid #c5f8ff}footer{text-align:center;font-size:12px;line-height:2;margin-top:24px;border-top:1px solid #354864;padding-top:12px}a{color:#b8dcff;margin:0 4px}[hidden]{display:none!important}.result{text-align:center;padding:36px 12px}.result strong{display:block;font-size:52px;color:#87ebc0}.preview{color:#f6d47c;font-size:12px}
</style></head><body><main><header><div><h1>COUNT BLOCKS!</h1><small>v0.2 · PLAY ROOM</small></div><button class="lang" id="language">日本語</button></header><p class="preview" id="preview"></p><p class="intro" id="intro"></p><section id="game"><div class="stats"><span id="progress"></span><span id="score"></span></div><div class="scene"><svg id="scene" viewBox="0 0 460 310" role="img" aria-label="Stacked unit cubes"></svg></div><div class="tools"><button id="rotate"></button><button id="hintBtn" hidden></button></div><div class="hint" id="hint" hidden></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" hidden></button></section><section class="result" id="result" hidden><h2 id="resultTitle"></h2><strong id="resultScore"></strong><p id="resultText"></p><button id="again"></button></section><footer><a href="/games/" id="back"></a><br><a href="/about.html" id="about"></a> · <a href="/privacy.html" id="privacy"></a> · <a href="/contact.html" id="contact"></a></footer></main><script>
'use strict';
const puzzles=[[[1,1],[1,1]],[[2,1],[1,1]],[[2,2],[2,1]],[[3,2,1],[2,1,1]],[[3,2,2],[2,2,1],[1,1,1]]];
const dict={en:{preview:'PROTOTYPE · 5 QUESTIONS',intro:'How many cubes? Count hidden cubes too. Every stack is filled from the floor, with no gaps. Rotate the view to inspect the stacks. See the layer breakdown after answering correctly.',rotate:'↻ Rotate view',hint:'Show explanation',hide:'Hide explanation',question:'Question',score:'First-try correct',correct:'CORRECT!',wrong:'Not quite. Try again.',next:'NEXT QUESTION →',finish:'SEE RESULTS →',layer:'Layer',cubes:'cubes',result:'ROUND COMPLETE!',resultText:'Score counts answers correct on the first attempt. Review the layer breakdown after each correct answer.',again:'PLAY AGAIN',back:'← PLAY ROOM',about:'About',privacy:'Privacy',contact:'Contact'},ja:{preview:'試作版 · 全5問',intro:'立方体は全部で何個？隠れた分も数えます。どの柱も床から隙間なく積まれています。向きを変えて確認できます。正解後に段ごとの内訳を見られます。',rotate:'↻ 向きを変える',hint:'数え方を見る',hide:'解説を閉じる',question:'問題',score:'一発正解',correct:'正解！',wrong:'もう少し。もう一度考えてみよう。',next:'次の問題へ →',finish:'結果を見る →',layer:'段目',cubes:'個',result:'5問クリア！',resultText:'最初の回答で正解した問題数です。正解後に段ごとの数え方を確認できます。',again:'もう一度遊ぶ',back:'← PLAY ROOMに戻る',about:'このサイトについて',privacy:'プライバシーポリシー',contact:'お問い合わせ'}};
const $=id=>document.getElementById(id);let lang='en';try{lang=localStorage.getItem('stopit-language-v1')==='ja'?'ja':'en'}catch{}
let index=0,score=0,turn=0,attempts=0,solved=false,hintOpen=false,finished=false,choices=[];const total=a=>a.flat().reduce((a,b)=>a+b,0);
function rotateMatrix(a){return a[0].map((_,i)=>a.map(row=>row[i]).reverse())}
function view(){let a=puzzles[index].map(r=>r.slice());for(let n=0;n<turn;n++)a=rotateMatrix(a);return a}
function options(n){let a=[Math.max(1,n-2),n-1,n,n+1];if(new Set(a).size!==4)a=[n,n+1,n+2,n+3];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){const a=view(),cubes=[];for(let y=0;y<a.length;y++)for(let x=0;x<a[y].length;x++)for(let z=0;z<a[y][x];z++)cubes.push({x,y,z});cubes.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.z-b.z);const wx=37,hy=18,hz=38,raw=[];let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;const face=(pts,fill)=>{pts.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)});raw.push({pts,fill})};for(const {x,y,z}of cubes){const sx=(x-y)*wx,sy=(x+y)*hy-z*hz;face([[sx-wx,sy],[sx,sy+hy],[sx,sy+hy+hz],[sx-wx,sy+hz]],'#398da9');face([[sx,sy+hy],[sx+wx,sy],[sx+wx,sy+hz],[sx,sy+hy+hz]],'#25627e');face([[sx,sy-hy],[sx+wx,sy],[sx,sy+hy],[sx-wx,sy]],'#85e3eb')}
const ox=230-(minX+maxX)/2,oy=155-(minY+maxY)/2;$('scene').innerHTML='<g transform="translate('+ox+','+oy+')">'+raw.map(f=>'<polygon points="'+f.pts.map(p=>p.join(',')).join(' ')+'" fill="'+f.fill+'" stroke="#102b43" stroke-width="2" stroke-linejoin="round"/>').join('')+'</g>';$('scene').setAttribute('aria-label',lang==='ja'?'立方体の積み重ね。向きを変えるか段ごとのヒントで確認できます。':'Stacked cubes. Use rotate or the layer hint to inspect.');renderHint()}
function renderHint(){const t=dict[lang],a=view(),max=Math.max(...a.flat());$('hint').hidden=!hintOpen||!solved;$('hint').innerHTML='';if(!hintOpen||!solved)return;const box=document.createElement('div');box.className='layers';for(let z=1;z<=max;z++){const panel=document.createElement('div'),label=document.createElement('div');const count=a.flat().filter(h=>h>=z).length;label.textContent=lang==='ja'?z+'段目：'+count+'個':t.layer+' '+z+': '+count;panel.appendChild(label);const grid=document.createElement('div');grid.className='layer';grid.style.gridTemplateColumns='repeat('+a[0].length+',18px)';for(const row of a)for(const h of row){const cell=document.createElement('span');cell.className='cell'+(h>=z?' on':'');grid.appendChild(cell)}panel.appendChild(grid);box.appendChild(panel)}$('hint').appendChild(box);const summary=document.createElement('div');summary.textContent=Array.from({length:max},(_,i)=>a.flat().filter(h=>h>=i+1).length).join(' + ')+' = '+total(a);$('hint').appendChild(summary)}
function labels(){const t=dict[lang];document.documentElement.lang=lang;$('language').textContent=lang==='en'?'日本語':'English';for(const id of ['preview','intro','back','about','privacy','contact','again'])$(id).textContent=t[id];$('rotate').textContent=t.rotate;$('hintBtn').hidden=!solved;$('hintBtn').textContent=hintOpen?t.hide:t.hint;$('progress').textContent=t.question+' '+(index+1)+' / '+puzzles.length;$('score').textContent=t.score+' '+score;$('next').textContent=index===puzzles.length-1?t.finish:t.next;$('resultTitle').textContent=t.result;$('resultText').textContent=t.resultText;if(solved)$('feedback').textContent=t.correct+' '+total(puzzles[index])+(lang==='ja'?'個':' cubes');else if(attempts)$('feedback').textContent=t.wrong;draw()}
function answer(n,button){if(solved)return;attempts++;if(n===total(puzzles[index])){solved=true;if(attempts===1)score++;button.classList.add('correct');$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').hidden=false;labels()}else{button.classList.add('wrong');button.disabled=true;$('feedback').textContent=dict[lang].wrong}}
function question(){turn=0;attempts=0;solved=false;hintOpen=false;$('feedback').textContent='';$('next').hidden=true;choices=options(total(puzzles[index]));$('choices').innerHTML='';for(const n of choices){const b=document.createElement('button');b.textContent=n;b.onclick=()=>answer(n,b);$('choices').appendChild(b)}labels()}
$('rotate').onclick=()=>{turn=(turn+1)%4;draw()};$('hintBtn').onclick=()=>{if(!solved)return;hintOpen=!hintOpen;labels()};$('language').onclick=()=>{lang=lang==='en'?'ja':'en';try{localStorage.setItem('stopit-language-v1',lang)}catch{}labels()};$('next').onclick=()=>{if(!solved)return;if(index<puzzles.length-1){index++;question()}else{finished=true;$('game').hidden=true;$('result').hidden=false;$('resultScore').textContent=score+' / '+puzzles.length;labels()}};$('again').onclick=()=>{index=0;score=0;finished=false;$('game').hidden=false;$('result').hidden=true;question()};question();
</script></body></html>
