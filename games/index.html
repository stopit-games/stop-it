<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY ROOM | Free Mini Games</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf0ff;color:#202943;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:26px 20px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:2px;font-size:18px}button{border:1px solid currentColor;border-radius:25px;background:transparent;color:inherit;padding:9px 14px;cursor:pointer;font-weight:700}h1{font-size:clamp(32px,7vw,65px);letter-spacing:-2px;line-height:1.1;margin:80px 0 12px}.lead{opacity:.7;margin:0 0 36px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{position:relative;overflow:hidden;min-height:290px;border-radius:25px;padding:25px;text-decoration:none;color:inherit;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s}.card:active{transform:scale(.98)}.art{font-size:70px;text-align:center;margin:22px 0}.card h2{margin:0;font-size:27px}.desc{opacity:.8;font-size:14px}.go{display:inline-block;margin-top:12px;font-weight:800}footer{margin-top:55px;opacity:.55;font-size:12px}@media(max-width:540px){.cards{grid-template-columns:1fr}.card{min-height:240px}h1{margin-top:55px}}body{background:linear-gradient(160deg,#eaf0ff,#f9edfc)}.card{border-radius:32px;box-shadow:0 12px 28px #5664aa22}.card:first-child{background:#fff0b9}.card:last-child{background:#d5cbff}.art{background:#ffffff88;border-radius:28px;padding:14px;max-width:180px;margin:0 auto}.go{background:#202943;color:white;padding:10px 16px;border-radius:18px;width:max-content}.brand{background:#fff;padding:12px 18px;border-radius:20px}</style></head><body><main class="wrap"><header><div class="brand">PLAY ROOM</div><button id="lang" type="button">English</button></header><h1 data-ja="ちょっと遊ぶ。<br>つい夢中。" data-en="A
